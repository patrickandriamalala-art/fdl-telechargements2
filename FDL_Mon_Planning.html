on’ i Jehovah Andriamanitrareo, koa andeha mitaraina amin’ i Jehovah."],[15,"Indrisy ny andro! Fa efa antomotra ny andron’ i Jehovah, ka tahaka ny loza tsy toha avy amin’ ny Tsitoha no fihaviny."],[16,"Moa tsy efa tapaka teo imasontsika va ny hanina, eny, ny fifaliana sy ny faharavoravoana tsy ho ao an-tranon’ Andriamanitsika?"],[17,"Matimaso ao ambanin’ ny baingan-tany ny vary nafafy, foana ny sompitra, mirodana ny trano fitehirizam-bary; Fa nalazo ny vary."],[18,"Indrisy, ny fitoreon’ ny biby! Very hevitra ny omby andiany, satria tsy misy ahitra ho azy; Eny, na dia ny andian’ ny ondry aman’ osy aza dia mijaly noho ny heloka."],[19,"Jehovah ô, Hianao no itarainako, fa efa levon’ ny afo ny kijana any an-efitra, ary nisy lelafo efa nandoro ny hazo rehetra any an-tsaha."],[20,"Na dia ny biby any an-tsaha aza dia mihanahana miandrandra Anao, satria ritra ny renirano, ary efa levon’ ny afo ny kijana any an-efitra."]]},"3":{"t":"Jaona 1, 32-34","u":"https://baiboly.org/?book=john&chapter=1&tr=mg1865","v":[[32,"Ary Jaona nanambara ka nanao hoe: Izaho nahita ny Fanahy midìna avy any an-danitra tahaka ny voro-mailala ka nitoetra teo amboniny."],[33,"Ary izaho tsy nahalala Azy; fa Izay naniraka ahy hanao batisa amin’ ny rano no nilaza tamiko hoe: Izay ho hitanao idinan’ ny Fanahy sy itoerany, dia Izy no Mpanao batisa amin’ ny Fanahy Masìna."],[34,"Ary nahita aho, ka dia nanambara fa Izy no Zanak’ Andriamanitra."]]},"4":{"t":"Asan'ny Apostoly 4, 27-31","u":"https://baiboly.org/?book=acts&chapter=4&tr=mg1865","v":[[27,"Fa efa niangona marina tokoa teto amin’ ity tanàna ity Heroda sy Pontio Pilato mbamin’ ny jentilisa sy ny olona Isiraely hanohitra ny Mpanomponao Masìna, dia Jesosy Izay nohosoranao,"],[28,"mba hanao izay notendren’ ny tananao aman-tsainao rahateo hatao."],[29,"Koa ankehitriny, Tompo ô, jereo ny fandrahonany; ary omeo anay mpanomponao ny mba hitory ny teninao amin’ ny fahasahiana rehetra,"],[30,"omban’ ny aninjiranao ny tananao hahasitrana sy ny anaovana famantarana sy fahagagana amin’ ny anaran’ i Jesosy, Mpanomponao Masìna."],[31,"Ary rehefa nivavaka izy, dia nihovitrovitra ny trano izay niangonany; dia feno ny Fanahy Masìna izy rehetra ka nitory ny tenin’ Andriamanitra tamin’ ny fahasahiana."]]}}},{"d":"2027-05-30","g":["ISAIA"],"a":{"ISAIA":["Mme Rahely","Mme Onja","Mme Germaine","Mr Haja","Mme Hanta","Mr Tafita"]},"l":{"2":{"t":"Tonon-kiran'i Solomona 6, 8-12","u":"https://baiboly.org/?book=song-of-solomon&chapter=6&tr=mg1865","v":[[8,"Misy mpanjakavavy enim-polo sy vaditsindrano valo-polo ary zatovovavy tsy hita isa."],[9,"Fa iray monja kosa no voromailalako, dia ilay ahy tsy misy kilema, vavy tokan-dreniny sady tsongaina amin’ izay naterany. Ny zazavavy nahita azy ka nanao azy ho sambatra, eny, ny mpanjakavavy sy ny vaditsindrano, ka nidera azy."],[10,"Iza moa io vehivavy mitsidika toy ny maraina, izay tsara tarehy tahaka ny volana, madio toy ny masoandro sady mahatahotra toy ny antokon’ ny miaramila mitondra faneva?"],[11,"Lasa nidina nantany an-tsaha tsara hazo aho, hijerijery ny zava-maitso an-dohasaha, hizaha raha mitsimoka ny voaloboka sy mamony ny ampongabendanitra."],[12,"Tsy nampoiziko ny nanandratan’ ny fanahiko ahy ho eo amin’ ny kalesin’ ny fireneko be voninahitra."]]},"3":{"t":"Marka 12, 35-37","u":"https://baiboly.org/?book=mark&chapter=12&tr=mg1865","v":[[35,"Ary Jesosy, raha nampianatra teo an-kianjan’ ny tempoly, dia namaly ka nanao hoe: Ahoana no lazain’ ny mpanora-dalàna fa Kristy no Zanak’ i Davida?"],[36,"Kanefa ny tenan’ i Davida dia nampilazain’ ny Fanahy Masìna hoe: Jehovah nilaza tamin’ ny Tompoko hoe: Mipetraha eo an-tanako ankavanana Ambara-panaoko ny fahavalonao ho fitoeran-tongotrao."],[37,"Ny tenan’ i Davida manao Azy hoe Tompo, koa ahoana no maha-zanany Azy? Ary ny vahoaka betsaka nihaino Azy tamin’ ny hafaliana."]]},"4":{"t":"Kolosiana 1, 9-14","u":"https://baiboly.org/?book=colossians&chapter=1&tr=mg1865","v":[[9,"Ary noho izany izahay koa hatramin’ ny andro nandrenesanay dia tsy mitsahatra mivavaka sy mangataka ho anareo, mba hofenoina fahalalana tsara ny sitrapony ianareo amin’ ny fahendrena sy ny fahazavan-tsaina rehetra avy amin’ ny Fanahy,"],[10,"mba handehananareo miendrika ny Tompo, hanaovana ny sitrapony amin’ ny zavatra rehetra, dia mahavokatra amin’ ny asa tsara rehetra sady mitombo amin’ ny fahalalana tsara an’ Andriamanitra,"],[11,"ary ampahatanjahina amin’ ny hery rehetra araka ny herin’ ny voninahiny ho amin’ ny faharetana rehetra sy ny fandeferana amin’ ny hafaliana,"],[12,"ka misaotra ny Ray, Izay nampahamendrika antsika hanana anjara amin’ ny lovan’ ny olona masìna eo amin’ ny mazava,"],[13,"sady nahafaka antsika tamin’ ny fahefan’ ny maizina ka namindra antsika ho amin’ ny fanjakan’ ny Zanany malalany,"],[14,"Izay ananantsika fanavotana, dia ny famelana ny helotsika."]]}}},{"d":"2027-06-06","g":["ESTERA","JAONA"],"a":{"ESTERA":["Mr Patrick","Mme Georgina","Mr Rochel","Mme Tatamo","Mme Voahirana","Mr Hery"],"JAONA":["Mme Sidonie","Mme Saholy","Mme Yoily","Mme Mama Li","Mr Naina","Mme Tiana"]},"l":{"2":{"t":"Genesisy 22, 15-19","u":"https://baiboly.org/?book=genesis&chapter=22&tr=mg1865","v":[[15,"Dia niantso an’ i Abrahama fanindroany tany an-danitra Ilay Anjelin’ i Jehovah"],[16,"ka nanao hoe: Ny tenako no nianianako, hoy Jehovah: Satria nanao izany zavatra izany ianao ka tsy niaro ny zanakao, ilay lahitokanao,"],[17,"dia hitahy anao tokoa Aho ary hahamaro dia hahamaro ny taranakao, ho tahaka ny kintana eny amin’ ny lanitra sy ho tahaka ny fasika izay any amoron-dranomasina; ary ny taranakao hahazo ny vavahadin’ ny fahavalony;"],[18,"ary amin’ ny taranakao no hitahiana ny firenena rehetra ambonin’ ny tany, satria nanaiky ny teniko ianao."],[19,"Ary Abrahama dia niverina nankeny amin’ ny zatovony; dia niainga izy ka niaraka nankany Beri-sheba; ary Abrahama dia nonina tany Beri-sheba."]]},"3":{"t":"Jaona 6, 52-59","u":"https://baiboly.org/?book=john&chapter=6&tr=mg1865","v":[[52,"Dia nifanditra ny Jiosy ka nanao hoe: Hataon’ ilehio ahoana re no fanome ny nofony hohanintsika?"],[53,"Fa hoy Jesosy taminy: Lazaiko aminareo marina dia marina tokoa: Raha tsy mihinana ny nofon’ ny Zanak’ olona sy misotro ny ràny ianareo, dia tsy manana fiainana ao aminareo."],[54,"Izay mihinana ny nofoko sy misotro ny rako no manana fiainana mandrakizay; ary Izaho hanangana azy amin’ ny andro farany."],[55,"Fa ny nofoko no tena fihinana, ary ny rako no tena fisotro."],[56,"Izay mihinana ny nofoko sy misotro ny rako no mitoetra ao amiko, ary Izaho kosa ao aminy."],[57,"Ary tahaka ny nanirahan’ ny Ray velona Ahy, ary Izaho koa velona amin’ ny Ray, dia tahaka izany koa izay mihinana Ahy no ho velona amiko."],[58,"Ity no mofo izay nidina avy tany an-danitra; tsy tahaka ny razana izay nihinana, nefa maty ihany; fa izay mihinana ity mofo ity dia ho velona mandrakizay."],[59,"Izany teny izany no nolazainy tao amin’ ny synagoga, raha nampianatra tao Kapernaomy Izy."]]},"4":{"t":"Asan'ny Apostoly 3, 25-26","u":"https://baiboly.org/?book=acts&chapter=3&tr=mg1865","v":[[25,"Hianareo no zanaky ny mpaminany sy ny fanekena nataon’ Andriamanitra tamin’ ny razanareo, raha hoy Izy tamin’ i Abrahama: Ary amin’ ny taranakao no hitahiana ny firenena rehetra ambonin’ ny tany."],[26,"Andriamanitra, rehefa nanangana ny Mpanompony, dia naniraka Azy ho aminareo voalohany, mitahy anareo amin’ ny fialanareo rehetra amin’ ny faharatsianareo isam-batan’ olona."]]}}},{"d":"2027-06-13","g":["ROTA","KEFASY"],"a":{"ROTA":["Mme Patricia","Mme Onja","Mme Lucie","Mme Julie","Mme Lalao","Mme Mavo"],"KEFASY":["Mr Ando","Mr Joelson","Mr Richard","Mme Sylvia","Mr Njaka","Mr Yves"]},"l":{"2":{"t":"Ohabolana 4, 1-9","u":"https://baiboly.org/?book=proverbs&chapter=4&tr=mg1865","v":[[1,"Ry zanaka, henoy ny anatry ny ray, Ary tandremo mba hahazoanareo ny fahalalana tsara."],[2,"Fa anatra tsara no omeko anareo; Aza mahafoy ny lalàko."],[3,"Fa zanak’ ikaky aho, Sady tiana no hany malala teo imason’ ineny."],[4,"Ary nampianatra ahy izy ka nanao tamiko hoe: Aoka ny fonao hitana ny teniko; Tandremo ny didiko, dia ho velona ianao."],[5,"Mahazoa fahendrena, mahazoa fahalalana; Fa aza hadinoina na ihemorana ny teny aloaky ny vavako."],[6,"Aza mahafoy azy, fa hiaro anao izy; Tiavo izy, dia hitandrina anao."],[7,"Ny voaloham-pahendrena dia izao: Mahazoa fahendrena; Eny, lanio ny fanananao rehetra hamidy fahalalana tsara."],[8,"Asandrato izy, dia hanandratra anao kosa Eny, hanome voninahitra anao izy, raha tananao."],[9,"Dia hasiany fehiloha mahafinaritra ny lohanao; Eny, satro-boninahitra tsara tarehy no homeny anao."]]},"3":{"t":"Matio 6, 31-34","u":"https://baiboly.org/?book=matthew&chapter=6&tr=mg1865","v":[[31,"Dia aza manahy ianareo ka manao hoe: Inona no hohaninay? na: Inona no hosotroinay? na: Inona no hotafinay?"],[32,"Fa izany rehetra izany dia katsahin’ ny jentilisa fatratra; fa fantatry ny Rainareo Izay any an-danitra fa tokony ho anareo izany rehetra izany."],[33,"Fa katsaho aloha ny fanjakany sy ny fahamarinany, dia hanampy ho anareo izany rehetra izany."],[34,"Ary amin’ izany dia aza manahy ny amin’ ny ampitso ianareo; fa ny ampitso hanahy ny azy. Ampy ho an’ ny andro ny ratsy miseho ao aminy."]]},"4":{"t":"1 Petera 2, 11-17","u":"https://baiboly.org/?book=1-peter&chapter=2&tr=mg1865","v":[[11,"Ry malala, mananatra anareo aho, satria vahiny sy mpivahiny ianareo, fadio ny filan’ ny nofo, fa miady amin’ ny fanahy ireny;"],[12,"ary aoka ho tsara ny fitondran-tenanareo eo amin’ ny jentilisa, mba hankalazany an’ Andriamanitra amin’ ny andro famangiana noho ny ahitany ny asa tsara ataonareo, dia izay anendrikendrehany anareo ho mpanao ratsy."],[13,"Ary noho ny Tompo dia maneke izay rehetra voatendrin’ ny olona, na ny mpanjaka, satria ambony izy,"],[14,"na ny mpanapaka, satria nirahiny hamaly izay manao ratsy izy, fa ho mpidera izay manao tsara."],[15,"Fa toy izany no sitrapon’ Andriamanitra, hampanginanareo ny tsi-fahalalan’ ny olona adala amin’ ny fanaovan-tsoa;"],[16,"fa olona afaka ianareo, nefa aza mitondra ny fahafahanareo ho fanaronana ny ratsy, fa ho toy ny mpanompon Andriamanitra."],[17,"Manajà ny olona rehetra. Tiava ny rahalahy. Matahora an’ Andriamanitra. Manajà ny mpanjaka."]]}}},{"d":"2027-06-20","g":["ISAIA","ESTERA"],"a":{"ISAIA":["Mme Holy","Mme Rahely","Mme Albertine","Mme Germaine","Mme Tiana","Mme Hanta"],"ESTERA":["Mme Lanto","Mme Tsiry","Mme Georgina","Mr Patrick","Mr Rochel","Mme Tatamo"]},"l":{"2":{"t":"Levitikosy 10, 8-11","u":"https://baiboly.org/?book=leviticus&chapter=10&tr=mg1865","v":[[8,"Ary Jehovah niteny tamin’ i Arona ka nanao hoe:"],[9,"Aza misotro divay na toaka ianao, na ny zanakao, raha miditra ao amin’ ny trano-lay fihaonana, mba tsy ho faty ianareo (ho lalàna mandrakizay amin’ ny taranakareo hatramin’ ny fara mandimby izany),"],[10,"ary mba hahaizanareo manavaka ny masìna sy ny tsy masìna, ary ny madio sy ny tsy madio,"],[11,"ary mba hampianarinareo ny Zanak’ Isiraely ny didy rehetra izay nasain’ i Jehovah holazain’ i Mosesy taminy."]]},"3":{"t":"Lioka 21, 34-36","u":"https://baiboly.org/?book=luke&chapter=21&tr=mg1865","v":[[34,"Ary mitandrema, fandrao ny fonareo hovesaran’ ny vokatry ny fisotroan-toaka sy ny fahamamoana ary ny fiahiahian’ izao fiainana izao, ka ho avy tampoka aminareo tahaka ny fandrika izany andro izany."],[35,"Fa hihatra amin’ izay rehetra mitoetra etỳ ambonin’ ny tany rehetra izany."],[36,"Fa miambena ka mivavaha mandrakariva, mba hahery ianareo ka handositra izany zavatra ho avy rehetra izany ary hitsangana eo anatrehan’ ny Zanak’ olona."]]},"4":{"t":"Efesiana 5, 15-21","u":"https://baiboly.org/?book=ephesians&chapter=5&tr=mg1865","v":[[15,"Koa tandremo tsara izay fandehanareo, mba tsy hitondranareo tena tahaka ny adala, fa tahaka ny hendry,"],[16,"ka hararaoty ny andro azo anaovan-tsoa, fa ratsy izao fiainana izao."],[17,"Ary noho izany dia aza manao adaladala, fa aoka ho fantatrareo izay sitrapon’ ny Tompo."],[18,"Ary aza ho mamon-divay ianareo, fa amin’ izany dia misy fanaranam-po amin’ ny ratsy, fa aoka hofenoina ny Fanahy,"],[19,"ka mifampilazà amin’ ny salamo sy ny fihirana ary ny tonon-kiram-panahy, dia mihira sy mikalo ao am-ponareo ho an’ ny Tompo,"],[20,"misaotra an’ Andriamanitra Ray mandrakariva noho ny zavatra rehetra, amin’ ny anaran’ i Jesosy Kristy Tompontsika,"],[21,"sady mifanaiky amin’ ny fahatahorana an’ i Kristy,"]]}}},{"d":"2027-06-27","g":["JAONA"],"a":{"JAONA":["Dr Hasina","Mr Lalaina","Mr Tovo","Mr Adolph","Mme Vero","Mme Voahirana"]},"l":{"2":{"t":"Salamo 9, 7-12","u":"https://baiboly.org/?book=psalms&chapter=9&tr=mg1865","v":[[7,"Ny amin’ ny fahavalo, dia tanteraka ho mandrakizay ny fandravàna azy; ary izay tanàna efa noravanao, dia very na dia ny fahatsiarovana azy aza."],[8,"Kanefa Jehovah mitoetra mandrakizay, efa nametraka ny sezany hitsarany Izy,"],[9,"Ary Izy hitsara izao tontolo izao amin’ ny fahamarinana, eny hitsara ny firenena amin’ ny fahitsiana Izy."],[10,"Ka dia Jehovah no ho fiarovana avo ho an’ ny mahantra, ho fiarovana avo amin’ ny andro fahoriana Izy."],[11,"Ary hatoky Anao izay mahalala ny anaranao; fa tsy foinao izay mitady Anao, Jehovah ô."],[12,"Mankalazà an’ i Jehovah, Izay mitoetra any Ziona; ambarao any amin’ ny firenena ny asany."]]},"3":{"t":"Jaona 15, 1-8","u":"https://baiboly.org/?book=john&chapter=15&tr=mg1865","v":[[1,"Izaho no tena voaloboka, ary ny Raiko no mpamboatra."],[2,"Ny sampany rehetra eo amiko izay tsy mamoa dia esoriny; fa ny sampany rehetra izay mamoa kosa dia amboariny, mba hamoa bebe kokoa."],[3,"Efa madio rahateo ianareo noho ny teniko, izay nolazaiko taminareo."],[4,"Tomoera amiko ary Izaho aminareo. Tahaka ny sampany tsy mahay mamoa ho azy, raha tsy miray amin’ ny voaloboka izy, dia toy izany koa ianareo, raha tsy miray amiko."],[5,"Izaho no voaloboka, ianareo no sampany. Izay miray amiko, ary Izaho aminy, dia mamoa be izy; fa raha misaraka amiko kosa ianareo, dia tsy mahay manao na inona na inona."],[6,"Raha misy tsy miray amiko, dia ariana eny ivelany tahaka ny sampany izy ka malazo; ary angonina izy ka atsipy ao anaty afo, dia ho may."],[7,"Raha miray amiko ianareo, ka mitoetra ao anatinareo ny teniko, dia angataho izay tianareo na inona na inona, fa ho tonga aminareo izany."],[8,"Izany no ankalazana ny Raiko, mba hamoazanareo be ka ho tonga mpianatro ianareo."]]},"4":{"t":"1 Petera 5, 1-9","u":"https://baiboly.org/?book=1-peter&chapter=5&tr=mg1865","v":[[1,"Koa ny amin’ ny loholona izay eo aminareo, izaho, izay naman ny loholona sy vavolombelon’ ny fijalian’ i Kristy ary mpiombona ny voninahitra efa haseho koa, dia mananatra azy hoe:"],[2,"Andraso ny ondrin’ Andriamanitra izay eo aminareo, mitandrina azy tsy an-terỳ, fa amin’ ny sitrapo [araka an’ Andriamanitra]; tsy amin’ ny fitiavana harena maloto, fa amin’ ny zotom-panahy; *"],[3,"tsy ho mpanjakazaka, amin’ ny anjara-fiandrasana, fa ho fianaran’ ny ondry."],[4,"Ary rehefa miseho ny Lohan’ ny mpiandry, dia hahazo ny satro-boninahitra tsy mety simba ianareo,"],[5,"Ary ianareo izay mbola tanora fanahy kosa, dia maneke ny loholona. Eny, samia misikìna fanetren-tena ianareo ka mifanompoa; fa “Andriamanitra manohitra ny miavonavona, fa manome fahasoavana ho an’ ny manetry tena”."],[6,"Koa amin’ izany manetre tena ambanin’ ny tàna-maherin’ Andriamanitra, mba hanandratany anareo amin’ ny fotoan’ andro;"],[7,"ary apetraho aminy ny fanahianareo rehetra; fa Izy no miahy anareo."],[8,"Mahonòna tena, miambena: fa ny devoly fahavalonareo mandehandeha tahaka ny liona mierona mitady izay harapany;"],[9,"tohero izy, ka miorena tsara amin’ ny finoana ianareo, satria fantatrareo fa izany fahoriana izany dia manjo ny rahalahinareo rehetra eran’ izao tontolo izao."]]}}},{"d":"2027-07-04","g":["ROTA","KEFASY"],"a":{"ROTA":["Mme Vola","Mr Parany","Mr Herimanitra","Mr Sen","Mr Jean Claude","Mr Rivo"],"KEFASY":["Mme Felana","Mme Odette","Mme Alphonsine","Mme Lea","Mme Vony","Mme Sitraka"]},"l":{"2":{"t":"1 Tantara 23, 1-5","u":"https://baiboly.org/?book=1-chronicles&chapter=23&tr=mg1865","v":[[1,"Ary nony efa ela niainana sy tratrantitra tsara Davida, dia Solomona zanany no nataony mpanjaka tamin’ ny Isiraely."],[2,"Ary novoriny ny lehiben’ ny Isiraely rehetra mbamin’ ny mpisorona sy ny Levita."],[3,"Ary nisaina ny Levita hatramin’ ny telo-polo taona no ho miakatra, ka valo arivo amby telo alina no isan’ ny lehilahy."],[4,"Ary hoy Davida: Ny efatra arivo amby roa alina amin’ ireo dia ataoko ho tonian’ ny asa ao an-tranon’ i Jehovah, ary ny enina arivo ataoko mpifehy sy mpitsara,"],[5,"ary ny efatra arivo ho mpiandry varavarana, ary ny efatra arivo ho mpidera an’ i Jehovah amin’ ny zavatra namboariko hiderana Azy."]]},"3":{"t":"Matio 10, 1-10","u":"https://baiboly.org/?book=matthew&chapter=10&tr=mg1865","v":[[1,"Ary Jesosy niantso ny mpianany roa ambin’ ny folo lahy hankeo aminy ka nanome azy fahefana hamoaka fanahy maloto sy hahasitrana ny aretina rehetra mbamin’ ny rofy rehetra."],[2,"Ary izao no anaran’ ny Apostoly roa ambin’ ny folo lahy: Ny voalohany, Simona, izay atao hoe Petera, dia Andrea rahalahiny; Jakoba, zanak’ i Zebedio, sy Jaona rahalahiny;"],[3,"Filipo sy Bartolomeo; Tomasy sy Matio mpamory hetra; Jakoba, zanak’ i Alfeo,"],[4,"sy Tadeo; Simona Kananeana ary Jodasy Iskariota, ilay namadika Azy."],[5,"Ireo roa ambin’ ny folo lahy ireo dia nirahin’ i Jesosy ka nodidiany hoe: Aza mandeha any amin’ ny lalan’ ny jentilisa, ary aza miakatra amin’ izay tanànan’ ny Samaritana,"],[6,"fa aleo mankany amin’ ny ondry very amin’ ny taranak’ isiraely."],[7,"Ary raha mandeha ianareo, dia mitoria hoe: Efa mby akaiky ny fanjakan’ ny lanitra."],[8,"Sitrano ny marary, atsangano ny maty, diovy ny boka, avoahy ny demonia; efa nahazo maimaimpoana ianareo, koa manomeza maimaimpoana."],[9,"Aza mitady volamena, na volafotsy, na varahina, ho ao anatin’ ny fehin-kibonareo,"],[10,"na kitapom-batsy ho amin’ izay haleha, na akanjo roa, na kapa na tehina; fa ny mpiasa dia miendrika hahazo ny haniny."]]},"4":{"t":"1 Korintiana 12, 27-31","u":"https://baiboly.org/?book=1-corinthians&chapter=12&tr=mg1865","v":[[27,"Ary ianareo no tenan’ i Kristy, ka samy momba ny tenany avokoa araka ny anjaranareo avy."],[28,"Ary Andriamanitra efa nanendry ny sasany teo amin’ ny fiangonana, voalohany Apostoly, faharoa mpaminany, fahatelo mpampianatra, manaraka izany dia fahagagana, dia fanomezam-pahasoavana ho enti-mahasitrana, dia fanampiana, dia fitondrana, dia fiteny samy hafa tsy fantatra."],[29,"Apostoly va izy rehetra? Mpaminany va izy rehetra? Mpampianatra va izy rehetra? Manao fahagagana va izy rehetra?"],[30,"Manana fanomezam-pahasoavana ho enti-mahasitrana va izy rehetra? Miteny amin’ ny fiteny tsy fantatra va izy rehetra? Mandika teny va izy rehetra?"],[31,"Nefa maniria fatratra ny fanomezam-pahasoavana lehibe indrindra; ary, indro, izay lalana tsara indrindra no atoroko anareo:"]]}}},{"d":"2027-07-11","g":["ISAIA","ESTERA"],"a":{"ISAIA":["Mr Tafita","Mr Haja","Mme Onja","Mme Tiana","Mme Albertine","Mme Holy"],"ESTERA":["Mme Voahirana","Mr Hery","Mme Lanto","Mme Tsiry","Mme Georgina","Mr Patrick"]},"l":{"2":{"t":"Mpitoriteny 11, 9-10","u":"https://baiboly.org/?book=ecclesiastes&chapter=11&tr=mg1865","v":[[9,"Mifalia, ry zatovo, dieny mbola tanora ianao; ary aoka ny fonao hampifalifaly anao amin’ ny andro fahatanoranao; ka mandehana any amin’ izay sitraky ny fonao sy izay jeren’ ny masonao; nefa aoka ho fantatrao fa ho entin’ Andriamanitra hotsaraina ianao amin’ izany rehetra izany."],[10,"Koa esory ao am-ponao ny alahelo, ary avilio tsy hikasika ny nofonao ny ratsy; fa ny fahatanorana sy ny fahatanjahana dia samy zava-poana."]]},"3":{"t":"Jaona 15, 11-16","u":"https://baiboly.org/?book=john&chapter=15&tr=mg1865","v":[[11,"Izany zavatra izany dia efa nolazaiko taminareo, mba ho ao aminareo ny fifaliako, ka ho tanteraka ny fifalianareo."],[12,"Izao no didiko, dia ny mba hifankatiavanareo tahaka ny nitiavako anareo."],[13,"Tsy misy manana fitiavana lehibe noho izao, dia ny manolotra ny ainy hamonjy ny sakaizany."],[14,"Hianareo no sakaizako, raha manao araka izay andidiako anareo."],[15,"Tsy hataoko hoe mpanompo intsony ianareo, fa ny mpanompo tsy mahalala izay ataon’ ny tompony; fa efa nataoko hoe sakaiza ianareo, satria izay rehetra reko tamin’ ny Raiko no nambarako taminareo."],[16,"Tsy ianareo no nifidy Ahy, fa Izaho no nifidy anareo ka nanendry anareo mba handeha sy hamoa, ary mba haharetan’ ny vokatrareo, mba homen’ ny Ray anareo izay rehetra hangatahinareo amin’ ny anarako na inona na inona."]]},"4":{"t":"1 Timoty 4, 6-12","u":"https://baiboly.org/?book=1-timothy&chapter=4&tr=mg1865","v":[[6,"Raha manoro hevitra ny rahalahy ny amin’ izany zavatra izany ianao, dia ho mpanompo tsara an’ i Kristy Jesosy, tezaina amin’ ny tenin’ ny finoana sy ny fampianarana tsara izay efa narahinao."],[7,"Fa ny anganongano ratsy fanaom-bavy antitra dia lavo, ka mampiasà ny tenanao ho amin’ ny toe-panahy araka an’ Andriamanitra."],[8,"Fa mahasoa kely ihany ny fampiasana ny tena; fa ny toe-panahy araka an’ Andriamanitra no mahasoa amin’ ny zavatra rehetra ka manana ny teny fikasana ny amin’ ny fiainana ankehitriny sy ny ho avy koa."],[9,"Mahatoky izao teny izao ka tokony hekena amin’ ny fankasitrahana rehetra."],[10,"Fa izany no ikelezanay aina sy iezahanay, satria izahay manantena an’ Andriamanitra velona, Izay Mpamonjy ny olona rehetra, indrindra fa izay mino."],[11,"Izany zavatra izany no andidio sy ampianaro."],[12,"Aoka tsy hisy olona hanao tsinontsinona anao noho ny hatanoranao; fa aoka ho tonga fianarana ho an’ ny mino ianao amin’ ny fiteny, amin’ ny fitondran-tena, amin’ ny fitiavana, amin’ ny finoana, amin’ ny fahadiovana."]]}}},{"d":"2027-07-18","g":["JAONA","ROTA"],"a":{"JAONA":["Mme Saholy","Mme Sidonie","Mme Mama Li","Mme Yoily","Mme Tiana","Mr Naina"],"ROTA":["Mme Tsiory","Mme Patricia","Mme Onja","Mme Lucie","Mme Mavo","Mme Lalao"]},"l":{"2":{"t":"Nomery 16, 23-35","u":"https://baiboly.org/?book=numbers&chapter=16&tr=mg1865","v":[[23,"Ary Jehovah niteny tamin’ i Mosesy ka nanao hoe:"],[24,"Mitenena amin’ ny fiangonana, ka lazao hoe: Mihataha tsy hanodidina ny lain’ i Kora sy Datana ary Abìrama."],[25,"Dia nitsangana Mosesy ka nankeo amin’ i Datana sy Abìrama; ary nanaraka azy ny loholon’ ny Isiraely."],[26,"Dia niteny tamin’ ny fiangonana izy ka nanao hoe: Mialà amin’ ny lain’ ireo olon-dratsy ireo, ka aza mikasika izay azy akory, fandrao haringana koa ianareo noho ny fahotany rehetra."],[27,"Dia nihataka ny olona mba tsy ho eo akaikin’ ny lain’ i Kora sy Datana ary Abìrama; ary Datana sy Abìrama nivoaka ka nijanona teo anoloan’ ny varavaran’ ny lainy mbamin’ ny vadiny sy ny zananilahy ary ny zanany madinika."],[28,"Dia hoy Mosesy: Izao no hahafantaranareo fa Jehovah no naniraka ahy hanao ireny asa rehetra ireny, fa tsy avy tamin’ ny saiko izany:"],[29,"Raha maty toy ny fahafatin’ ny olona rehetra ireo olona ireo, na valiana araka ny famaliana ny olona rehetra izy, dia tsy Jehovah no naniraka ahy."],[30,"Fa raha hanao zavatra vaovao kosa Jehovah, ka hisokatra ny tany ary hitelina azy mbamin’ izay azy rehetra, ka ho latsaka velona any amin’ ny fiainan-tsi-hita’ izy, dia ho fantatrareo fa efa nandà an’ i Jehovah ireo lehilahy ireo."],[31,"Ary rehefa tapitra voalazany izany teny rehetra izany, dia nivava ny tany izay teo ambaniny;"],[32,"eny, nisokatra ny tany ka nitelina azy sy ny ankohonany mbamin’ ny olona rehetra izay an’ i Kora ary ny fananany rehetra."],[33,"Dia latsaka velona ho any amin’ ny fiainan-tsi-hita izy mbamin’ izay azy rehetra; ary ny tany dia nikatona taminy, ka fongotra tsy ho amin’ ny fiangonana intsony izy."],[34,"Ary ny Isiraely rehetra izay nanodidina azy dia nandositra noho ny fidradradradrany; fa hoy izy: Andrao hitelina antsika koa ny tany."],[35,"Ary nisy afo nivoaka avy tamin’ i Jehovah ka nandevona ny lehilahy dimam-polo amby roan-jato izay nanatitra ditin-kazo manitra."]]},"3":{"t":"Lioka 10, 1-12","u":"https://baiboly.org/?book=luke&chapter=10&tr=mg1865","v":[[1,"Ary nony afaka izany, ny Tompo nanendry olona hafa koa, dia fito-polo lahy, ka naniraka azy tsiroaroa hialoha Azy any amin’ ny tanàna sy ny tany rehetra izay efa halehany."],[2,"Ary hoy Izy taminy: Be ny vokatra, fa ny mpiasa no vitsy; koa amin’ izany mangataha amin’ ny Tompon’ ny vokatra mba hampandehanany mpiasa hamory ny vokatra."],[3,"Mandehana; indro, Izaho maniraka anareo tahaka ny zanak’ ondry eo ampovoan’ ny amboadia."],[4,"Aza mitondra kitapom-bola, na kitapom-batsy, na kapa; ary aza miarahaba olona akory eny an-dalana."],[5,"Ary izay trano idiranareo, dia lazao aloha hoe: Fiadanana ho amin’ ity trano ity."],[6,"Ary raha misy zanaky ny fiadanana ao, dia hitoetra ao aminy ny fiadanana tononinareo; fa raha tsy izany, dia hiverina ho aminareo ihany izany."],[7,"Ary mitoera ao amin’ izany trano izany, ka mihinàna sy misotroa izay zavatra omeny; fa ny mpiasa miendrika hahazo ny karamany. Aza mifindrafindra trano."],[8,"Ary izay tanàna iakaranareo, ka mandray anareo ny olona, dia hano izay zavatra aroso eo anoloanareo."],[9,"Ary sitrano izay marary ao, ka lazao amin’ ny olona hoe: Efa mby akaiky anareo ny fanjakan’ Andriamanitra."],[10,"Fa izay tanàna iakaranareo, ka tsy mandray anareo kosa ny olona, dia mankanesa eo amin’ ny lalambe, ka lazao hoe:"],[11,"Ny vovoky ny tanànanareo aza, izay miraikitra amin’ ny tongotray, dia fafànay hiampanga anareo; nefa aoka ho fantatrareo fa efa mby akaiky anareo ny fanjakan’ Andriamanitra."],[12,"Lazaiko aminareo fa ho moramora kokoa ny ho amin’ i Sodoma amin’ izany andro izany noho ny ho amin’ izany tanàna izany."]]},"4":{"t":"1 Korintiana 14, 12-19","u":"https://baiboly.org/?book=1-corinthians&chapter=14&tr=mg1865","v":[[12,"Ary toy izany ihany koa ianareo: raha fatra-paniry ny zava-panahy, dia izay hampandroso ny fiangonana no tadiavo indrindra."],[13,"Koa aoka izay miteny amin’ ny fiteny tsy fantatra hangataka mba hahay mandika teny koa."],[14,"Fa raha mivavaka amin’ ny fiteny tsy fantatra aho, dia ny fanahiko ihany no mivavaka, fa ny saiko kosa tsy mahavanona."],[15,"Ahoana ary no izy? Sady hivavaka am-panahy no hivavaka an-tsaina koa aho; sady hihira am-panahy no hihira an-tsaina koa aho."],[16,"Fa raha misaotra am-panahy fotsiny ihany ianao, hataon’ izay tsy mahay ahoana no hanao Amena, raha misaotra ianao? satria tsy mahalala izay lazainao Izy."],[17,"Fa ianao dia misaotra tsara ihany, nefa ny hafa kosa tsy mba ampandrosoina."],[18,"Misaotra an’ Andriamanitra aho fa miteny amin’ ny fiteny tsy fantatra mihoatra noho ianareo rehetra aho;"],[19,"nefa raha ao am-piangonana, dia aleoko manao teny dimy fantatry ny saiko mba hampianarako ny sasany koa, toy izay hanao teny iray alina amin’ ny fiteny tsy fantatra."]]}}},{"d":"2027-07-25","g":["KEFASY"],"a":{"KEFASY":["Mr Joelson","Mr Ando","Mme Sylvia","Mr Richard","Mr Yves","Mr Njaka"]},"l":{"2":{"t":"Josoa 1, 1-9","u":"https://baiboly.org/?book=joshua&chapter=1&tr=mg1865","v":[[1,"Ary rehefa maty Mosesy, mpanompon’ i Jehovah, dia hoy Jehovah tamin’ i Josoa, zanak’ i Nona, mpanompon’ i Mosesy:"],[2,"Efa maty Mosesy mpanompoko; koa mitsangàna, mità ity Jordana ity ianao sy ireo olona rehetra ireo ho any amin’ ny tany izay omeko azy, dia ny Zanak’ Isiraely."],[3,"Ny tany rehetra izay hodiavin’ ny faladianareo dia efa nomeko anareo, araka izay voalazako tamin’ i Mosesy."],[4,"Hatramin’ ny efitra sy iry Libanona iry ary hatramin’ ny ony lehibe, dia ny ony Eofrata, ny tany rehetra izay an’ ny Hetita, ka hatramin’ ny Ranomasina Lehibe any andrefana no ho taninareo."],[5,"Tsy hisy olona hahajanona eo anoloanao amin’ ny andro rehetra hiainanao; tahaka ny nombako an’ i Mosesy no hombako anao koa; tsy handao anao na hahafoy anao Aho."],[6,"Mahereza sy matanjaha; fa ianao no hampandova ity firenena ity ny tany izay nianianako tamin’ ny razany homena azy."],[7,"Koa mahereza sy matanjaha tsara ianao, hitandremanao hanao araka ny lalana rehetra, izay nandidian’ i Mosesy mpanompoko anao; aza miala aminy, na ho amin’ ny ankavanana, na ho amin’ ny ankavia, mba hambinina ianao amin’ izay rehetra alehanao."],[8,"Aoka tsy hiala amin’ ny vavanao ity bokin’ ny lalàna ity, fa saintsaino andro aman’ alina, hitandremanao hanao araka izay rehetra voasoratra eo; ary amin’ izany dia hahalavorary ny lalanao ianao sady hambinina."],[9,"Tsy efa nandidy anao va Aho? Koa mahereza sy matanjaha; aza matahotra na mivadi-po, fa momba anao Jehovah Andriamanitrao amin’ izay rehetra alehanao."]]},"3":{"t":"Jaona 14, 12-14","u":"https://baiboly.org/?book=john&chapter=14&tr=mg1865","v":[[12,"Lazaiko aminareo marina dia marina tokoa: Izay mino Ahy, ny asa ataoko no hataony koa; ary hanao asa lehibe noho izany aza izy, satria Izaho mankany amin’ ny Ray."],[13,"Ary na inona na inona no hangatahinareo amin’ ny anarako, dia hataoko izany, mba hankalazana ny Ray eo amin’ ny Zanaka."],[14,"Raha mangataka zavatra amiko amin’ ny anarako ianareo, dia hataoko izany."]]},"4":{"t":"Asan'ny Apostoly 13, 1-5","u":"https://baiboly.org/?book=acts&chapter=13&tr=mg1865","v":[[1,"Ary teo amin’ ny fiangonana tany Antiokia nisy mpaminany sy mpampianatra: Barnabasy sy Simeona, izay atao hoe Nigera, sy Losio Kyreniana sy Menahema (izay niolonono tamin’ i Heroda mpanapaka) ary Saoly."],[2,"Ary raha nanao fanompoam-pivavahana ho an’ ny Tompo sy nifady hanina ireo, dia hoy ny Fanahy Masìna: Atokàny ho Ahy Barnabasy sy Saoly hanao ny asa izay efa niantsoako azy."],[3,"Ary rehefa nifady hanina sy nivavaka ary nametra-tanana taminy izy, dia nandefa azy."],[4,"Ary rehefa nirahin’ ny Fanahy Masìna izy roa lahy, dia nidina nankany Seleokia izy ka niondrana an-tsambo teo hankany Kyprosy."],[5,"Ary nony tonga tany Salamisy izy, dia nitory ny tenin’ Andriamanitra teny amin’ ny synagogan’ ny Jiosy; ary nitondra an’ i Jaona koa ho mpanampy azy izy."]]}}},{"d":"2027-08-01","g":["ISAIA","ESTERA"],"a":{"ISAIA":["Mme Hanta","Mme Germaine","Mme Rahely","Mr Tafita","Mr Haja","Mme Onja"],"ESTERA":["Mr Rochel","Mme Tatamo","Mr Hery","Mme Voahirana","Mme Lanto","Mme Tsiry"]},"l":{"2":{"t":"Deoteronomia 31, 1-8","u":"https://baiboly.org/?book=deuteronomy&chapter=31&tr=mg1865","v":[[1,"Ary Mosesy nandeha, dia nilaza izao teny izao tamin’ ny Isiraely rehetra"],[2,"ka nanao taminy hoe: Efa roa-polo amby zato taona androany aho ka tsy afa-mivoaka sy miditra intsony, ary Jehovah efa nilaza tamiko hoe: Tsy hita io Jordana io ianao."],[3,"Jehovah Andriamanitrao no hita eo alohanao, ary Izy no handringana ireo firenena ireo tsy ho eo anoloanao, ka hahazo ny taniny ianao; ary Josoa no hita eo alohanao, araka izay efa nolazain’ i Jehovah."],[4,"Ary Jehovah hanao amin’ ireo tahaka ny nataony tamin’ i Sihona sy Oga, mpanjakan’ ny Amorita, izay naringany, sy tahaka ny nataony tamin’ ny taniny."],[5,"Dia hatolotr’ i Jehovah eo anoloanareo ireo hanaovanareo azy araka ny lalàna rehetra izay nandidiako anareo."],[6,"Mahereza sy matanjaha; aza matahotra na manahy azy; fa Jehovah Andriamanitrao no miara-mandeha aminao; tsy handao anao na hahafoy anao Izy."],[7,"Ary Mosesy niantso an’ i Josoa ka niteny taminy teo imason’ ny Isiraely rehetra hoe: Mahereza sy matanjaha; fa ianao sy ity firenena ity dia hiara-miditra ao amin’ ny tany izay nianianan’ i Jehovah tamin’ ny razany homena azy; ary ianao no hampandova azy izany."],[8,"Ary Jehovah no mandeha eo alohanao; ary Izy no hiaraka aminao; tsy handao anao na hahafoy anao Izy; koa aza matahotra na mivadi-po ianao."]]},"3":{"t":"Matio 14, 24-36","u":"https://baiboly.org/?book=matthew&chapter=14&tr=mg1865","v":[[24,"Ary efa mby teo ampovoan’ ny ranomasina ny sambokely tamin’ izay, dia natopatopan’ ny alon-drano izy, fa notohain’ ny rivotra."],[25,"Ary tamin’ ny fiambenana fahefatra amin’ ny alina dia nankeny amin’ ny mpianany Jesosy, nitsangantsangana teny ambonin’ ny ranomasina."],[26,"Ary nony nahita Azy nitsangantsangana tambonin’ ny ranomasina ny mpianatra, dia raiki-tahotra ka nanao hoe: Matoatoa io; dia niantso izy noho ny tahotra."],[27,"Ary Jesosy niteny taminy niaraka tamin’ izay hoe: Matokia, fa Izaho ihany, aza matahotra."],[28,"Ary Petera namaly Azy ka nanao hoe: Tompoko, raha Hianao ihany, dia asaovy manatona Anao eny ambonin’ ny rano aho."],[29,"Ary hoy Izy: Manatona. Dia nidina niala tamin’ ny sambokely Petera ka nandeha tambonin’ ny rano hanatona an’ i Jesosy."],[30,"Fa raha nahita ny rivotra izy, dia natahotra, ary raha vao nilentika izy, dia niantso hoe: Tompo ô, vonjeo aho!"],[31,"Ary naninjitra ny tànany niaraka tamin’ izay Jesosy, dia nandray azy ka nanao taminy hoe: Ry kely finoana, nahoana no niahanahana ianao?"],[32,"Ary rehefa niakatra teo an-tsambokely izy, dia nitsahatra ny rivotra."],[33,"Ary izay teo an-tsambokely dia niankohoka teo anatrehany ka nanao hoe: Zanak’ Andriamanitra tokoa Hianao."],[34,"Ary nony tafita izy, dia tonga teo an-tanety, any Genesareta."],[35,"Ary nony nahafantatra Azy ny tompon-tany teo, dia naniraka tany amin’ ny tany rehetra manodidina izy ka nitondra ny marary rehetra ho eo aminy."],[36,"Ary nangataka taminy ireo mba hamela azy hanendry na dia ny somotraviavin-dambany ihany aza; koa na iza na iza no nanendry dia sitrana tokoa."]]},"4":{"t":"Asan'ny Apostoly 4, 13-22","u":"https://baiboly.org/?book=acts&chapter=4&tr=mg1865","v":[[13,"Ary nony nahita ny fahasahisahian’ i Petera sy Jaona izy, sady nahalala fa tsy mba mpahay lalàna na nampianarina izy roa lahy, dia gaga izy; ary fantany tsara fa efa niaraka tamin’ i Jesosy izy roa lahy."],[14,"Ary nony nijery ny lehilahy izay efa sitrana nitsangana teo aminy izy, dia tsy hitany izay havaliny."],[15,"Ary rehefa nasainy niala teo amin’ ny Synedriona izy roa lahy, dia niara-nisaina izy"],[16,"ka nanao hoe: Hataontsika ahoana ireo lehilahy ireo? fa efa nanao famantarana malaza tokoa izy, ary fantatry ny mponina rehetra eto Jerosalema izany, ka tsy azontsika lavina."],[17,"Fa mba tsy hielezan’ izany intsony amin’ ny vahoaka, dia aoka horahonantsika izy mba tsy hiteny amin’ izany anarana izany intsony na amin’ iza na amin’ iza."],[18,"Ary niantso azy izy ka nandrara azy tsy hiteny na hampianatra amin’ ny anaran’ i Jesosy intsony."],[19,"Fa Petera sy Jaona kosa namaly azy ka nanao hoe: Tsaraonareo na marina eo imason’ Andriamanitra, na tsia, ny hanaiky anareo mihoatra noho Andriamanitra."],[20,"Fa izahay tsy maintsy milaza izay zavatra efa hitanay sy renay."],[21,"Ary rehefa norahonany indray izy, dia nalefany; fa tsy hitany izay hampijaliany azy noho ny tahony ny vahoaka; satria izy rehetra nankalaza an’ Andriamanitra noho ny amin’ ny zavatra efa natao."],[22,"Fa efa tsy omby efa-polo taona ralehilahy izay nanaovana izany famantarana nahasitrana azy izany."]]}}},{"d":"2027-08-08","g":["JAONA","ROTA"],"a":{"JAONA":["Mr Lalaina","Dr Hasina","Mme Voahirana","Mme Vero","Mr Adolph","Mr Tovo"],"ROTA":["Mme Julie","Mr Jean Claude","Mr Sen","Mr Parany","Mr Rivo","Mme Vola"]},"l":{"2":{"t":"Salamo 40, 1-10","u":"https://baiboly.org/?book=psalms&chapter=40&tr=mg1865","v":[[1,"Ho an’ ny mpiventy hira. Salamo nataon’ i Davida."],[2,"Niandry dia niandry an’ i Jehovah aho; ary nitodika nitsinjo ahy Izy ka nandre ny fitarainako."],[3,"Dia nampakatra ahy avy tao amin’ ny lavaka fandringanana Izy, eny, tamin’ ny fotaka mandrevo; ary nampitoetra ny tongotro teo ambony vatolampy Izy ka nampijoro ahy."],[4,"Ary nanisy fihiram-baovao teo am-bavako Izy, dia fideràna an’ Andriamanitsika; maro no hahita sy hatahotra ary hatoky an’ i Jehovah."],[5,"Sambatra izay olona manao an’ i Jehovah ho tokiny, ka tsy mivily ho naman’ ny mpiavonavona na ny mpivadika ho amin’ ny lainga."],[6,"Nohamaroinao ny fahagaganao sy ny hevitrao izay nataonao ho anay, Jehovah Andriamanitra ô. Tsy misy azo ampitahaina aminao Raha tiako hambara sy holazaina ireny, dia, indro, maro loatra izy ka tsy tambo isaina."],[7,"Ny fanatitra alatsa-drà sy ny fanatitra hohanina tsy mba sitrakao ny sofiko nataonao malady ny fanatitra dorana sy ny fanatitra noho ny ota tsy mba nilainao;"],[8,"Dia hoy izaho: inty aho tonga ao amin’ ny horonam-boky no nanoratana ahy."],[9,"Ny hanao ny sitraponao, Andriamanitra ô, no sitrako; ary ny lalanao no ato anatiko."],[10,"Efa nilaza teny mahafaly ny amin’ ny fahamarinana teo amin’ ny fiangonana lehibe aho; indro ny molotro tsy mba nakomboko; Jehovah ô, Hianao no mahalala."]]},"3":{"t":"Lioka 12, 4-7","u":"https://baiboly.org/?book=luke&chapter=12&tr=mg1865","v":[[4,"Ary lazaiko aminareo sakaizako hoe: Aza matahotra izay mamono ny tena, nefa nony afaka izany, dia tsy mahay manao mihoatra noho izany."],[5,"Fa hasehoko anareo izay hatahoranareo: Matahora Izay manam-pahefana hanary any amin’ ny helo, rehefa novonoiny; eny, hoy Izaho aminareo: Matahora Azy."],[6,"Tsy eranambatry va no vidin’ ny tsintsina dimy? nefa tsy misy hadinoina eo anatrehan’ Andriamanitra ireny na dia iray akory aza."],[7,"Fa na dia ny volon-dohanareo aza dia voaisa avokoa. Aza matahotra; fa mihoatra noho ny tsintsina maro ianareo."]]},"4":{"t":"Asan'ny Apostoly 5, 26-32","u":"https://baiboly.org/?book=acts&chapter=5&tr=mg1865","v":[[26,"Dia lasa ny lehiben’ ny mpiambina sy ny mpiandry raharaha ka nitondra azy, nefa tsy nanao mahery, satria natahotra ny vahoaka izy, fandrao hotorahany vato."],[27,"Ary rehefa nentiny, dia napetrany teo anatrehan’ ny Synedriona ireo, ary ny mpisoronabe nanontany azy"],[28,"ka nanao hoe: Efa noraranay mafy dia mafy ianareo tsy hampianatra amin’ izany anarana izany; kanjo, indro, efa nofenoinareo ny fampianaranareo Jerosalema, ka tianareo hankinina aminay ny ran’ izany Lehilahy izany."],[29,"Fa Petera sy ny Apostoly namaly ka nanao hoe: Andriamanitra no tokony hekena mihoatra noho ny olona."],[30,"Andriamanitry ny razantsika efa nanangana an’ i Jesosy, Izay novonoin’ ny tananareo nahantonareo teo amin’ ny hazo."],[31,"Izy nasandratry ny tanana ankavanan’ Andriamanitra ho Tompo sy Mpamonjy, hanome fibebahana sy famelan-keloka ho an’ ny Isiraely."],[32,"Ary izahay dia vavolombelon’ izany zavatra izany, ary ny Fanahy Masìna koa, Izay efa nomen’ Andriamanitra ny manaiky Azy."]]}}},{"d":"2027-08-15","g":["KEFASY","ISAIA"],"a":{"KEFASY":["Mme Lea","Mme Alphonsine","Mme Odette","Mme Felana","Mme Sitraka","Mme Vony"],"ISAIA":["Mme Tiana","Mme Albertine","Mme Holy","Mme Hanta","Mme Germaine","Mme Rahely"]},"l":{"2":{"t":"Isaia 41, 8-13","u":"https://baiboly.org/?book=isaiah&chapter=41&tr=mg1865","v":[[8,"Fa ianao kosa, ry Isiraely mpanompoko, sy Jakoba, izay nofidiko, Taranak’ i Abrahama sakaizako,"],[9,"Hianao izay efa notantanako avy tany amin’ ny faran’ ny tany ary nantsoiko avy tany an-tsisiny ka nilazako hoe: Mpanompoko ianao, Efa nofidiko ka tsy mba nariako:"],[10,"Aza matahotra ianao, fa momba anao Aho; Ary aza miherikerika foana, fa Izaho no Andriamanitrao; Mampahery anao Aho sady mamonjy anao; Eny, mitantana anao amin’ ny tanana ankavanan’ ny fahamarinako Aho."],[11,"Indro, ho menatra sy hangaihay izay rehetra tezitra aminao, ho tsinontsinona izy; Eny, ho levona izay miady aminao."],[12,"Hotadiavinao izay mifanditra aminao, fa tsy ho hitanao, ary ho tahaka ny tsinontsinona sy ny zava-poana izay miady aminao."],[13,"Fa Izaho Jehovah Andriamanitrao no mitantana ny tananao ankavanana, dia ilay manao aminao hoe: Aza matahotra, Izaho no hamonjy anao."]]},"3":{"t":"Marka 5, 35-43","u":"https://baiboly.org/?book=mark&chapter=5&tr=mg1865","v":[[35,"Raha mbola niteny Jesosy, dia nisy tonga avy tany amin’ ilay mpanapaka ny synagoga ka nanao hoe: Efa maty ny zanakao-vavy; nahoana ianao no mbola manahirana ny Mpampianatra ihany?"],[36,"Fa tsy nahoan’ i Jesosy izany teny nataony izany, fa hoy Izy tamin’ ilay mpanapaka ny synagoga: Aza matahotra, minoa fotsiny ihany."],[37,"Ary tsy nisy olona navelany hanaraka Azy afa-tsy Petera sy Jakoba ary Jaona, rahalahin’ i Jakoba."],[38,"Ary dia tonga tao an-tranon’ ilay mpanapaka ny synagoga izy ireo, ka hitan’ i Jesosy ny tabataba, dia ny olona izay nitomany sy ninaonaona be ihany."],[39,"Ary rehefa niditra Izy, dia niteny taminy hoe: Nahoana ianareo no mitabataba sy mitomany? Tsy maty razazavavy, fa matory."],[40,"Dia nihomehy Azy fatratra ny olona. Fa nandroaka azy rehetra Izy, dia nitondra ny ray aman-drenin-drazazavavy mbamin’ izay olona teo aminy ka niditra tao amin’ izay nisy an-drazazavavy."],[41,"Dia nandray ny tànan-drazazavavy Izy ka niteny taminy hoe: Talita komy, izany hoe, raha adika: Ry zazavavy, hoy Izaho aminao: Mitsangàna."],[42,"Dia nitsangana niaraka tamin’ izay razazavavy ka afa-nandeha; fa efa roa ambin’ ny folo taona izy. Ary niaraka tamin’ izay dia talanjona indrindra ny olona."],[43,"Ary Jesosy nandrara azy mafy mba tsy ho fantatr’ olona izany; ary nasainy nomena hanina razazavavy."]]},"4":{"t":"Kolosiana 2, 4-7","u":"https://baiboly.org/?book=colossians&chapter=2&tr=mg1865","v":[[4,"Ary izany no lazaiko, fandrao hisy hampahadiso hevitra anareo amin’ ny teny toa marina."],[5,"Fa na dia tsy manatrika anareo amin’ ny nofo aza aho, dia manatrika anareo ihany amin’ ny fanahy ka mifaly sy mijery ny filaminanareo sy ny tsi-fiovan’ ny finoanareo an’ i Kristy."],[6,"Koa tahaka ny nandraisanareo an’ i Kristy Jesosy Tompo, dia mandehana ao aminy araka izany koa,"],[7,"ka mamaka tsara sy miorina mafy ao aminy ary tafatoetra amin’ ny finoana, toy ny efa nampianarana anareo, ka mazoto amin’ ny fisaorana."]]}}},{"d":"2027-08-22","g":["ESTERA","JAONA"],"a":{"ESTERA":["Mme Georgina","Mr Patrick","Mme Tatamo","Mr Rochel","Mr Hery","Mme Voahirana"],"JAONA":["Mme Mama Li","Mme Yoily","Mme Tiana","Mr Naina","Mme Sidonie","Mme Saholy"]},"l":{"2":{"t":"Ohabolana 16, 1-9","u":"https://baiboly.org/?book=proverbs&chapter=16&tr=mg1865","v":[[1,"Ny fikasan’ ny fo no amin’ ny olona; Fa ny famalian’ ny lela dia avy amin’ i Jehovah."],[2,"Ataon’ ny olona ho madio avokoa ny lalana rehetra alehany; Fa Jehovah ihany no mpandanja ny fanahy."],[3,"Ankino amin’ i Jehovah ny asanao, Dia ho lavorary izay kasainao."],[4,"Ny zavatra rehetra nataon’ i Jehovah dia samy misy antony avokoa; Eny, ny ratsy fanahy koa aza dia nataony ho amin’ ny andro hahitan-doza."],[5,"Fahavetavetana eo imason’ i Jehovah izay rehetra miavonavona am-po, Azo itompoana tokoa fa tsy maintsy hampijalina izy."],[6,"Ny famindram-po sy ny fahamarinana no avotra amin’ ny heloka; Ary ny fahatahorana an’ i Jehovah no analavirana ny ratsy."],[7,"Raha sitrak’ i Jehovah ny alehan’ ny olona, Na dia ny fahavalony aza dia hampihavaniny aminy."],[8,"Aleo ny kely omban’ ny fahamarinana Toy izay ny harem-bevava azo amin’ ny tsy rariny."],[9,"Ny fon’ ny olona mihevitra tsara ny halehany; Fa Jehovah ihany no mahalavorary ny diany."]]},"3":{"t":"Matio 10, 16-20","u":"https://baiboly.org/?book=matthew&chapter=10&tr=mg1865","v":[[16,"Indro, Izaho maniraka anareo ho tahaka ny ondry ao ampovoan’ ny amboadia; koa hendre tahaka ny menarana, ary morà tahaka ny voromailala."],[17,"Ary mitandrema ianareo noho ny amin’ ny olona; fa hatolony ho amin’ ny Synedriona sy hokapohiny ao amin’ ny synagogany ianareo;"],[18,"ary ho entiny eo anatrehan’ ny mpanapaka sy ny mpanjaka ianareo noho ny amiko, ho vavolombelona aminy sy amin’ ny jentilisa."],[19,"Fa raha manolotra anareo izy, dia aza manahy ny amin’ izay fomba hitenenanareo, na izay holazainareo; Fa homena anareo amin izany ora izany izay holazainareo."],[20,"Fa tsy ianareo no miteny, fa ny Fanahin’ ny Rainareo no miteny ao anatinareo."]]},"4":{"t":"Romana 12, 9-13","u":"https://baiboly.org/?book=romans&chapter=12&tr=mg1865","v":[[9,"Aoka ny fitiavana ho amin’ ny tsi-fihatsaram-belatsihy; mankahalà ny ratsy; mifikira amin’ ny tsara."],[10,"Mifankatiava araka ny fifankatiavan’ ny mpirahalahy; mitariha lalana amin’ ny fifanomezam-boninahitra."],[11,"Mazotoa, fa aza malaina, ary aoka hafana fo amin’ ny fanompoana ny Tompo."],[12,"Mifalia amin’ ny fanantenana; miareta amin’ ny fahoriana; mahareta amin’ ny fivavahana."],[13,"Miantrà ny olona masìna araka izay ilainy; mazotoa mampiantrano vahiny."]]}}},{"d":"2027-08-29","g":["ROTA"],"a":{"ROTA":["Mr Herimanitra","Mme Tsiory","Mme Patricia","Mme Lalao","Mme Lucie","Mme Onja"]},"l":{"2":{"t":"Joba 31, 13-23","u":"https://baiboly.org/?book=job&chapter=31&tr=mg1865","v":[[13,"Raha tàhiny aho nandà ny rariny izay an’ ny ankizilahiko na ny ankizivaviko, raha nifamaly tamiko izy,"],[14,"Dia inona no hataoko, raha hitsangana Andriamanitra? Ary ahoana no havaliko Azy, raha handinika Izy?"],[15,"Fa moa tsy Izay nanao ahy tany an-kibo ihany va no nanao azy koa? Ary tsy Iray ihany va no namorona anay tany am-bohoka?"],[16,"Raha tàhiny aho nandà Izay nirin’ ny malahelo ka nahapahina ny mason’ ny mpitondratena,"],[17,"Na nihinana ny sombin-kaniko irery, ka tsy mba nihinanan’ ny kamboty"],[18,"(Fa tsy izany, fa hatry ny fony mbola tanora aho, dia notezaina teo amiko tahaka ny zanaka ny kamboty, Ary nitondra ny mpitondratena hatrany an-kibon-dreniko aho);"],[19,"Raha tàhiny aho nahita olona efa ho faty noho ny tsi-fananan-damba. Na malahelo tsy manan-kitafy,"],[20,"Koa tsy nankasitraka ahy ny tenany, ary tsy nanafàna azy ny volon’ ondriko;"],[21,"Raha tahìny aho naninjitra ny tanako hampahory ny kamboty, saingy hitako fa nisy niandany tamiko teo am-bavahady:"],[22,"Dia aoka ny foto-tsandriko hitsoaka hiala amin’ ny rangomainako, eny, aoka ny sandriko ho latsaka hiala amin’ ny taolam-panaviko."],[23,"Fa mampahatahotra ahy ny loza avy amin’ Andriamanitra, ka tsy mahavita na inona na inona aho noho ny fahalehibiazany."]]},"3":{"t":"Jaona 16, 29-33","u":"https://baiboly.org/?book=john&chapter=16&tr=mg1865","v":[[29,"Hoy ny mpianany: Indro, milaza tsotra Hianao ankehitriny, fa tsy manao fanoharana akory."],[30,"Ankehitriny dia fantatray fa mahalala ny zavatra rehetra Hianao ka tsy mitady olona hanontany Anao; izany no inoanay fa nivoaka avy tamin’ Andriamanitra Hianao."],[31,"Jesosy namaly azy hoe: Mino va ianareo ankehitriny?"],[32,"Indro, avy ny andro, eny, efa tonga, izay hielezanareo samy ho any amin’ ny azy avy, ary hilaozanareo ho irery Aho; kanefa tsy irery Aho, fa ny Ray no ato amiko."],[33,"Izany teny izany efa nolazaiko taminareo mba hanananareo fiadanana amiko. Atỳ amin’ izao tontolo izao no ahitanareo fahoriana; nefa matokia; Izaho efa naharesy izao tontolo izao."]]},"4":{"t":"2 Korintiana 4, 7-11","u":"https://baiboly.org/?book=2-corinthians&chapter=4&tr=mg1865","v":[[7,"Fa manana izao rakitra izao amin’ ny vilany tany izahay, mba ho an’ Andriamanitra ny halehiben’ ny hery, fa tsy ho avy aminay."],[8,"Voageja manodidina izahay, nefa tsy terỳ; very hevitra, nefa tsy mamoy fo;"],[9,"enjehina, nefa tsy nafoy, potraka, nefa tsy maty;"],[10,"mitondra ny fahafatesan’ i Jesosy mandrakariva ao amin’ ny tena izahay, mba haseho ao amin’ ny tenanay koa ny fiainan’ i Jesosy."],[11,"Fa izahay izay velona dia atolotra ho amin’ ny fahafatesana mandrakariva noho ny amin’ i Jesosy, mba haseho ao amin’ ny nofonay mety maty koa ny fiainan’ i Jesosy."]]}}},{"d":"2027-09-05","g":["KEFASY","ISAIA"],"a":{"KEFASY":["Mme Sylvia","Mr Richard","Mr Yves","Mr Njaka","Mr Ando","Mr Joelson"],"ISAIA":["Mr Haja","Mr Tafita","Mme Tiana","Mme Onja","Mme Holy","Mme Albertine"]},"l":{"2":{"t":"Salamo 119, 9-16","u":"https://baiboly.org/?book=psalms&chapter=119&tr=mg1865","v":[[9,"Inona no hiarovan’ ny zatovo ny lalan-kalehany tsy ho voaloto? Ny fitandremana araka ny teninao."],[10,"Tamin’ ny foko rehetra no nitadiavako Anao; Aza avela hivily hiala amin’ ny didinao aho."],[11,"Ato am-poko no iraketako ny teninao, Mba tsy hanotako aminao."],[12,"Isaorana anie Hianao, Jehovah ô; Ampianaro ahy ny didinao."],[13,"Ny molotro no nentiko nilaza Ny fitsipika rehetra naloaky ny vavanao."],[14,"Ny lalan’ ny teni-vavolombelonao no ifaliako, Tahaka ny ifaliako amin’ ny harena rehetra."],[15,"Ny didinao no hosaintsainiko, Ary hodinihiko ny lalanao."],[16,"Ny didinao no hiravoravoako: Tsy hohadinoiko ny teninao."]]},"3":{"t":"Matio 7, 15-20","u":"https://baiboly.org/?book=matthew&chapter=7&tr=mg1865","v":[[15,"Mitandrema ianareo, fandrao ho voafitaky ny mpaminany sandoka, izay mankao aminareo amin’ ny fitafian’ ny ondry, fa ao anatiny dia amboadia mitoha izy."],[16,"Ny voany no hahafantaranareo azy. Manoty voaloboka amin’ ny tsilo va ny olona, na aviavy amin’ ny songosongo?"],[17,"Dia toy izany, ny hazo tsara rehetra dia mamoa voa tsara; fa ny hazo ratsy rehetra dia mamoa voa ratsy."],[18,"Ny hazo tsara tsy mety mamoa voa ratsy, ary ny hazo ratsy tsy mety mamoa voa tsara."],[19,"Ny hazo rehetra izay tsy mamoa voa tsara dia hokapaina ka hatsipy any anaty afo."],[20,"Ka dia ny voany no hahafantaranareo azy."]]},"4":{"t":"2 Petera 2, 1-3","u":"https://baiboly.org/?book=2-peter&chapter=2&tr=mg1865","v":[[1,"Efa nisy mpaminany sandoka teo amin’ ny olona Isiraely, ary hisy koa mpampianatra sandoka tahaka izany eo aminareo, izay hahatonga mangingina sain-diso mahavery ary handà ny Tompo Izay nividy azy aza ka hahatonga fahaverezana tampoka ho amin’ ny tenany."],[2,"Ary maro no hanaraka ny fijejojejoany; ka ireny no hitenenan-dratsy ny lalan’ ny fahamarinana."],[3,"Ary amin’ ny hafatratry ny fitiavany harena no hanaovany varotra anareo amin’ ny teny mamitaka; efa ela izay no tsy nijanonjanona ny fitsarana ireny, ary tsy rendremana ny fahaverezany."]]}}},{"d":"2027-09-12","g":["ESTERA","JAONA"],"a":{"ESTERA":["Mme Tsiry","Mme Lanto","Mr Patrick","Mme Georgina","Mme Tatamo","Mr Rochel"],"JAONA":["Mr Tovo","Mr Adolph","Dr Hasina","Mr Lalaina","Mme Voahirana","Mme Vero"]},"l":{"2":{"t":"Ezekiela 18, 23-32","u":"https://baiboly.org/?book=ezekiel&chapter=18&tr=mg1865","v":[[23,"Moa sitrako akory va ny fahafatesan’ ny ratsy fanahy, hoy Jehovah Tompo, fa tsy ny hialany amin’ ny alehany mba ho velona izy?"],[24,"Fa raha ny marina no miala amin’ ny fahamarinany ka manao meloka ary manaraka ny fahavetavetana rehetra izay nataon’ ny ratsy fanahy, ho velona va izy? Ny fahamarinany rehetra izay nataony dia tsy hotsarovana; noho ny fahadisoana izay nandisoany sy ny fahotana izay nanotany dia ho faty izy."],[25,"Nefa hoy ianareo: Tsy marina ny fitondran’ ny Tompo. Mihainoa ange, ry taranak’ Isiraely: Moa ny fitondrako va no tsy marina? Tsy ny fitondranareo va no tsy marina?"],[26,"Raha ny marina miala amin’ ny fahamarinany ary manao meloka ka maty amin’ izany, dia maty noho ny heloka nataony ihany izy."],[27,"Ary raha ny ratsy fanahy miala amin’ ny faharatsiana nataony ka manao izay marina sy mahitsy, dia hovelominy ny fanahiny."],[28,"Raha mahita izy ka miala amin’ ny fahadisoana rehetra izay nataony, dia ho velona tokoa izy, fa tsy ho faty."],[29,"Nefa hoy ny taranak’ Isiraely: Tsy marina ny fitondran’ ny Tompo. Ry taranak’ Isiraely, ny fitondrako va no tsy marina? Tsy ny fitondranareo va no tsy marina?"],[30,"Koa samy hotsaraiko araka ny ataonareo avy ianareo, ry taranak’ Isiraely, hoy Jehovah Tompo. Mitodiha, ka mibebaha amin’ ny fahadisoanareo rehetra, dia tsy ho tonga fahatafintohinana mahameloka anareo intsony izany."],[31,"Esory ho afaka aminareo ny fahadisoanareo rehetra izay nataonareo, ka manaova fo vaovao sy fanahy vaovao ho anareo; fa nahoana no ho faty ianareo, ry taranak’ Isiraely?"],[32,"Fa tsy sitrako ny fahafatesan’ izay maty, hoy Jehovah Tompo. Koa mibebaha ianareo mba ho velona. Hira fahalahelovana ny amin’ ireo lehiben’ ny Isiraely."]]},"3":{"t":"Marka 16, 12-18","u":"https://baiboly.org/?book=mark&chapter=16&tr=mg1865","v":[[12,"Ary taorian’ izany Jesosy dia niseho tamin’ ny endrika hafa tamin’ ny roa lahy aminy, izay nankany an-tsaha."],[13,"Ary izy ireo nandeha ka nilaza tamin’ ny namany; fa na dia ireo aza tsy ninoany koa."],[14,"Rehefa afaka izany, dia niseho tamin’ ny iraika ambin’ ny folo lahy Jesosy, raha nipetraka nihinana ireo; ary izy nanome tsiny azy noho ny tsi-finoany sy ny hamafin’ ny fony, satria tsy ninoany ireo efa nahita Azy, rehefa nitsangana Izy."],[15,"Ary hoy Izy taminy: Mandehana any amin’ izao tontolo izao ianareo, ka mitoria ny filazantsara amin’ ny olombelona rehetra."],[16,"Izay mino sy atao batisa no hovonjena; fa izay tsy mety mino no hohelohina."],[17,"Ary izao famantarana izao no hanaraka izay mino: hamoaka demonia amin’ ny anarako izy; hiteny amin’ ny fiteny izay tsy mbola hainy izy;"],[18,"handray menarana izy; ary na dia misotro zava-mahafaty aza izy, dia tsy hampaninona azy izany; hametra-tanana amin’ ny marary izy, dia ho sitrana ireny."]]},"4":{"t":"2 Timoty 4, 1-5","u":"https://baiboly.org/?book=2-timothy&chapter=4&tr=mg1865","v":[[1,"Eo anatrehan’ Andriamanitra sy Kristy Jesosy, Izay hitsara ny velona sy ny maty, ary noho ny amin’ ny fisehoany sy ny fanjakany, no ananarako anao mafy:"],[2,"mitoria ny teny, mazotoa, na amin’ ny fotoana, na tsy amin’ ny fotoana, mandrese lahatra, mamporisiha, mananara mafy amin’ ny fahari-po sy ny fampianarana rehetra."],[3,"Fa ho avy ny andro izay tsy hahazakan’ ny olona ny fampianarana tsy misy kilema; fa hangidihidy sofina izy, dia hamory mpampianatra ho azy araka ny filany;"],[4,"ary hampiala ny sofiny amin’ ny teny marina tokoa izy ka hivily ho amin’ ny anganongano."],[5,"Fa ianao kosa mahonona tena amin’ ny zavatra rehetra, miareta fahoriana, ataovy ny asan’ ny evanjelista, tanteraho ny fanompoanao."]]}}},{"d":"2027-09-19","g":["ROTA","KEFASY"],"a":{"ROTA":["Mr Sen","Mme Mavo","Mme Julie","Mme Vola","Mr Parany","Mr Jean Claude"],"KEFASY":["Mme Odette","Mme Felana","Mme Sitraka","Mme Vony","Mme Lea","Mme Alphonsine"]},"l":{"2":{"t":"Jeremia 28, 10-17","u":"https://baiboly.org/?book=jeremiah&chapter=28&tr=mg1865","v":[[10,"Dia nesorin’ i Hanania mpaminany ny zioga tamin’ ny vozon’ i Jeremia mpaminany ka notapahiny."],[11,"Ary Hanania niteny teo anatrehan’ ny vahoaka rehetra hoe: Izao no lazain’ i Jehovah: tahaka izao no hanapahako ny ziogan’ i Nebokadnezara, mpanjakan’ ny Babylona, ho afaka amin’ ny vozon’ ny firenena rehetra ao anatin’ ny roa taona. Ary dia lasa niala Jeremia mpaminany."],[12,"Dia tonga tamin’ i Jeremia ny tenin’ i Jehovah, nony efa notapahin’ i Hanania mpaminany ho afaka tamin’ ny vozon’ i Jeremia mpaminany ny zioga, nanao hoe:"],[13,"Mandehana, ka lazao amin’ i Hanania hoe: Izao no lazain’ i Jehovah: Zioga hazo no notapahinao, fa zioga vy kosa no hataonao solony."],[14,"Fa izao no lazain’ i Jehovah, Tompon’ ny maro, Andriamanitry ny Isiraely: Zioga vy no nataoko tamin’ ny vozon’ ireto firenena rehetra ireto mba hanompoany an’ i Nebokadnezara, mpanjakan’ i Babylona, ka dia hanompo azy izy; eny, na dia ny bibi-dia aza dia nomeko azy koa."],[15,"Dia hoy Jeremia mpaminany tamin’ i Hanania mpaminany: Mba henoy, ry Hanania: Tsy naniraka anao Jehovah; fa ianao dia mampitoky ity firenena ity amin’ ny lainga."],[16,"Koa izao no lazain’ i Jehovah: Indro, hesoriko tsy ho amin’ ny tany ianao; amin’ ity taona ity ihany no hahafatesanao, satria fiodinana tamin’ i Jehovah no notorinao"],[17,"Ka dia maty tamin’ ny volana fahafito tamin’ iny taona iny ihany Hanania mpaminany."]]},"3":{"t":"Marka 7, 1-13","u":"https://baiboly.org/?book=mark&chapter=7&tr=mg1865","v":[[1,"Ary niangona teo aminy ny Fariseo sy ny mpanora-dalàna sasany, izay avy tany Jerosalema"],[2,"ka nahita ny mpianatra sasany fa nihinan-kanina tamin’ ny tanana tsy madio, izany hoe, tsy voasasa."],[3,"(Fa ny Fariseo sy ny Jiosy rehetra tsy mba mihinana, raha tsy efa manasa tsara ny tànany, satria mitàna ny fampianarana voatolotry ny razana izy."],[4,"Ary raha avy any an-tsena, dia tsy mihinana izy, raha tsy misasa aloha. Ary misy fomba maro koa izay noraisiny hotanana, dia ny manasa kapoaka sy famarana mbamin’ izay fanaka varahina.)"],[5,"Dia nanontany Azy ny Fariseo sy ny mpanora-dalàna hoe: Nahoana ny mpianatrao no tsy manaraka ny fampianarana voatolotry ny razana, fa mihinan-kanina amin’ ny tanana tsy misasa izy?"],[6,"Fa Jesosy nanao taminy hoe: Marina ny naminanian’ Isaia anareo mpihatsaravelatsihy, araka ny voasoratra hoe: Ity firenena ity manaja Ahy amin’ ny molony, Fa ny fony kosa lavitra Ahy."],[7,"Koa foana ny ivavahan’ ireo amiko, Raha mampianatra ny didin’ olombelona ho fampianarana izy.."],[8,"Mahafoy ny didin’ Andriamanitra ianareo ka mitana ny fanaon’ ny olona."],[9,"Ary hoy koa Izy taminy: Hay! tsara ny nahafoizanareo ny didin’ Andriamanitra mba hitandremanareo ny fampianarana voatolotra anareo!"],[10,"Fa hoy Mosesy: Manajà ny rainao sy ny reninao, ary koa: Izay miteny ratsy ny rainy sy ny reniny dia hatao maty tokoa."],[11,"Fa hoy kosa ianareo: Raha misy olona milaza amin’ ny rainy na amin’ ny reniny hoe: Efa korbana (izany hoe, fanatitra ho an’ Andriamanitra) izay rehetra tokony hahazoanao soa avy amiko,"],[12,"dia tsy avelanareo hanao na inona na inona ho an’ ny rainy sy ny reniny intsony izy,"],[13,"ka dia foananareo ny tenin’ Andriamanitra amin’ ny fampianarana voatolotra anareo, izay nasainareo hotandremana; ary zavatra maro mifanahatahaka amin’ izany koa no ataonareo."]]},"4":{"t":"2 Jaona 7-11","u":"https://baiboly.org/?book=2-john&chapter=1&tr=mg1865","v":[[7,"Fa maro ny mpamitaka efa lasa any amin’ izao tontolo izao, dia ireny tsy manaiky fa efa tonga tamin’ ny nofo Jesosy Kristy. Izy no mpamitaka sy antikristy."],[8,"Mitandrema ianareo, fandrao mahavery izay namonoanay tena, fa mba handraisanareo valim-pitia tanteraka."],[9,"Izay rehetra mitarika nefa tsy mitoetra ao amin’ ny fampianaran’ i Kristy, dia tsy manana an Andriamanitra. Izay mitoetra ao amin’ ny fampianarana, dia izy no manana ny Ray sy ny Zanaka."],[10,"Raha misy olona mankeo aminareo ka tsy mitondra izao fampianarana izao, aza mampiantrano azy na miarahaba azy akory;"],[11,"fa izay miarahaba azy dia miombona amin’ ny ratsy ataony."]]}}},{"d":"2027-09-26","g":["ISAIA"],"a":{"ISAIA":["Mme Germaine","Mme Hanta","Mr Tafita","Mme Rahely","Mme Onja","Mr Haja"]},"l":{"2":{"t":"Deoteronomia 13, 2-6","u":"https://baiboly.org/?book=deuteronomy&chapter=13&tr=mg1865","v":[[2,"Raha tahìny misy mpaminany na mpanonofy eo aminareo izay milaza famantarana na fahagagana aminao"],[3,"sady manao hoe: Andeha isika hanaraka andriamani-kafa (izay tsy fantatrao), ka aoka hanompo azy isika, na dia tanteraka aza ny famantarana na fahagagana izay nolazainy taminao,"],[4,"dia aza mihaino ny tenin’ izany mpaminany na mpanonofy izany; fa mizaha toetra anareo Jehovah Andriamanitrareo, hahalalany na miorina amin’ ny fitiavana an’ i Jehovah Andriamanitrareo amin’ ny fonareo rehetra sy ny fanahinareo rehetra ianareo."],[5,"Manaraha an’ i Jehovah Andriamanitrareo, ka aoka Izy no hatahoranareo, ary ny didiny no hotandremanareo, ary ny feony no hohenoinareo, ary aoka Izy no hotompoinareo sy hifikiranareo."],[6,"Fa izany mpaminany na mpanonofy izany dia hatao maty satria efa nanao teny fampiodinana amin’ i Jehovah Andriamanitrareo (Izay nitondra anareo nivoaka avy tany amin’ ny tany Egypta ka nanavotra anao tamin’ ny trano nahandevozana), mba hitaona anao hiala amin’ ny lalana izay nasain’ i Jehovah Andriamanitrao halehanao. Ka dia hofongoranao tsy ho eo aminao ny fanao ratsy."]]},"3":{"t":"Matio 16, 5-12","u":"https://baiboly.org/?book=matthew&chapter=16&tr=mg1865","v":[[5,"Ary rehefa tonga teny am-pita ny mpianatra, dia nanadino hitondra mofo izy."],[6,"Ary hoy Jesosy taminy: Mihevera, ka mitandrema ianareo, fandrao azon’ ny masirasiran’ ny Fariseo sy ny Sadoseo."],[7,"Dia niara-nisaina izy ka nanao hoe: Ny tsy nitondrantsika mofo angaha izany."],[8,"Ary Jesosy nahalala izany, dia nanao hoe: Nahoana ianareo, ry kely finoana, no miara-misaina satria tsy manana mofo?"],[9,"Tsy mbola mahafantatra va ianareo, ary tsy tsaroanareo va ny mofo dimy ho an’ ny dimy arivo, ka firy harona moa no nangoninareo?"],[10,"na ny mofo fito ho an’ ny efatra arivo, ka firy sobiky moa no nangoninareo?"],[11,"Ahoana no tsy ahafantaranareo fa tsy ny amin’ ny mofo no nolazaiko taminareo? Fa tandremo, fandrao azon’ ny masirasiran’ ny Fariseo sy ny Sadoseo."],[12,"Dia fantany fa tsy nasainy hitandrina izy, fandrao azo’ ny masirasira fanaovana mofo, fa andrao azon’ ny fampianaran’ ny Fariseo sy ny Sadoseo."]]},"4":{"t":"2 Tesalonianina 2, 15-17","u":"https://baiboly.org/?book=2-thessalonians&chapter=2&tr=mg1865","v":[[15,"Koa tomoera tsara, ry rahalahy, ka hazòny ny fampianarana natolotra izay nampianarina anareo, na tamin’ ny teninay, na tamin’ ny epistilinay."],[16,"Ary Jesosy Kristy Tompontsika sy Andriamanitra Raintsika, Izay efa tia antsika ka nanome antsika fampiononana mandrakizay sy fanantenana tsara amin’ ny fahasoavana,"],[17,"no hampionona ny fonareo anie sy hampahery anareo amin’ ny asa sy ny teny tsara rehetra."]]}}},{"d":"2027-10-03","g":["ESTERA","JAONA"],"a":{"ESTERA":["Mr Patrick","Mme Georgina","Mme Voahirana","Mr Hery","Mme Tsiry","Mme Lanto"],"JAONA":["Mr Naina","Mme Tiana","Mme Saholy","Mme Sidonie","Mme Yoily","Mme Mama Li"]},"l":{"2":{"t":"Salamo 133, 1-3","u":"https://baiboly.org/?book=psalms&chapter=133&tr=mg1865","v":[[1,"Fihirana fiakarana. Nataon’ i Davida. Endrey, tsara sady mahafinaritra Raha ny mpirahalahy no miara-monina"],[2,"Tahaka ny diloilo tsara amin’ ny loha, Izay mitsororoka amin’ ny somotra, dia ny somotr’ i Arona, Izay mitsororoka amin’ ny moron-tongotr’ akanjony;"],[3,"Tahaka ny ando any Hermona, izay milatsaka amin’ ny tendrombohitra Ziona; Fa voadidin’ i Jehovah ho eo ny fitahiana, Dia fiainana ho mandrakizay."]]},"3":{"t":"Matio 5, 43-48","u":"https://baiboly.org/?book=matthew&chapter=5&tr=mg1865","v":[[43,"Efa renareo fa voalaza hoe: Tiava ny namanao, ary mankahalà ny fahavalonao."],[44,"Fa Izaho kosa milaza aminareo hoe: Tiava ny fahavalonareo, ary mivavaha ho an’ izay manenjika anareo,"],[45,"mba ho tonga zanaky ny Rainareo Izay any an-danitra ianareo; fa Izy mampiposaka ny masoandrony amin’ ny ratsy fanahy sy ny tsara fanahy ary mampilatsaka ny ranonorana amin’ ny marina sy ny tsy marina."],[46,"Fa raha izay tia anareo ihany no tianareo, inona no valim-pitia azonareo? Moa na dia ny mpamory hetra aza tsy mba manao izany koa va?"],[47,"Ary raha ny rahalahinareo ihany no arahabainareo, inona no ataonareo mihoatra noho ny sasany? Moa na dia ny jentilisa aza tsy mba manao toy izany ihany va?"],[48,"Koa amin izany aoka ho tanteraka ianareo toy ny fahatanterahan’ ny Rainareo Izay any an-danitra."]]},"4":{"t":"Jakoba 2, 1-13","u":"https://baiboly.org/?book=james&chapter=2&tr=mg1865","v":[[1,"Ry rahalahiko, aoka tsy hasiana fizahan-tavan’ olona ny finoanareo ny Tompontsika, dia Jesosy Kristy, Tompon’ ny voninahitra."],[2,"Fa raha misy olona miditra eo amin’ ny synagoganareo misy peratra volamena amin’ ny rantsan-tànany sady miakanjo tsara, ary mba miditra kosa izay olona malahelo miakanjo ratsy,"],[3,"koa mijery ilay miakanjo tsara ianareo ka manao hoe: Mipetraha eto amin’ ny fitoerana aloha ianao; ary manao amin’ ilay malahelo kosa hoe: Mitoera eroa ianao, na: Mipetraha etsy amin’ ny fitoeran-tongotro,―"],[4,"moa tsy miangatra va ianareo amin’ izany ka efa mpitsara manan-kevi-dratsy?"],[5,"Mihainoa, ry rahalahy malalako: Tsy efa nofidin’ Andriamanitra va ny malahelo amin’ izao fiainana izao ho mpanankarena amin’ ny finoana sy ho mpandova ny fanjakana nolazainy homena izay tia Azy?"],[6,"Fa ianareo efa nanala-baraka ny malahelo. Moa tsy ny mpanankarena va no mampahory anareo? Ary tsy izy va no mitarika anareo ho eo amin’ ny fitsarana?"],[7,"Tsy izy koa va no miteny ratsy ny anarana tsara izay niantsoana anareo?"],[8,"Kanefa raha mankatò ilay didy ambony indrindra ianareo, araka ny Soratra Masìna hoe: “Tiava ny namanao tahaka ny tenanao”, dia manao tsara ianareo."],[9,"Fa raha mizaha tavan’ olona kosa ianareo, dia manota ka helohin’ ny lalàna ho mpanota."],[10,"Fa na iza na iza mitandrina ny lalàna rehetra, nefa diso amin’ ny iray loha dia meloka amin’ izy rehetra."],[11,"Fa Ilay nanao hoe: “Aza mijangajanga” no nanao hoe koa: “Aza mamono olona”. Fa raha tahìny tsy mijangajanga ianao, kanefa mamono olona ihany, dia mpandika ny lalàna ianao."],[12,"Aoka ianareo hiteny sy hanao araka izay mahamendrika anareo, izay olona hotsarain’ ny lalàn’ ny fahafahana."],[13,"Fa fitsarana tsy misy famindram-po no ho anjaran’ izay tsy mamindra fo; ary ny famindram-po kosa dia faly, fa tsy mba matahotra ny fitsarana."]]}}},{"d":"2027-10-10","g":["ROTA","KEFASY"],"a":{"ROTA":["Mme Lucie","Mr Herimanitra","Mme Tsiory","Mr Rivo","Mme Onja","Mme Patricia"],"KEFASY":["Mr Njaka","Mr Yves","Mr Joelson","Mr Ando","Mr Richard","Mme Sylvia"]},"l":{"2":{"t":"2 Tantara 19, 4-7","u":"https://baiboly.org/?book=2-chronicles&chapter=19&tr=mg1865","v":[[4,"Ary Josafata nitoetra tany Jerosalema; ary nandeha hitety ny olona indray izy hatrany Beri-sheba ka hatrany amin’ ny tany havoan’ i Efraima ary nampiverina ny olona ho amin’ i Jehovah, Andriamanitry ny razany."],[5,"Ary nanendry mpitsara tamin’ ny tany izy, dia tamin’ ny isan-tanàna mimanda eran’ i Joda,"],[6,"ka nanao taminy hoe: Tandremo izay hataonareo; fa tsy ho an’ olona no hitsaranareo, fa ho an’ i Jehovah, sady momba anareo ao amin’ ny fitsarana Izy."],[7,"Koa aoka ho ao aminareo ny tahotra an’ i Jehovah; tandremo ka ataovy izany, fa tsy mba misy heloka amin’ i Jehovah Andriamanitsika, na fizahan-tavan’ olona, na fandraisana kolikoly."]]},"3":{"t":"Jaona 4, 1-10","u":"https://baiboly.org/?book=john&chapter=4&tr=mg1865","v":[[1,"Koa amin’ izany, rehefa fantatry ny Tompo fa ny Fariseo efa nahare fa Jesosy mahazo mpianatra maro sy manao batisa be noho Jaona"],[2,"(kanefa tsy Jesosy no nanao batisa, fa ny mpianany),"],[3,"dia niala tany Jodia Izy ka nankany Galilia indray."],[4,"Ary tsy maintsy mamaky an’ i Samaria Izy."],[5,"Dia tonga tao an-tanàna anankiray any Samaria Izy, izay atao hoe Sykara, akaikin’ ny tany izay nomen’ i Jakoba ho an’ i Josefa zanany."],[6,"Ary teo ilay fantsakan’ i Jakoba. Ary satria sasatra Jesosy tamin’ ny nalehany dia nipetraka teo am-pantsakana Izy, rehefa tokony ho tamin’ ny ora fahenina."],[7,"Ary nisy vehivavy Samaritana anankiray avy hantsaka rano dia hoy Jesosy taminy: Omeo Aho hosotroiko."],[8,"(Fa ny mpianany efa lasa nankany an-tanàna hividy hanina)"],[9,"Fa hoy ravehivavy Samaritana taminy: Nahoana Hianao no Jiosy ka mangataka amiko hosotroina, nefa aho vehivavy Samaritana? (Fa ny Jiosy tsy manan-draharaha amin’ ny Samaritana.)"],[10,"Jesosy namaly ka nanao taminy hoe: Raha fantatrao ny fanomezan’ Andriamanitra sy Izay miteny aminao hoe: Omeo Aho hosotroiko, dia ianao no ho nangataka taminy, ka nomeny rano velona."]]},"4":{"t":"1 Korintiana 12, 1-13","u":"https://baiboly.org/?book=1-corinthians&chapter=12&tr=mg1865","v":[[1,"Ary ny amin’ ny zava-panahy, ry rahalahy, dia tsy tiako tsy ho fantatrareo."],[2,"Fantatrareo fa fony jentilisa ianareo, dia nentina tany amin’ ny sampy moana araka izay nitaomana anareo."],[3,"Koa mampahafantatra anareo aho fa tsy misy olona ampitenenin’ ny Fanahin’ Andriamanitra ka manao hoe: Voaozona Jesosy; ary tsy misy mahay manaiky hoe: Jesosy no Tompo, raha tsy amin’ ny Fanahy Masìna."],[4,"Zarazaraina ho samy hafa ny fanomezam-pahasoavana, nefa ny Fanahy dia iray ihany."],[5,"Ary zarazaraina ho samy hafa ny fanompoana, nefa ny Tompo dia iray ihany."],[6,"Ary zarazaraina ho samy hafa ny asa, nefa Andriamanitra dia iray ihany, Izay miasa ny zavatra rehetra amin’ ny olona rehetra."],[7,"Ary izy rehetra dia samy nomena ny fampisehoana ny Fanahy hahasoa."],[8,"Fa ny anankiray nomen’ ny Fanahy teny fahendrena, ary ny anankiray teny fahalalana, araka izany Fanahy izany ihany,"],[9,"ary ny anankiray finoana, amin’ izany Fanahy izany ihany, ary ny anankiray fanomezam-pahasoavana ho enti-mahasitrana, amin’ izany Fanahy iray izany ihany,"],[10,"ary ny anankiray ny manao fahagagana, ary ny anankiray ny maminany, ary ny anankiray ny mahafantatra fanahy samy hafa, ary ny anankiray ny miteny amin’ ny fiteny samy hafa tsy fantatra, ary ny anankiray ny mandika fiteny tsy fantatra."],[11,"Ireo rehetra ireo dia asan’ ny Fanahy iray ihany, zarazarainy ho azy rehetra avy araka ny sitrapony."],[12,"Fa tahaka ny tena iray ihany, anefa maro no momba ny tena, ary ireo rehetra momba ny tena ireo, na dia maro aza, dia tena iray ihany, dia tahaka izany koa Kristy."],[13,"Fa Fanahy iray ihany no nanaovam-batisa antsika rehetra ho tena iray, na Jiosy an jentilisa, na andevo na tsy andevo; ary isika rehetra dia efa nampisotroina ny Fanahy iray."]]}}},{"d":"2027-10-17","g":["ISAIA","ESTERA"],"a":{"ISAIA":["Mme Albertine","Mme Tiana","Mme Hanta","Mme Holy","Mme Rahely","Mme Germaine"],"ESTERA":["Mme Tatamo","Mr Rochel","Mme Tsiry","Mme Lanto","Mme Voahirana","Mr Hery"]},"l":{"2":{"t":"Nomery 6, 1-8","u":"https://baiboly.org/?book=numbers&chapter=6&tr=mg1865","v":[[1,"Ary Jehovah niteny tamin’ i Mosesy ka nanao hoe:"],[2,"Mitenena amin’ ny Zanak’ Isiraely hoe: Raha misy lehilahy na vehivavy mivoady hitokana ho Nazirita mba hitokana ho an’ i Jehovah,"],[3,"dia hifady divay sy toaka izy; tsy hisotro divay efa maharikivy na toaka efa maharikivy izy, ary tsy hisotro ranom-boaloboka izy, na hihinana voaloboka akory, na ny lena, na ny maina."],[4,"Amin’ ny andro fitokanany rehetra dia tsy hihinana izay atao amin’ ny voaloboka hatramin’ ny voany ka hatramin’ ny hodiny izy."],[5,"Amin’ ny andro rehetra izay nivoadiany hitokana dia tsy hokasihin-kareza ny lohany; mandra-pahatapitry ny andro izay nitokanany ho an’ i Jehovah dia ho masìna izy, ka havelany haniry ny volondohany."],[6,"Amin’ ny andro rehetra izay itokanany ho an’ i Jehovah dia tsy hiditra am-paty izy;"],[7,"aoka tsy handoto tena izy na dia amin’ ny rainy, na ny reniny, na ny rahalahiny, na ny anabaviny aza, raha maty ireo, satria eo amin’ ny lohany ny fitokanana ho an’ Andriamaniny."],[8,"Amin’ ny andro fitokanany rehetra dia ho masìna ho an’ i Jehovah izy."]]},"3":{"t":"Matio 12, 46-50","u":"https://baiboly.org/?book=matthew&chapter=12&tr=mg1865","v":[[46,"Ary raha mbola niteny tamin’ ny vahoaka Jesosy, indreo, ny reniny mbamin’ ny rahalahiny nijanona teo ala-trano nitady hiteny aminy."],[47,"Ary nisy anankiray nanao taminy hoe: Indreo, ny reninao mbamin’ ny rahalahinao mijanona ato ala-trano mitady hiteny aminao."],[48,"Fa namaly Izy ka nanao tamin’ ilay nilaza taminy hoe: Iza moa no reniko, ary iza no rahalahiko?"],[49,"Ary naninjitra ny tànany nanondro ny mpianany Izy ka nanao hoe: Indreo ny reniko sy ny rahalahiko;"],[50,"Fa na iza na iza no hanao ny sitrapon’ ny Raiko Izay any an-danitra, dia izy no rahalahiko sy anabaviko ary reniko."]]},"4":{"t":"Romana 12, 1-8","u":"https://baiboly.org/?book=romans&chapter=12&tr=mg1865","v":[[1,"Koa amin’ izany mangataka aminareo aho, ry rahalahy, noho ny famindram-pon’ Andriamanitra, mba hatolotrareo ny tenanareo ho fanatitra velona, masìna, sitrak’ Andriamanitra, dia fanompoam-panahy mety hataonareo izany."],[2,"Ary aza manaraka ny fanaon’ izao tontolo izao; fa miovà amin’ ny fanavaozana ny saina, hamantaranareo ny sitrapon’ Andriamanitra, dia izay tsara sady ankasitrahana no marina."],[3,"Fa noho ny fahasoavana nomena ahy dia izao no lazaiko amin’ ny olona rehetra izay eo aminareo: Aza mihevitra mihoatra noho izay tokony hoheverina; fa mihevera izay onony araka ny ohatry ny finoana izay nozarain’ Andriamanitra ho anareo avy."],[4,"Fa toy ny ananantsika zavatra maro momba ny tena iray, nefa tsy mitovy asa izay rehetra momba ny tena,"],[5,"dia toy izany koa isika, na dia maro aza, dia tena iray ihany ao amin’ i Kristy, ary samy miara-momba ny tena isika rehetra."],[6,"Ary satria samy manana fanomezam-pahasoavana samy hafa isika, araka ny fahasoavana izay nomena antsika: raha faminaniana, dia aoka hatao araka ny ohatry ny finoana;"],[7,"raha fanompoana amin’ ny fiangonana, dia aoka ho amin’ ny fanompoana; raha mampianatra, dia aoka ho amin’ ny fampianarana;"],[8,"raha mananatra, dia aoka ho amin’ ny fananarana; izay manome, dia aoka ho amin’ ny fahatsoram-po; izay manapaka, dia aoka ho amin’ ny fahazotoana; izay mamindra fo, dia aoka ho amin’ ny fifaliana."]]}}},{"d":"2027-10-24","g":["JAONA","ROTA"],"a":{"JAONA":["Mme Vero","Mme Voahirana","Mr Lalaina","Dr Hasina","Mr Tovo","Mr Adolph"],"ROTA":["Mme Lalao","Mme Julie","Mme Mavo","Mr Parany","Mme Vola","Mr Sen"]},"l":{"2":{"t":"Deoteronomia 1, 9-18","u":"https://baiboly.org/?book=deuteronomy&chapter=1&tr=mg1865","v":[[9,"Ary niteny taminareo tamin’ izany andro izany aho ka nanao hoe: Tsy zakako izaho irery ny hitondra anareo;"],[10,"Jehovah Andriamanitrareo efa nahamaro anareo, ary, indro, efa maro toy ny kintana eny amin’ ny lanitra ianareo izao."],[11,"(Jehovah, Andriamanitry ny razanareo, anie hampitombo anareo ho arivo toraka izao ka hitahy anareo, araka izay efa nolazainy taminareo!)"],[12,"Hataoko izaho irery ahoana no fitondra ny fahasahirananareo sy ny entanareo any ny adinareo?"],[13,"Mifidiana izay lehilahy hendry sy manan-tsaina ary hita toetra amin’ ny firenenareo, ka hataoko ho lehibenareo izy."],[14,"Dia namaly ahy ianareo ka nanao hoe: Tsara ny teny izay nolazainao ka tokony hankatoavina."],[15,"Ary nalaiko ny lohan’ ny firenenareo, dia olona hendry sady hita toetra, ka nataoko mpifehy anareo, dia mpifehy arivo sy mpifehy zato sy mpifehy dimam-polo sy mpifehy folo ary mpitondra vahoaka amin’ ny firenenareo."],[16,"Dia nandidy ny mpitsara anareo tamin’ izany andro izany aho ka nanao hoe: Henoy ny adin’ ny rahalahinareo, ka tsarao marina ny olona, na ny tompon-tany, na ny vahiny eo aminy."],[17,"Aza mizaha tavan’ olona amin’ ny fitsarana, fa henoy ny kely toy ny lehibe; aza matahotra olona akory, fa an’ Andriamanitra ny fitsarana; ary izay sarotra loatra aminareo dia ento etỳ amiko ka hohenoiko."],[18,"Dia nandidy anareo tamin’ izany andro izany aho ny amin’ ny zavatra rehetra izay hataonareo."]]},"3":{"t":"Lioka 16, 19-31","u":"https://baiboly.org/?book=luke&chapter=16&tr=mg1865","v":[[19,"Nisy lehilahy manan-karena anankiray niakanjo volomparasy sy rongony fotsy madinika sady nanaram-po fatratra isan’ andro tamin’ ny fahafinaretana."],[20,"Ary nisy olo-malahelo ferena anankiray atao hoe Lazarosy napetraka teo anilan’ ny vavahadiny;"],[21,"ary naniry mba hihinana izay latsaka avy tamin’ ny latabatr’ ilay manan-karena izy, fa ny alika kosa no avy ka nilelaka ny feriny."],[22,"Ary maty ilay malahelo, dia nentin’ ny anjely ho any an-tratran’ i Abrahama; ary maty koa ilay manan-karena, dia nalevina;"],[23,"ary raha nijaly tao amin’ ny fiainan-tsi-hita izy ka niandrandra, dia nahita an’ i Abrahama teny lavitra eny sy Lazarosy teo an-tratrany."],[24,"Ary izy niantso ka nanao hoe: Ry Abrahama raiko ô, mamindrà fo amiko, ka iraho Lazarosy mba hanoboka ny tendron’ ny rantsan-tanany amin’ ny rano mba hampangatsiaka ny lelako; fa fadiranovana aho eto anatin’ ity lelafo ity."],[25,"Fa hoy Abrahama: Anaka, tsarovy fa ianao efa nahazo ny zava-tsoanao tamin’ ny andro niainanao, ary Lazarosy kosa ny zava-dratsy; fa ankehitriny izy no ampifalinay atỳ, ary ianao kosa no fadiranovana."],[26,"Ary mihoatra noho izany rehetra izany, misy tevana makadiry ajadona ao anelanelantsika, mba tsy ho afa-mita hankeny aminareo izay te-hiala etỳ, ary ny ho afa-mita hanketỳ aminay izay eny."],[27,"Dia hoy izy: Mangataka aminao ary aho, ry raiko: mba iraho Lazarosy hankany amin’ ny tranon’ ny raiko"],[28,"(fa manana rahalahy dimy aho), mba hilaza tsara aminy, fandrao mba ho tongay amin’ ity fijaliana ity koa izy."],[29,"Fa hoy Abrahama taminy: Manana an’ i Mosesy sy ny mpaminany izy; aoka hihaino ireo izy."],[30,"Fa hoy kosa izy: Tsia, ry Abrahama, raiko; fa raha misy miala amin’ ny maty hankany aminy, dia hibebaka izy."],[31,"Fa hoy Abrahama taminy: Raha tsy mihaino an’ i Mosesy sy ny mpaminany izy, dia tsy hety hino izy, na dia misy mitsangana amin’ ny maty aza."]]},"4":{"t":"1 Korintiana 3, 1-9","u":"https://baiboly.org/?book=1-corinthians&chapter=3&tr=mg1865","v":[[1,"Ary izaho, ry rahalahy, tsy nahazo niteny taminareo tahaka ny amin’ izay araka ny Fanahy, fa tahaka ny amin’ izay mbola nofo, dia tahaka izay mbola zaza ihany ao amin’ i Kristy."],[2,"Ronono no nomeko anareo, fa tsy ventin-kanina, satria tsy mbola natanjaka ianareo; eny, mbola tsy matanjaka mandraka ankehitriny aza,"],[3,"fa mbola araka ny nofo ihany ianareo. Fa raha misy fialonana sy fifandirana eo aminareo, tsy araka ny nofo va ianareo ka mandeha araka ny fanaon’ ny olona?"],[4,"Fa raha hoy ny anankiray: Izaho an’ i Paoly, ary ny anankiray kosa: Izaho an’ i Apolosy, moa tsy olona ihany va ianareo?"],[5,"Koa inona moa Apolosy, ary inona moa Paoly? Mpanompo ihany izay nahatonga anareo ho mpino ireo, dia samy araka ny nomen’ ny Tompo azy avy."],[6,"Izaho namboly, Apolosy nandena, fa Andriamanitra no nampitombo."],[7,"Ka dia tsinontsinona izay mamboly, na izay mandena, fa Andriamanitra Izay mampitombo no izy."],[8,"Ary iray ihany ny mpamboly sy ny mpandena; nefa samy handray izay valim-pitiany avy araka ny fisasarany izy."],[9,"Fa mpiara-miasa amin’ Andriamanitra izahay; ary sahan’ Andriamanitra sy trano arafitr’ Andriamanitra ianareo."]]}}},{"d":"2027-10-31","g":["KEFASY"],"a":{"KEFASY":["Mme Alphonsine","Mme Lea","Mme Vony","Mme Sitraka","Mme Felana","Mme Odette"]},"l":{"2":{"t":"Levitikosy 25, 39-46","u":"https://baiboly.org/?book=leviticus&chapter=25&tr=mg1865","v":[[39,"Ary raha mihamalahelo ny rahalahinao ka mivaro-tena aminao, aza ampanompoinao toy ny andevo izy;"],[40,"fà aoka hitoetra eo aminao tahaka ny mpikarama sy tahaka ny vahiny izy; mandra-pahatongan’ ny taona Jobily no hanompoany anao."],[41,"Dia ho afaka izy sy ny zanany ka hody amin’ ny mpianakaviny sy amin’ ny tanin-drazany koa."],[42,"Fa mpanompoko izay nentiko nivoaka avy tany amin’ ny tany Egypta izy ka tsy hamidy tahaka ny andevo."],[43,"Aza mampanompo azy fatratra, fa matahora an’ Andriamanitrao."],[44,"Ary ny amin’ izay ho andevolahinao sy andevovavinao, dia amin’ ny jentilisa izay manodidina anareo no hividiananareo azy."],[45,"Ary amin’ ny zanaky ny vahiny eo aminareo sy amin’ ny taranany izay haterany eo amin’ ny taninareo no hividiananareo koa; ary dia ho fanananareo izany."],[46,"Ary hataonareo lovan’ ny zanakareo mandimby anareo izany ho fananana holovany ka hampanompoinareo mandrakizay fa ny Zanak’ Isiraely rahalahinareo dia aza mba ampanompoina fatratra."]]},"3":{"t":"Matio 23, 1-12","u":"https://baiboly.org/?book=matthew&chapter=23&tr=mg1865","v":[[1,"Ary tamin’ izany Jesosy dia niteny tamin’ ny vahoaka sy tamin’ ny mpianany ka nanao hoe:"],[2,"Eo amin’ ny fipetrahan’ i Mosesy no ipetrahan’ ny mpanora-dalàna sy ny Fariseo;"],[3,"koa amin’ izany, izay rehetra lazainy dia ataovy ka tandremo; fa aza mba manao araka ny asany, satria miteny ihany izy, nefa tsy manao."],[4,"Eny, mamehy entana sady mavesatra no sarotra entina izy ka manaingina izany eo amin’ ny soroky ny olona, nefa ny tenany tsy mety manetsika izany na dia amin’ ny rantsan-tànany anankiray asa."],[5,"Ary ny asany rehetra dia ataony mba ho hitan’ ny olona; fa ataony lehibe ny fylakiterany, ary ataony vaventy ny somotraviaviny."],[6,"Ary tia ny fitoerana aloha eo amin’ ny fanasana izy, sy ny fipetrahana aloha eo amin’ ny synagoga"],[7,"sy ny hoharabain’ ny olona eny an-tsena ary ny hataon’ ny olona hoe: Raby ô!"],[8,"Fa ianareo kosa aza mba mety hatao hoe: Raby ô; fa iray ihany no mpampianatra anareo, ary ianareo rehetra dia mpirahalahy avokoa."],[9,"Ary aza milaza olona etỳ an-tany ho rainareo; fa iray ihany no Rainareo, dia Izay any an-danitra."],[10,"Ary aza mba mety hatao hoe mpitarika ianareo; fa iray ihany no Mpitarika anareo, dia Kristy."],[11,"Fa izay lehibe aminareo no ho mpanompo anareo."],[12,"Fa izay manandra-tena no haetry; ary izay manetry tena no hasandratra."]]},"4":{"t":"Galatiana 3, 23-29","u":"https://baiboly.org/?book=galatians&chapter=3&tr=mg1865","v":[[23,"Fa fony tsy mbola tonga ny finoana, dia voambina tao ambanin’ ny lalàna isika ka voahidy ho amin’ ny finoana izay efa haseho ato aoriana."],[24,"Koa ny lalàna dia mpitaiza antsika ho amin’ i Kristy, mba hohamarinina noho ny finoana isika."],[25,"Fa rehefa tonga ny finoana, dia tsy fehezin’ izay mpitaiza intsony isika."],[26,"Fa ianareo rehetra dia zanak’ Andriamanitra amin’ ny finoana an’ i Kristy Jesosy."],[27,"Fa na iza na iza ianareo no natao batisa ho an’ i Kristy dia nitafy an’ i Kristy."],[28,"Tsy misy intsony na Jiosy na Grika, na andevo na tsy andevo, na lahy sy vavy; fa iray ihany ianareo rehetra ao amin’ i Kristy Jesosy."],[29,"Fa raha an’ i Kristy ianareo, dia taranak’ i Abrahama sy mpandova araka ny teny fikasana."]]}}},{"d":"2027-11-07","g":["ISAIA","ESTERA"],"a":{"ISAIA":["Mme Onja","Mme Holy","Mr Haja","Mme Albertine","Mr Tafita","Mme Tiana"],"ESTERA":["Mr Rochel","Mme Tatamo","Mr Hery","Mme Voahirana","Mr Patrick","Mme Georgina"]},"l":{"2":{"t":"Isaia 35, 1-4","u"
