<style>
:root{--navy:#17067A;--navy2:#3A2F9E;--fond:#EEF1F9;--carte:#fff;--texte:#1B1B3A;--doux:#5A5F80;--bord:#D5DAEE;--or:#B7791F;--ok:#1F7A4D}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--fond);color:var(--texte);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.4}
header{background:#fff;border-bottom:4px solid var(--navy);padding:calc(8px + env(safe-area-inset-top)) 14px 8px;display:flex;align-items:center;gap:12px}
header img{height:56px;width:auto}
header .titre{flex:1;min-width:0}
header h1{font-size:18px;margin:0;color:var(--navy)}
header .sous{font-size:12px;color:var(--doux)}
header button{background:none;border:1px solid var(--bord);color:var(--navy);border-radius:8px;padding:6px 10px;font-size:13px}
main{padding:12px 12px calc(84px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
.carte{background:var(--carte);border:1px solid var(--bord);border-radius:14px;padding:14px;margin-bottom:12px}
.carte h2{font-size:15px;color:var(--navy);margin:0 0 8px}
.etiquette{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--doux)}
.prochain{background:var(--navy);color:#fff;border:none}
.prochain .etiquette{color:#C9CCF0}
.prochain .grand{font-size:21px;font-weight:700;margin:4px 0}
.badge{display:inline-block;background:#fff;color:var(--navy);border-radius:999px;padding:2px 12px;font-weight:700;font-size:14px}
.badge.urgent{background:#FFD166;color:#3B2A00}
.prochain .role{font-size:22px;font-weight:800;margin:12px 0 2px}
.prochain .detail{color:#DDE0FA}
.equipe{margin-top:12px;border-top:1px solid rgba(255,255,255,.25);padding-top:10px}
.equipe div{display:flex;gap:10px;padding:2px 0}
.equipe b{min-width:74px;font-weight:600;color:#C9CCF0}
.equipe .moi{color:#FFD166;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--navy);color:var(--navy);background:#fff;border-radius:999px;padding:10px 16px;font-size:16px;font-weight:600}
.chip.actif,.chip:active{background:var(--navy);color:#fff}
.liste button{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--bord);border-radius:10px;padding:12px;margin-bottom:6px;font-size:16px;color:var(--texte)}
.liste button:active{background:var(--fond)}
.ligne{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--bord)}
.ligne:last-child{border-bottom:none}
.ligne .g{font-weight:600}.ligne .d{color:var(--doux);font-size:14px}
.pastille{font-size:12px;border-radius:999px;padding:2px 9px;background:var(--fond);color:var(--navy);white-space:nowrap;align-self:center}
.pastille.soon{background:#FFD166;color:#3B2A00;font-weight:700}
table{border-collapse:collapse;width:100%;font-size:14px;background:#fff}
th{background:var(--navy);color:#fff;font-weight:600;padding:8px 6px;text-align:left;white-space:nowrap}
td{padding:8px 6px;border-bottom:1px solid var(--bord);vertical-align:top}
td.moi{background:#FFF3C4;font-weight:700}
tr.passe td{opacity:.45}
.defil{overflow-x:auto;border-radius:10px;border:1px solid var(--bord)}
select,input[type=time],input[type=number]{font-size:16px;padding:9px;border:1px solid var(--bord);border-radius:8px;background:#fff;color:var(--texte);max-width:100%}
label.opt{display:flex;align-items:center;gap:10px;padding:8px 0}
label.opt input[type=checkbox]{width:22px;height:22px}
.bouton{display:block;width:100%;background:var(--navy);color:#fff;border:none;border-radius:12px;padding:14px;font-size:17px;font-weight:700;margin-top:10px}
.bouton:active{background:var(--navy2)}
.lect{color:var(--navy);font-weight:600;text-decoration:none;border-bottom:1px dotted var(--navy)}
.prochain .lect{color:#FFD166;border-bottom-color:#FFD166}
.lecture{margin:6px 0 2px;font-size:17px}
.note{font-size:13px;color:var(--doux)}
.vide{text-align:center;color:var(--doux);padding:18px}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--bord);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:none;padding:10px 2px 9px;font-size:12px;color:var(--doux)}
nav button b{display:block;font-size:20px;line-height:1.1}
nav button.actif{color:var(--navy);font-weight:700;box-shadow:inset 0 3px 0 var(--navy)}
#popup{position:fixed;inset:0;background:rgba(10,5,60,.65);display:flex;align-items:center;justify-content:center;padding:18px;z-index:10}
#popup[hidden]{display:none}
.lecbtn{background:none;border:none;border-bottom:1px dotted var(--navy);color:var(--navy);font:inherit;font-weight:600;padding:0;text-align:left;cursor:pointer}
.prochain .lecbtn{color:#FFD166;border-bottom-color:#FFD166}
#lecteur{position:fixed;inset:0;background:rgba(10,5,60,.65);display:flex;align-items:center;justify-content:center;padding:14px;z-index:20}

ha Isika hamorona olona tahaka ny endritsika, araka ny tarehintsika; ary aoka izy hanjaka amin’ ny hazandrano ao amin’ ny ranomasina sy ny voro-manidina sy ny biby fiompy sy ny tany rehetra ary ny biby rehetra izay mandady na mikisaka amin’ ny tany."],[27,"Ary Andriamanitra nahary ny olona tahaka ny endriny; tahaka ny endrik’ Andriamanitra no namoronany azy; lahy sy vavy no namoronany azy."],[28,"Ary Andriamanitra nitso-drano azy hoe: Maroa fara sy mihabetsaha ary mamenoa ny tany, ka mampanompoa azy; ary manjaka amin’ ny hazandrano ao amin’ ny ranomasina sy ny voro-manidina ary ny biby rehetra izay mihetsiketsika ambonin’ ny tany."],[29,"Ary Andriamanitra nanao hoe: Indro, efa nomeko anareo ny anana manintsam-boa rehetra izay ambonin’ ny tany rehetra ary ny hazo rehetra izay misy voa sady manintsam-boa; dia ho fihinana anareo ireny."],[30,"Ary ny amin’ ny bibi-dia rehetra sy ny voro-manidina rehetra ary ny zava-manan’ aina rehetra izay mandady na mikisaka amin’ ny tany, dia efa nomeko azy ny zava-maitso rehetra ho fihinany; dia nisy izany."],[31,"Ary hitan’ Andriamanitra izay rehetra nataony, ary, indro, tsara indrindra izany. Dia nisy hariva, ary nisy maraina, andro fahenina izany."]]},"3":{"t":"Jaona 5, 30-38","u":"https://baiboly.org/?book=john&chapter=5&tr=mg1865","v":[[30,"Raha Izaho ihany, dia tsy mahay manao na inona na inona; araka izay reko no itsarako; ary marina ny fitsarako; fa tsy mitady ny sitrapoko Aho, fa ny sitrapon’ izay naniraka Ahy."],[31,"Raha Izaho no manambara ny tenako, dia tsy marina ny fanambarako."],[32,"Misy Anankiray Izay manambara Ahy, ary fantatro fa marina ny fanambarana izay anambarany Ahy."],[33,"Hianareo naniraka tany amin’ i Jaona, ary nanambara ny marina izy."],[34,"Fa Izaho tsy mandray ny fanambarana avy amin’ olona; fa milaza izany zavatra izany Aho mba ho voavonjy ianareo."],[35,"Izy dia jiro nirehitra ka nazava; ary nahafinaritra anareo ny nifalianareo vetivety tamin’ faharavany."],[36,"Fa Izaho kosa manana fanambarana lehibe noho Jaona; fa ny asa nomen’ ny Ahy hovitaiko, dia izany asa ataoko izany no manambara Ahy fa nirahin’ ny Ray."],[37,"Ary ny Ray Izay naniraka Ahy, Izy no nanambara Ahy. Tsy mba renareo ny feony, na hitanareo akory aza ny endriny,"],[38,"ary ny teniny tsy mba mitoetra ao anatinareo, satria tsy mino Izay nirahiny ianareo."]]},"4":{"t":"Romana 8, 1-4","u":"https://baiboly.org/?book=romans&chapter=8&tr=mg1865","v":[[1,"Ary amin’ izany dia tsy misy fanamelohana ho an’ izay ao amin’ i Kristy Jesosy."],[2,"Fa ao amin’ i Kristy Jesosy ny lalàn’ ny Fanahin’ aina no nahafaka ahy tamin’ ny lalàn’ ny fahotana sy ny fahafatesana."],[3,"Fa izay tsy hain’ ny lalàna, satria ny nofo no nahalemy azy, dia vitan’ Andriamanitra tamin’ izy naniraka ny Zanany, naka ny endriky ny nofo ota sy ny amin’ ny ota, ka nanameloka ny ota tao amin’ ny nofo,"],[4,"mba hahatanteraka ny fahamarinana ilain’ ny lalàna amintsika, izay tsy mandeha araka ny nofo, fa araka ny Fanahy."]]}}},{"d":"2027-01-10","g":["KEFASY","ISAIA"],"a":{"KEFASY":["Mr Joelson","Mr Ando","Mr Yves","Mr Njaka","Mr Richard","Mme Sylvia"],"ISAIA":["Mr Tafita","Mr Haja","Mme Onja","Mme Tiana","Mme Albertine","Mme Holy"]},"l":{"2":{"t":"Deoteronomia 11, 1-9","u":"https://baiboly.org/?book=deuteronomy&chapter=11&tr=mg1865","v":[[1,"Ary tiava an’ i Jehovah Andriamanitrao, ka tandremo mandrakariva Izay asainy hotandremana, dia ny lalàny sy ny fitsipiny ary ny didiny."],[2,"Ary aoka ho fantatrao anio, fa izaho tsy miteny amin’ ny zanakareo izay tsy nahalala na nahita ny famaizan’ i Jehovah Andriamanitrareo sy ny fahalehibiazany sy ny tànany mahery sy ny sandriny nahinjitra"],[3,"sy ny famantarany sy ny asany, izay nataony tany Egypta tamin’ i Farao, mpanjakan’ i Egypta, sy ny taniny rehetra,"],[4,"sy izay nataony tamin’ ny miaramilan’ ny Egyptiana sy ny soavaliny ary ny kalesiny, dia ny nanasaforany azy tao amin’ ny Ranomasina Mena, raha nanenjika anareo Izy, dia voaringan’ i Jehovah mandraka androany,"],[5,"ary izay nataony taminareo tany an-efitra, hatramin’ ny nahatongavanareo teto amin’ ity tany ity,"],[6,"ary izay nataony tamin’ i Datana sy Abìrama, zanak’ i Eliaba, zanak’ i Robena, teo amin’ ny Isiraely rehetra, dia izay nisokafan’ ny tany sy nitelemany azy mbamin’ ny ankohonany sy ny lainy ary ny zava-manan’ aina izay nomba azy;"],[7,"fa ny masonareo efa nahita ny asa lehibe rehetra izay nataon’ i Jehovah."],[8,"Koa tandremo ny lalàna rehetra izay andidiako anareo anio, mba hahery ianareo, dia hiditra handova ny tany izay efa halehanareo holovana;"],[9,"ary, mba ho maro andro ianareo amin’ ny tany izay nianianan’ i Jehovah tamin’ ny razanareo homena azy sy ny taranany, dia tany izay tondra-dronono sy tantely."]]},"3":{"t":"Matio 16, 13-19","u":"https://baiboly.org/?book=matthew&chapter=16&tr=mg1865","v":[[13,"Ary rehefa tonga tany amin’ ny faritanin’ i Kaisaria-filipo Jesosy, dia nanontany ny mpianany Izy ka nanao hoe: Ataon’ ny olona ho iza moa ny Zanak’ olona?"],[14,"Dia hoy ireo: Hoy ny sasany: Jaona Mpanao-batisa; ary hoy ny sasany: Elia; ary hoy ny sasany: Jeremia, na anankiray amin’ ny mpaminany."],[15,"Ary hoy Jesosy taminy: Fa ianareo kosa manao Ahy ho iza?"],[16,"Ary namaly Simona Petera ka nanao hoe: Hianao no Kristy, Zanak’ Andriamanitra velona."],[17,"Dia namaly Jesosy ka nanao taminy hoe: Sambatra ianao, ry Simona Bar-jona; fa tsy nofo aman-drà no naneho anao izany, fa ny Raiko Izay any an-danitra."],[18,"Ary Izaho milaza aminao koa: Hianao no Petera, ary ambonin’ ity vatolampy ity no haoriko ny fiangonako; ary ny vavahadin’ ny fiainan-tsi-hita tsy haharesy azy."],[19,"Homeko anao ny fanalahidin’ ny fanjakan’ ny lanitra; ka na inona na inona fehezinao eto ambonin’ ny tany dia hofehezina any an-danitra; ary na inona na inona vahanao etỳ ambonin’ ny tany dia hovahana any an-danitra."]]},"4":{"t":"Asan'ny Apostoly 19, 11-22","u":"https://baiboly.org/?book=acts&chapter=19&tr=mg1865","v":[[11,"Ary ny tànan’ i Paoly no nanaovan’ Andriamanitra fahagagana lehibe maro,"],[12,"ka dia ny mosara sy ny fiaron’ akanjo teny aminy no nentina hatao amin’ ny marary, dia sitrana ny aretiny, ary nivoaka ny fanahy ratsy."],[13,"Ary nisy Jiosy sasany, mpiriorio mamoaka fanahy ratsy, izay ninia nanonona ny anaran’ i Jesosy Tompo koa teo ambonin’ ny manana fanahy ratsy ka nanao hoe: Mampianiana anareo amin’ i Jesosy Izay torin’ i Paoly aho."],[14,"Ary nisy fito mirahalahy, zanak’ i Skeva, Jiosy, lohan’ ny mpisorona, izay nanao izany."],[15,"Ary ny fanahy ratsy namaly ka nanao taminy hoe: Fantatro Jesosy, ary fantatro koa Paoly; fa mba iza kosa moa ianareo?"],[16,"Ary ny lehilahy izay nanana ny fanahy ratsy dia niantsambotra tamin’ ireo ary nahery ka naharesy azy roa lahy, dia nandositra niala tamin’ izany trano izany ireo sady nitanjaka no voaratra."],[17,"Ary fantatry ny Jiosy sy ny jentilisa rehetra izay nonina tany Efesosy izany; dia raiki-tahotra ny olona rehetra ka nankalaza ny anaran’ i Jesosy Tompo."],[18,"Ary maro izay nino dia tonga ka niaiky sy nilaza ny asany."],[19,"Ary maro ny mpanao ody no nanangona ny bokiny ka nandoro azy teo imason’ ny olona rehetra; ary nony voatontaly ny tokom-bidiny, dia hita fa volafotsy dimy alina izany."],[20,"Fatratra toy izany no fandroson’ ny tenin’ Andriamanitra sy ny heriny."],[21,"Ary rehefa vita izany zavatra izany, Paoly dia nikasa tao am-pony handeha hamaky an’ i Makedonia sy Akaia aloha vao hankany Jerosalema ka nanao hoe: Rehefa tonga any aho, dia tsy maintsy hahita an’ i Roma koa."],[22,"Ary ny roa lahy tamin’ izay nanompo ary, dia Timoty sy Erasto, no nirahiny nankany Makedonia; fa izy mbola nitoetra tany Asia andro vitsivitsy kosa."]]}}},{"d":"2027-01-17","g":["ESTERA","JAONA"],"a":{"ESTERA":["Mme Lanto","Mme Tsiry","Mme Georgina","Mr Patrick","Mr Rochel","Mme Tatamo"],"JAONA":["Mme Voahirana","Mme Vero","Dr Hasina","Mr Lalaina","Mr Adolph","Mr Tovo"]},"l":{"2":{"t":"Salamo 145, 8-21","u":"https://baiboly.org/?book=psalms&chapter=145&tr=mg1865","v":[[8,"Mamindra fo sy miantra Jehovah; Mahari-po sady be famindram-po Izy."],[9,"Manisy soa izao tontolo izao Jehovah; Ary ny fiantràny dia eny amin’ ny asany rehetra."],[10,"Jehovah ô, midera Anao ny asanao rehetra; Ary ny olonao masìna misaotra Anao."],[11,"Milaza ny voninahitry ny fanjakanao izy Sady miresaka ny herinao,"],[12,"Mba hampahafantarina ny zanak’ olombelona ny herinao Sy ny haben’ ny voninahitry ny fanjakanao."],[13,"Fanjakana mandrakizay ny fanjakanao, Ary hitatra amin’ ny taranaka fara mandimby ny fanapahanao."],[14,"Jehovah manohana izay rehetra efa ho lavo Sy mampitraka izay rehetra mitanondrika."],[15,"Ny mason’ izao rehetra izao miandrandra Anao, Ary Hianao manome azy ny haniny amin’ ny fotoany."],[16,"Manokatra ny tananao Hianao Ka mahavoky soa ny zava-miaina rehetra."],[17,"Marina Jehovah amin’ ny lalany rehetra, Sady mamindra fo amin’ ny asany rehetra."],[18,"Jehovah dia eo akaikin’ izay rehetra miantso Azy, Dia izay rehetra miantso Azy marina tokoa."],[19,"Hanefa ny irin’ izay matahotra Azy Izy Ary hihaino ny fitarainany ka hamonjy azy."],[20,"Miaro izay rehetra tia Azy Jehovah; Fa ny ratsy fanahy rehetra kosa haringany."],[21,"Ny fiderana an’ i Jehovah no hotenenin’ ny vavako; Ary aoka ny nofo rehetra hankalaza ny anarany masìna mandrakizay doria."]]},"3":{"t":"Jaona 6, 47-51","u":"https://baiboly.org/?book=john&chapter=6&tr=mg1865","v":[[47,"Lazaiko aminareo marina dia marina tokoa: Izay mino no manana fiainana mandrakizay."],[48,"Izaho no mofon’ aina."],[49,"Ny razanareo nihinana ny mana tany an-efitra, nefa maty ihany."],[50,"Ity no mofo izay midìna avy any an-danitra, mba tsy ho faty izay mihinana azy."],[51,"Izaho no mofo velona izay nidina avy tany an-danitra; raha misy mihinana ity mofo ity, dia ho velona mandrakizay izy; ary ny mofo izay homeko dia ny nofoko ho fiainan’ izao tontolo izao."]]},"4":{"t":"1 Korintiana 11, 20-34","u":"https://baiboly.org/?book=1-corinthians&chapter=11&tr=mg1865","v":[[20,"Koa raha miangona ianareo, dia tsy misy hihinanana ny Fanasan’ ny Tompo akory."],[21,"Fa raha mihinana ianareo, dia samy homana ny sakafony avy aloha ianareo; koa ny anankiray dia noana, fa ny anankiray kosa mamo."],[22,"Moa tsy manan-trano hihinanana sy hisotroana va ianareo? Sa manao tsinontsinona ny fiangonan’ Andriamanitra ka manome henatra ny tsy manana? Inona no holazaiko aminareo? Hidera anareo va aho? Tsy hidera anareo amin’ izany aho."],[23,"Fa izaho efa nandray tamin’ ny Tompo izay natolotro anareo kosa, fa Jesosy Tompo tamin’ iny alina iny izay namadihana Azy, dia nandray mofo,"],[24,"ary rehefa nisaotra Izy, dia novakiny, ka hoy Izy: Ity no tenako ho anareo; izao no ataovy ho fahatsiarovana Ahy."],[25,"Dia araka izany koa ny kapoaka, rehefa nihinana, dia hoy Izy: Ity kapoaka ity no ilay fanekena vaovao amin’ ny rako; izao no ataovy ho fahatsiarovana Ahy, na oviana na oviana no misotro ianareo."],[26,"Fa na oviana na oviana ianareo no mihinana itony mofo itony sy misotro amin’ ny kapoaka, dia manambara ny fahafatesan’ ny Tompo ianareo mandra-pihaviny."],[27,"Koa na zovy an zovy no mihinana ny mofo sy misotro amin’ ny kapoaky ny Tompo amin’ ny fanahy tsy mendrika, dia ho meloka ny amin’ ny tena sy ny ran’ ny Tompo izy."],[28,"Fa aoka ny olona hamantatra ny tenany, dia aoka izy hihinana ny mofo sy hisotro amin’ ny kapoaka."],[29,"Fa izay rehetra mihinana sy misotro dia mihinana sy misotro fanamelohana ho an’ ny tenany, raha tsy mamantatra ny tena izy."],[30,"Noho izany dia betsaka no marary sy marofy eo aminareo, ary maro ihany no efa nodi-mandry."],[31,"Fa raha mba mamantatra ny tenantsika isika, dia tsy mba hotsaraina."],[32,"Fa raha tsaraina isika, dia faizan’ ny Tompo mba tsy hohelohina miaraka amin’ izao tontolo izao."],[33,"Koa raha miangona hihinana ianareo, ry rahalahy, dia mifampiandrasa."],[34,"Ary raha misy olona noana, aoka izy hihinana no an-tranony, mba tsy hiangonanareo ho fahamelohana. Ary ny zavatra sisa dia halahatro, rehefa tonga aho."]]}}},{"d":"2027-01-24","g":["ROTA","KEFASY"],"a":{"ROTA":["Mme Tsiory","Mme Patricia","Mr Rivo","Mr Herimanitra","Mme Onja","Mme Lucie"],"KEFASY":["Mme Sitraka","Mme Vony","Mme Odette","Mme Felana","Mme Lea","Mme Alphonsine"]},"l":{"2":{"t":"Eksodosy 14, 1-14","u":"https://baiboly.org/?book=exodus&chapter=14&tr=mg1865","v":[[1,"Ary Jehovah niteny tamin’ i Mosesy ka nanao hoe:"],[2,"Lazao amin’ ny Zanak’ Isiraely mba hivily izy ka hitoby eo akaikin’ i Pi-hahirota, eo anelanelan’ i Migdolasy ny ranomasina; eo akaikin’ i Bala-zefona, dia tandrifiny, no hitobianareo, eo amoron’ ny ranomasina."],[3,"Ary Farao hilaza ny Zanak’ Isiraely hoe: Azon’ ny tamberintany izy ka voahidin’ ny efitra."],[4,"Dia hanamafy ny fon’ i Farao Aho, ka hanenjika anareo izy; dia hankalazaina Aho noho ny hataoko amin’ i Farao sy amin’ ny miaramilany rehetra, ka ho fantatry ny Egyptiana fa Izaho no Jehovah. Dia nataon’ ny Zanak’ Isiraely izany."],[5,"Ary nisy nanambara tamin’ ny mpanjakan’ i Egypta fa efa nandositra ny olona, dia niova ny fon’ i Farao sy ny mpanompony ny amin’ ny olona, ka hoy izy: Inona izao nataontsika izao, no nandefa ny Isiraely hiala tamin’ ny fanompoany antsika isika?"],[6,"Dia nasainy nofehezina tamin’ ny kalesy ny soavaly, sady nitondra ny vahoakany hanaraka azy izy."],[7,"Ary nitondra kalesy enin-jato voafantina sy ny kalesin’ ny Egyptiana rehetra izy, izay samy nisy mpiady avy izy rehetra."],[8,"Ary Jehovah nanamafy ny fon’ i Farao, mpanjakan’ i Egypta, dia nanenjika ny Zanak’ Isiraely izy, na dia tamin’ ny tanana avo aza no nivoahany."],[9,"Koa nanenjika azy ny Egyptiana, dia ny soavaly rehetra mitarika ny kalesin’ i Farao sy ny soavaliny fitaingina ary ny miaramilany, ka nahatratra azy nitoby teo amoron’ ny ranomasina, teo anilan’ i Pi-hahirota, tandrifin’ i Balazefona."],[10,"Ary rehefa mby akaiky Farao, dia natopin’ ny Zanak’ Isiraely ny masony, ka, indreo, ny Egyptiana tamy manenjika azy; dia raiki-tahotra indrindra ny Zanak’ Isiraely ka nitaraina tamin’ i Jehovah."],[11,"Ary hoy koa izy tamin’ i Mosesy: Moa tsy nisy fasana va tany Egypta, no nentinao ho faty atỳ an-efitra izahay? Nahoana no nanao izany taminay ianao ka nitondra anay nivoaka avy tany Egypta?"],[12,"Tsy izao va no teny nolazainay taminao fony tany Egypta hoe: Aoka izay fa avelao ihany izahay hanompo ny Egyptiana? Fa aleonay manompo ny Egyptiana toy izay ho faty any an-efitra."],[13,"Ary hoy Mosesy tamin’ ny olona: Aza matahotra ianareo, mijanòna, fa ho hitanareo ny famonjen’ i Jehovah, izay hataony ho anareo anio; fa ny Egyptiana, izay hitanareo anio, dia tsy ho hitanareo intsony mandrakizay."],[14,"Jehovah hiady ho anareo, fa ianareo kosa hangina."]]},"3":{"t":"Jaona 14, 8-11","u":"https://baiboly.org/?book=john&chapter=14&tr=mg1865","v":[[8,"Hoy Filipo taminy: Tompoko, asehoy anay ny Ray, dia ampy ho anay izay."],[9,"Hoy Jesosy taminy: Izay ela izay no efa nitoerako teto aminareo, ka tsy mbola fantatrao ihany va Aho, ry Filipo? Izay nahita Ahy dia nahita ny Ray; koa ahoana no anaovanareo hoe: Asehoy anay ny Ray?"],[10,"Tsy mino va ianao fa Izaho ao amin’ ny Ray, ary ny Ray ato amiko? Ny teny izay lazaiko aminareo, dia tsy avy amiko izany lazaiko izany; fa ny Ray mitoetra ato amiko no manao ny asa."],[11,"Minoa Ahy fa Izaho ao amin’ ny Ray, ary ny Ray ato amiko; fa raha tsy izany, dia minoa Ahy noho ny asa ihany aza."]]},"4":{"t":"1 Jaona 1, 1-4","u":"https://baiboly.org/?book=1-john&chapter=1&tr=mg1865","v":[[1,"Izay hatramin’ ny voalohany, dia izay efa renay, izay efa hitan’ ny masonay, izay efa nojerenay sady efa notsapain’ ny tananay, dia ny amin’ ny Teny Fiainana"],[2,"(fa efa naseho ny fiainana, ary efa nahita azy izahay, dia tonga vavolombelona ka manambara aminareo ny fiainana mandrakizay, izay tao amin’ ny Ray ka efa naseho taminay), ―"],[3,"izay efa hitanay sy renay no ambaranay aminareo, mba hahazoanareo firaisana aminay koa; ary ny firaisanay dia amin’ ny Ray sy amin’ i Jesosy Kristy Zanany."],[4,"Ary izao zavatra izao no soratanay, mba ho tanteraka ny fifaliantsika."]]}}},{"d":"2027-01-31","g":["ISAIA"],"a":{"ISAIA":["Mme Hanta","Mme Germaine","Mme Rahely","Mr Tafita","Mr Haja","Mme Onja"]},"l":{"2":{"t":"Ezekiela 20, 39-44","u":"https://baiboly.org/?book=ezekiel&chapter=20&tr=mg1865","v":[[39,"Ary ny aminareo, ry taranak’ Isiraely, izao no lazain’ i Jehovah Tompo; Samia mandeha ianareo, ka manompoa ny sampinareo; nefa any aoriana kosa dia hihaino Ahy mihitsy ianareo ka tsy handoto ny anarako masìna intsony amin’ ny fanatitrareo sy amin’ ny sampinareo."],[40,"Fa ao an-tendrombohitro masìna, dia ao an-tendrombohitra avon’ ny Isiraely, hoy Jehovah Tompo, no hanompoan’ ny taranak’ Isiraely rehetra Ahy, dia izay rehetra amin’ ny tany; ao no hankasitrahako azy, ary ao no hilako ny fanatitrareo sy ny voaloham-bokatra aterinareo amin’ ny zava-masinareo rehetra,"],[41,"Hankasitrahako toy ny hanitra ankasitrahana ianareo amin’ ny hitondrako anareo mivoata avy any amin’ ny firenena sy ny hamoriako anareo avy any amin’ ny tany samy hafa nampielezana anareo, ka dia hiseho ho masìna eo anatrehan’ ny jentilisa Aho amin’ ny hataoko aminareo."],[42,"Ary ho fantatrareo fa Izaho no Jehovah, raha mitondra anareo ho any amin’ ny tanin’ ny Isiraely Aho, dia ny tany izay nananganako tanana nomena ny razanareo."],[43,"Ary hotsaroanareo any ny nalehanareo sy ny nataonareo rehetra izay nahaloto anareo; ary haharikoriko anareo ny tenanareo noho ny ratsy rehetra izay nataonareo."],[44,"Dia ho fantatrareo fa Izaho no Jehovah, rehefa miasa aminareo Aho noho ny amin’ ny anarako, fa tsy araka ny lalàn-dratsinareo, na araka ny ratsy fanaonareo, ry taranak’ Isiraely, hoy Jehovah Tompo."]]},"3":{"t":"Lioka 7, 18-23","u":"https://baiboly.org/?book=luke&chapter=7&tr=mg1865","v":[[18,"Ary ny mpianatr’ i Jaona nanambara izany rehetra izany taminy."],[19,"Ary Jaona niantso ny mpianany roa lahy hankao aminy, dia naniraka azy hankany amin’ ny Tompo hanao hoe: Hianao va Ilay ho avy, sa mbola hafa no andrasantsika?"],[20,"Ary nony tonga tany aminy ireo lehilahy ireo, dia nanao hoe: Jaona Mpanao-batisa naniraka anay hankatỳ aminao hanao hoe: Hianao va Ilay ho avy, sa mbola hafa no andrasantsika?"],[21,"Ary tamin’ izany ora izany Jesosy dia nahasitrana olona maro tamin’ ny rofy sy ny aretina sy ny fanahy ratsy sady nampahiratra ny jamba maro."],[22,"Dia namaly Izy ka nanao taminy hoe: Mandehana ianareo, ambarao amin’ i Jaona izao hitanareo sy renareo izao; mahiratra ny jamba, afaka ny mandringa, diovina ny boka, malady ny marenina, atsangana ny maty, ary ny malahelo dia itoriana ny filazantsara."],[23,"Ary sambatra izay tsy ho tafintohina noho ny amiko."]]},"4":{"t":"Apokalypsy 3, 14-22","u":"https://baiboly.org/?book=revelation&chapter=3&tr=mg1865","v":[[14,"Ary soraty ho amin’ ny anjelin’ ny fiangonana any Laodikia: Izao no lazain’ ny Amena, dia Ilay Vavolombelona mahatoky sy marina, Izay niandohan’ izao zavatra noharin’ Andriamanitra izao:"],[15,"Fantatro ny asanao, fa tsy mangatsiaka na mafana ianao; aleo ho mangatsiaka na ho mafana ianao."],[16,"Fa satria matimaty ianao ka tsy mafana na mangatsiaka, dia efa haloan’ ny vavako ianao;"],[17,"fa hoy ianao: Manan-karena sy efa nihary fananana be aho ka tsy manan-java-mahory; kanjo tsy fantatrao fa ianao no ilay ory sy mahantra sy malahelo sy jamba ary mitanjaka;"],[18,"dia manoro hevitra anao Aho hividy amiko volamena voadio tamin’ ny afo, mba hanan-karena ianao, ary fitafiana fotsy hotafinao, mba tsy hisehoan’ ny henatrao noho ny fitanjahana, ary odi-maso hahosotrao ny masonao mba hahiratanao."],[19,"Izay rehetra tiako no anariko sy faizako; koa dia mazotoa ianao, ka mibebaha."],[20,"Indro, efa mitsangana eo am-baravarana Aho ka mandondòna; raha misy mihaino ny feoko ka mamoha ny varavarana, dia hiditra ao aminy Aho ka hiara-misakafo aminy, ary izy amiko."],[21,"Izay maharesy dia havelako hiara-mipetraka amiko eo ambonin’ ny seza fiandrianako, dia tahaka ny nandreseko kosa sy ny niarahako nipetraka amin’ ny Raiko eo ambonin’ ny seza fiandrianany."],[22,"Izay manan-tsofina, aoka izy hihaino izay lazain’ ny Fanahy amin’ ny fiangonana."]]}}},{"d":"2027-02-07","g":["ESTERA","JAONA"],"a":{"ESTERA":["Mr Hery","Mme Voahirana","Mme Lanto","Mme Tsiry","Mme Georgina","Mr Patrick"],"JAONA":["Mr Naina","Mme Tiana","Mme Mama Li","Mme Yoily","Mme Sidonie","Mme Saholy"]},"l":{"2":{"t":"1 Samoela 1, 21-28","u":"https://baiboly.org/?book=1-samuel&chapter=1&tr=mg1865","v":[[21,"Ary ralehilahy Elkana sy ny ankohonany rehetra niakatra hamono zavatra mba hanaterany ny fanatitra fanao isan-taona ho an’ i Jehovah sy ny fanalam-boadiny."],[22,"Fa Hana kosa tsy mba niakatra; fa hoy izy tamin’ ny vadiny: Aoka aloha mandra-panoty ny zaza, fa amin’ izay aho vao hitondra azy hiseho eo anatrehan’ i Jehovah, ka hitoetra ao mandrakizay izy."],[23,"Ary hoy Elkana vadiny taminy: Ataovy ary izay tianao; mitoera ihany mandra-panotinao azy; ary hefain’ i Jehovah anie ny teniny. Dia nitoetra ravehivavy ka nampinono ny zanany mandra-panotiny azy."],[24,"Ary nony efa maoty ny zaza, vao nentiny niakatra niaraka taminy izy mbamin’ ny vantotr’ ombilahy telo sy koba iray efaha ary divay iray tavoara, ka nentiny ho ao an-tranon’ i Jehovah tao Silo izy; ary mbola kely ny zaza."],[25,"Dia novonoiny ny vantotr’ ombilahy iray, ary nentiny ho ao amin’ i Ely ny zaza."],[26,"Ary hoy Hana: Tompoko ô, raha velona koa ny ainao, tompoko, izaho ilay vehivavy nitsangana teto anilanao ka nivavaka tamin’ i Jehovah."],[27,"Ny hahazoako ity zazalahy ity no nivavahako; dia nomen’ i Jehovah ahy izay nangatahiko taminy."],[28,"Koa atolotro ho an’ i Jehovah kosa izy: eny, amin’ ny andro rehetra hiainany dia voatolotra ho an’ i Jehovah izy. Dia nivavaka tamin’ i Jehovah izy."]]},"3":{"t":"Lioka 2, 39-52","u":"https://baiboly.org/?book=luke&chapter=2&tr=mg1865","v":[[39,"Ary rehefa vitany ny zavatra rehetra araka ny lalàn’ ny Tompo, dia niverina tany Galilia izy, dia tao Nazareta tanànany."],[40,"Ary ny Zaza dia nitombo ka nihahery sady feno fahendrena; ary ny fahasoavan’ Andriamanitra no tao aminy."],[41,"Ary ny ray aman-dreniny nankany Jerosalema isan-taona, raha avy ny andro firavoravoana amin’ ny Paska."],[42,"Ary rehefa roa ambin’ ny folo taona Jesosy, dia niakatra izy ireo, araka ny fanao amin’ ny andro firavoravoana."],[43,"Ary rehefa tapitra izany andro izany, ka nody izy, Jesosy zaza dia mbola nitoetra tany Jerosalema ihany, nefa tsy fantatry ny ray aman-dreniny izany;"],[44,"ary satria nataony fa niaraka tamin’ ny niara-dia taminy Izy, dia nandeha lalana indray andro izy vao nitady Azy tamin’ ny havany sy ny olom-pantany."],[45,"Ary nony tsy nahita Azy izy, dia niverina ho any Jerosalema nitady Azy."],[46,"Ary rehefa afaka hateloana, dia hitany teo an-kianjan’ ny tempoly Izy nipetraka teo afovoan’ ny mpampianatra ka nihaino sady nanontany azy."],[47,"Ary talanjona izay rehetra nandre Azy noho ny fahalalany sy ny famaliany."],[48,"Ary raha nahita Azy izy, dia talanjona, ka hoy ny reniny taminy: Anaka, nahoana no nanao toy izay taminay Hianao? He! izato alahelon-drainao sy izaho nitady Anao!"],[49,"Fa hoy Izy taminy: Nahoana no nitady Ahy ianareo? tsy fantatrareo va fa tsy maintsy ho eto an-tranon’ ny Raiko Aho?"],[50,"Nefa tsy azon’ ireo ny teny izay nolazainy taminy."],[51,"Ary niara-nidina taminy nankany Nazareta Izy ka nanoa azy. Ary ny reniny nitahiry izany teny rehetra izany tao am-pony."],[52,"Ary Jesosy nitombo saina sy tena sady nandroso fitia tamin’ Andriamanitra sy ny olona."]]},"4":{"t":"1 Timoty 5, 1-8","u":"https://baiboly.org/?book=1-timothy&chapter=5&tr=mg1865","v":[[1,"Aza mamely mafy loatra ny anti-panahy, fa anaro toy ny ray izy, ny tanora fanahy toy ny rahalahy,"],[2,"ny vehivavy anti-panahy toy ny reny, ny tanora fanahy toy ny anabavy, amin’ ny fahadiovana rehetra."],[3,"Omeo voninahitra ny mpitondratena izay efa mpitondratena tokoa."],[4,"Fa raha misy mpitondratena manana zanaka na zafy, aoka ireo hianatra aloha haneho izay toe-panahy araka an’ Andriamanitra amin’ ny ao an-tranony ka hamaly soa ny rainy aman-dreniny; fa izany no ankasitrahana eo anatrehan’ Andriamanitra."],[5,"Fa izay efa mpitondratena tokoa ka irery tena dia efa manantena an’ Andriamanitra ka maharitra amin’ ny fangatahana sy ny fivavahana andro aman’ alina"],[6,"Fa izay vehivavy manaram-po amin’ ny fahafinaretana dia maty fahavelony."],[7,"Ary izany zavatra izany no andidio, mba tsy hananany tsiny."],[8,"Fa raha misy tsy mamelona ny azy, indrindra fa ny ankohonany, dia efa nandà ny finoana izy ka ratsy noho ny tsy mino aza."]]}}},{"d":"2027-02-14","g":["ROTA","KEFASY"],"a":{"ROTA":["Mme Lalao","Mme Mavo","Mme Julie","Mme Vola","Mr Parany","Mr Sen"],"KEFASY":["Mr Njaka","Mr Yves","Mme Sylvia","Mr Richard","Mr Ando","Mr Joelson"]},"l":{"2":{"t":"Ohabolana 4, 20-27","u":"https://baiboly.org/?book=proverbs&chapter=4&tr=mg1865","v":[[20,"Anaka, tandremo ny teniko; Atongilano ny sofinao hihaino ny filazako."],[21,"Aza avela hiala eo imasonao izy, Fa raketo ao am-ponao."],[22,"Fa aina ho an’ ny mahazo azy izy Ary fahasalamana ho an’ ny nofony rehetra."],[23,"Tandremo ny fonao mihoatra noho izay rehetra tokony hotandremana; Fa avy ao aminy no ihavian’ ny aina."],[24,"Esory aminao ny vava mandainga, Ary ampanalaviro anao ny molotra mamitaka."],[25,"Aoka ny masonao hijery mahitsy, Ary ny hodimasonao hibanjina eo anoloanao."],[26,"Ataovy marina ny alehan’ ny tongotrao, Dia ho voalamina ny alehanao rehetra;"],[27,"Aza mivily, na ho amin’ ny ankavanana, na ho amin’ ny ankavia; Esory amin’ ny ratsy ny tongotrao."]]},"3":{"t":"Lioka 8, 19-21","u":"https://baiboly.org/?book=luke&chapter=8&tr=mg1865","v":[[19,"Ary renin’ i Jesosy sy ny rahalahiny nanatona Azy, fa tsy nahazo nihaona taminy, satria nifanety ny vahoaka."],[20,"Ary nisy nilaza taminy hoe: Ny reninao sy ny rahalahinao mijanona ato ala-trano ta-hahita Anao."],[21,"Fa namaly Izy ka nanao taminy hoe: Ny reniko sy ny rahalahiko dia ireto izay mandre ny tenin’ Andriamanitra ka mankatò azy."]]},"4":{"t":"Kolosiana 3, 16-17","u":"https://baiboly.org/?book=colossians&chapter=3&tr=mg1865","v":[[16,"Aoka ny tenin’ i Kristy hitoetra betsaka ao aminareo amin’ ny fahendrena rehetra, dia mifampianara ka mifananara amin’ ny salamo sy ny fihirana ary ny tonon-kiram-panahy, mihira amin’ ny fahasoavana ao am-ponareo ho an’ Andriamanitra."],[17,"Ary na inona na inona no ataonareo, na amin’ ny teny, na amin’ ny asa, dia ataovy amin’ ny anaran’ i Jesosy Tompo izany, ka misaora Andriamanitra Ray amin’ ny alalany."]]}}},{"d":"2027-02-21","g":["ISAIA","ESTERA"],"a":{"ISAIA":["Mme Tiana","Mme Albertine","Mme Holy","Mme Hanta","Mme Germaine","Mme Rahely"],"ESTERA":["Mme Tatamo","Mr Rochel","Mme Voahirana","Mr Hery","Mme Lanto","Mme Tsiry"]},"l":{"2":{"t":"Mpitoriteny 5, 1-6","u":"https://baiboly.org/?book=ecclesiastes&chapter=5&tr=mg1865","v":[[1,"Aza haingam-bava, ary aza malaky manonona teny eo anatrehan’ Andriamanitra ny fonao; fa Andriamanitra dia any an-danitra ary ianao etỳ an-tany, koa aoka ho vitsy ny teninao."],[2,"Fa ny haben’ ny fisasarana no mahatonga ny nofy; ary ny haben’ ny teny no isehoan’ ny rediredin’ ny adala."],[3,"Raha mivoady amin’ Andriamanitra ianao, aza manao ampitso lava: fa tsy ankasitrahany ny adala; koa efao ny voadinao."],[4,"Aleo tsy mivoady toy izay mivoady ka tsy mahefa."],[5,"Aza avela hahatonga heloka amin’ ny tenanao ny vavanao; ary aza manao eo imason’ ny anjely hoe: Niteny tsy nahy aho; nahoana no ho tezitra amin’ ny teninao Andriamanitra ka hanimba ny asan’ ny tananao?"],[6,"Fa amin’ ny haben’ ny nofy dia misy zava-poana; ary toy izany koa ny haben’ ny teny, fa Andriamanitra no atahory."]]},"3":{"t":"Matio 7, 21-27","u":"https://baiboly.org/?book=matthew&chapter=7&tr=mg1865","v":[[21,"Tsy izay rehetra manao amiko hoe: Tompoko, Tompoko, no hiditra amin’ ny fanjakan’ ny lanitra, fa izay manao ny sitrapon’ ny Raiko Izay any an-danitra."],[22,"Maro no hanao amiko amin’ izany andro izany hoe: Tompoko, Tompoko, tsy efa naminany tamin’ ny anaranao va izahay? ary tsy efa namoaka demonia tamin’ ny anaranao va izahay? Ary tsy efa nanao asa lehibe maro tamin’ ny anaranao va izahay?"],[23,"Ary dia hambarako aminy marimarina hoe: Tsy mba fantatro akory ianareo hatrizay hatrizay; mialà amiko, ianareo mpanao meloka."],[24,"Koa amin’ izany na zovy na zovy no mandre izany teniko izany ka mankatò azy, dia hoharina amin’ ny lehilahy manan-tsaina izy, izay nanorina ny tranony teo ambonin’ ny vatolampy."],[25,"Ary latsaka ny ranonorana, ka nisy riaka be, sady nifofofofo ny rivotra ka namely izany trano izany; nefa tsy nianjera izy, satria efa naorina teo ambonin’ ny vatolampy."],[26,"Fa izay rehetra mandre izany teniko izany, nefa tsy mankatò azy, dia hoharina amin’ ny lehilahy adala, izay nanorina ny tranony teo ambonin’ ny fasika."],[27,"Ary latsaka ny ranonorana, ka nisy riaka be, sady nifofofofo ny rivotra ka namely izany trano izany; dia nianjera izy, ka loza ny fianjerany."]]},"4":{"t":"1 Timoty 5, 21-25","u":"https://baiboly.org/?book=1-timothy&chapter=5&tr=mg1865","v":[[21,"Mananatra anao mafy aho eo anatrehan’ Andriamanitra sy Kristy Jesosy ary ny anjely voafidy mba hotandremanao izany zavatra izany, tsy manao olon-tiana, na manao na inona na inona amin’ ny fiangarana."],[22,"Aza malaky mametra-tanana amin’ olona na iza na iza, ary aza miombona ota amin’ ny sasany; tehirizo madio ny tenanao."],[23,"Aza misotro rano intsony fa misotroa divay kely noho ny vava-fonao sy ny fahosaosanao matetika."],[24,"Ny fahotan’ ny olona sasany miharihary ka mialoha ho amin’ ny fitsarana, fa ny an’ ny sasany kosa manaraka ato aoriana."],[25,"Ary miharihary toy izany koa ny asa tsara; ary izay tsy toy izany dia tsy ho azo afenina."]]}}},{"d":"2027-02-28","g":["JAONA"],"a":{"JAONA":["Mme Vero","Mme Voahirana","Mr Lalaina","Dr Hasina","Mr Tovo","Mr Adolph"]},"l":{"2":{"t":"Genesisy 17, 9-14","u":"https://baiboly.org/?book=genesis&chapter=17&tr=mg1865","v":[[9,"Dia hoy Andriamanitra tamin’ i Abrahama: Fa ny aminao kosa, dia hitandrina ny fanekeko ianao, dia ianao sy ny taranakao mandimby anao hatramin’ ny taranaka fara mandimby."],[10,"Ary izao no fanekeko ho amiko sy ho aminareo sy ny taranakao mandimby anao, dia izay hotandremanareo: hoforana ny lehilahy rehetra eo aminareo."],[11,"Dia hoforana ianareo; ary ho famantarana ny fanekena ho amiko sy ho aminareo izany."],[12,"Ny zazalahy teraka havaloana eo aminareo no hoforana, dia ny lehilahy rehetra amin’ ny taranakareo hatramin’ ny fara mandimby: na ny ompikely, na izay novidim-bola tamin’ ny hafa firenena ka tsy avy amin’ ny taranakao."],[13,"Tsy maintsy hoforana ny ompikelinao sy izay novidinao vola; ary ny fanekeko dia ho ao amin’ ny nofonareo ho fanekena mandrakizay."],[14,"Ary ny lehilahy tsy voafora, izay tsy mbola noforana, dia hofongorana tsy ho amin’ ny fireneny; efa nivadika ny fanekeko izy."]]},"3":{"t":"Lioka 2, 21-24","u":"https://baiboly.org/?book=luke&chapter=2&tr=mg1865","v":[[21,"Ary rehefa tapitra ny havaloana, ka hoforana ny Zaza, dia nataony hoe Jesosy ny anarany, araka ilay nataon’ ny anjely, fony tsy mbola torontoronina tao an-kibo Izy."],[22,"Ary rehefa tapitra ny andro fidiovany, araka ny lalàn’ i Mosesy, dia nitondra Azy niakatra tany Jerosalema izy mba hatolotra ho an’ ny Tompo"],[23,"araka ny voasoratra ao amin’ ny lalàn’ ny Tompo hoe: Ny lahy voalohan-teraka rehetra hatao hoe masìna ho an’ i Jehovah."],[24,"ary mba hanatitra fanatitra araka izay voalaza ao amin’ ny lalàn’ ny Tompo hoe: domohina roa, na zana-boromailala roa."]]},"4":{"t":"Kolosiana 2, 8-15","u":"https://baiboly.org/?book=colossians&chapter=2&tr=mg1865","v":[[8,"Tandremo fandrao misy mahalasa anareo ho babony amin’ ny filosofia sy ny famitahana foana, araka ny fampianarana voatolotry ny razana, araka ny abidim-pianaran’ izao tontolo izao, fa tsy araka an’ i Kristy."],[9,"Fa ao amin’ ny tenany no itoeran’ ny fahafenoan’ ny fomban’ Andriamanitra rehetra;"],[10,"ary ianareo dia tanteraka ao aminy, sady Izy no Lohan’ ny fanapahana sy ny fahefana rehetra,"],[11,"ary tao aminy koa no namorana anareo tamin’ ny famorana tsy nataon-tanana, tamin’ ny fanesorana ny tenan’ ny nofo, dia tamin’ ny famoran’ i Kristy;"],[12,"fa niara-nilevina taminy ianareo tamin’ ny batisa, izay niarahanareo natsangana taminy koa noho ny finoana ny asan’ Andriamanitra, izay nanangana Azy tamin’ ny maty."],[13,"Ary ianareo, izay efa matin’ ny fahadisoana sy ny tsi-fiforan’ ny nofonareo, dia novelominy niaraka tamin’ i Kristy, rehefa navelany ny fahadisoantsika rehetra;"],[14,"ary novonoiny ny sora-tànan’ ny didy izay niampanga antsika; dia nesoriny tsy ho eo mihitsy izany ka nohomboany tamin’ ny hazo fijaliana,"],[15,"ary nesoriny tsy ho eo amin’ ny tenany ny fanapahana sy ny fahefana, ary noho ny hazo fijaliana dia nasehony miharihary ny fitondrany ireo toy ny fanaon’ izay avy nandresy."]]}}},{"d":"2027-03-07","g":["ROTA","KEFASY"],"a":{"ROTA":["Mr Rivo","Mr Jean Claude","Mme Onja","Mme Tsiory","Mr Herimanitra","Mme Patricia"],"KEFASY":["Mme Alphonsine","Mme Lea","Mme Vony","Mme Sitraka","Mme Felana","Mme Odette"]},"l":{"2":{"t":"Deoteronomia 26, 16-19","u":"https://baiboly.org/?book=deuteronomy&chapter=26&tr=mg1865","v":[[16,"Anio no andidian’ i Jehovah Andriamanitrao anao hanaraka ireo didy sy fitsipika ireo; koa tandremo sy araho amin’ ny fonao rehetra sy ny fanahinao rehetra ireo."],[17,"Efa nampiteny an’ i Jehovah ianao androany fa ho Andriamanitrao Izy, ka handeha amin’ ny lalany sy hitandrina ny lalàny sy ny didiny ary ny fitsipiny ianao ary hihaino ny feony."],[18,"Ary Jehovah kosa efa nampiteny anao androany fa firenena rakitra soa ho Azy ianao, araka izay nolazainy taminao, mba hitandremanao ny didiny rehetra,"],[19,"sy hanandratany anao ho ambonin’ ny firenena rehetra izay nataony, ho fiderana sy ho anarana ary ho voninahitra ary mba ho firenena masìna ho an’ i Jehovah Andriamanitrao ianao, araka izay nolazainy."]]},"3":{"t":"Jaona 4, 39-42","u":"https://baiboly.org/?book=john&chapter=4&tr=mg1865","v":[[39,"Ary maro ny Samaritana avy tao amin’ izany tanàna izany no nino an’ i Jesosy noho ny filazan-dravehivavy, izay nanambara hoe: Nolazainy tamiko avokoa izay rehetra nataoko."],[40,"Ary rehefa nanatona Azy ny Samaritana, dia nangataka Azy hitoetra tao aminy; ka dia nitoetra tao indroa andro Izy."],[41,"Ary maro koa no nino noho ny teniny"],[42,"ka nanao tamin-dravehivavy hoe: Tsy noho ny filazanao ihany no inoanay, fa ny tenanay no mandre, ka fantatray fa Izy tokoa no Mpamonjy izao tontolo izao."]]},"4":{"t":"Romana 8, 26-30","u":"https://baiboly.org/?book=romans&chapter=8&tr=mg1865","v":[[26,"Ary toy izany koa, ny Fanahy no mamonjy ny fahalementsika: fa tsy fantatsika izay vavaka tokony hataontsika; fa ny Fanahy no mifona amin’ ny fitarainana tsy azo tononina."],[27,"Ary Izay mandinika ny fo no mahalala izay hevitry ny Fanahy, satria araka an’ Andriamanitra ny fifonany ho an’ ny olona masìna."],[28,"Ary fantatsika fa ny zavatra rehetra dia miara-miasa hahasoa izay tia an’ Andriamanitra, dia izay voantso araka ny fikasany rahateo."],[29,"satria izay fantany rahateo no notendreny koa hitovy endrika amin’ ny Zanany, mba ho Lahimatoa amin’ ny rahalahy maro Izy."],[30,"Ary izay notendreny no nantsoiny koa; ary izay nantsoiny no nohamarininy koa; ary izay nohamarininy no nomeny voninahitra koa."]]}}},{"d":"2027-03-14","g":["ISAIA","ESTERA"],"a":{"ISAIA":["Mr Haja","Mr Tafita","Mme Tiana","Mme Onja","Mme Holy","Mme Albertine"],"ESTERA":["Mme Georgina","Mr Patrick","Mr Rochel","Mme Tatamo","Mr Hery","Mme Voahirana"]},"l":{"2":{"t":"Mpitsara 3, 7-10","u":"https://baiboly.org/?book=judges&chapter=3&tr=mg1865","v":[[7,"Ary nanao izay ratsy eo imason’ i Jehovah ny Zanak’ Isiraely ka nanadino an’ i Jehovah Andriamaniny ary nanompo ireo Bala sy Aseraha."],[8,"Dia nirehitra tamin’ ny Isiraely ny fahatezeran’ i Jehovah, ka nivarotra azy ho eo an-tànan’ i Kosan-risataima, mpanjakan’ i Mesopotamia, Izy; dia nanompo an’ i Kosan-risataima valo taona ny Zanak’ Isiraely."],[9,"Dia nitaraina tamin’ i Jehovah ny Zanak’ Isiraely, ary Jehovah nanangana mpamonjy ho an’ ny Zanak’ Isiraely, izay namonjy azy, dia Otniela, zanakalahin’ i Kenaza, zandrin’ i Kaleba."],[10,"Ary ny Fanahin’ i Jehovah no tao aminy, dia nitsara ny Isiraely izy sady nivoaka hiady; ary Kosan-risataima, mpanjakan’ i Mesopotamia, dia natolotr’ i Jehovah teo an-tànany; ary nahery ny tànany ka namely an’ i Kosan-risataima."]]},"3":{"t":"Matio 15, 21-28","u":"https://baiboly.org/?book=matthew&chapter=15&tr=mg1865","v":[[21,"Dia niala teo Jesosy ka nankany amin’ ny fari-tanin’ i Tyro sy Sidona."],[22,"Ary, indro, nisy vehivavy Kananita anankiray nivoaka avy tamin’ izany tany izany ka niantso nanao hoe: Mamindrà fo amiko, Tompoko, Zanak’ i Davida ô! ny zanako-vavy ampahorin’ ny demonia loatra."],[23,"Fa Izy tsy namaly teny azy. Dia nanatona ny mpianany ka nangataka taminy nanao hoe: Roahy izy, fa miantso mafy ato aoriantsika."],[24,"Ary Izy namaly ka nanao hoe: Tsy nirahina Aho afa-tsy ho amin’ ny ondry very amin’ ny taranak’ isiraely."],[25,"Fa nanatona ihany ravehivavy, dia niankohoka teo anatrehany ka nanao hoe: Tompoko ô, vonjeo aho."],[26,"Fa Izy namaly ka nanao hoe: Tsy mety raha maka ny mofon-jaza ka manipy azy ho an’ ny amboakely."],[27,"Fa hoy ravehivavy: Marina izany, Tompoko; fa na dia ny amboakely aza mba mihinana izay sombintsombiny latsaka avy amin’ ny latabatry ny tompony ihany."],[28,"Dia namaly Jesosy ka nanao taminy hoe: Ravehivavy, lehibe ny finoanao; tongava aminao araka izay irinao. Dia sitrana ny zananivavy tamin’ izay ora izay."]]},"4":{"t":"2 Petera 2, 4-16","u":"https://baiboly.org/?book=2-peter&chapter=2&tr=mg1865","v":[[4,"Fa raha tsy navelan’ Andriamanitra ny anjely fony nanota, fa noroahiny ho any amin’ ny helo ka natolony ho ao an-davaka maizina mba hotehirizina ho amin’ ny fitsarana,"],[5,"ary raha tsy namela izao rehetra izao taloha Izy, fa namonjy an’ i Noa, mpitory ny fahamarinana, sy ireo fito, fony nahatonga ny safo-drano tamin’ ny ratsy fanahy teo amin’ izao tontolo izao,―"],[6,"ary raha nataony nanjary lavenona ny tanàna Sodoma sy Gomora ka nohelohiny horavana ary nataony fananarana ho an’ izay ratsy fanahy ato aoriana,―"],[7,"fa Lota marina, izay ory dia ory noho ny fijejojejoan’ ny olona ratsy fanahy, no novonjeny ho afaka"],[8,"(fa izany lehilahy marina izany, raha nitoetra teo aminy, dia nahory loatra ny fanahiny marina isan’ andro isan’ andro noho ny nahitany sy ny nandrenesany ny fandikan’ ireo ny lalàna):"],[9,"dia fantatry ny Tompo izay hamonjeny ny tsara fanahy amin’ ny fakam-panahy sy ny hitehirizany ny olona tsy marina amin’ ny fijaliana ho amin’ ny andro fitsarana,―"],[10,"indrindra fa izay mandeha araka ny fitarihan’ ny nofo hila zava-mahaloto ka manamavo ny manana fahalehibiazana. Ireo efa olona sahisahy, mitompo teny fantatra sady tsy matahotra hiteny ratsy ny manana voninahitra."],[11,"Fa ny anjely aza, izay mihoatra amin’ ny tanjaka sy ny hery, tsy mitondra fiampangana hitenenan-dratsy azy eo anatrehan’ ny Tompo."],[12,"Fa ireo kosa izay miteny ratsy ny zavatra tsy fantany (tahaka ny biby tsy manan-tsaina, fa zava-manan’ aina fotsiny ihany, izay teraka ho fisambotra sy ho famono) dia haringana tokoa amin’ ny fahalotoany,"],[13,"ary hiharan’ ny ratsy ho valin’ ny faharatsiany izy. Ataony ho zava-mahafinaritra ny velona vetivety amin’ ny fy, ka be pentimpentina sy tsiny izy sady velona amin’ ny fy eo amin’ ny fanasam-pifankatiavany, raha miara-mihinana aminareo."],[14,"manana maso feno fijangajangana, izay tsy mety mitsahatra amin’ ny fahotana: dia mamitaka ny tsy miorina tsara izy; ary mampaharatra ny fony amin’ ny hafatratry ny fitiavany harena, dia zanaky ny fanozonana izy;"],[15,"efa niala tamin’ ny lalana mahitsy izy ka nivily nanaraka ny lalan’ i Balama, zanak’ i Beora, izay tia ny tambin’ ny tsi-fahamarinana."],[16,"nefa voanatra izy noho ny fahotany: ny boriky moana efa nanao feon’ olona ka nisakana ny hadalan’ ilay mpaminany."]]}}},{"d":"2027-03-21","g":["JAONA","ROTA"],"a":{"JAONA":["Mme Tiana","Mr Naina","Mme Sidonie","Mme Saholy","Mme Mama Li","Mme Yoily"],"ROTA":["Mme Mavo","Mme Lalao","Mme Vola","Mme Lucie","Mme Julie","Mr Parany"]},"l":{"2":{"t":"Zefania 3, 14-20","u":"https://baiboly.org/?book=zephaniah&chapter=3&tr=mg1865","v":[[14,"Mihobia, ry Ziona zanakavavy; Manaova feo fifaliana, ry Isiraely; Mifalia sy miravoravoa amin’ ny fonao rehetra, ry Jerosalema zanakavavy."],[15,"Jehovah efa nampitsahatra ny fitsarana anao ka nandroaka ny fahavalonao; Jehovah, Mpanjakan’ ny Isiraely, no ao aminao; Tsy hahita loza intsony ianao."],[16,"Amin’ izany andro izany dia holazaina amin’ i Jerosalema hoe: Aza matahotra Ary aza miraviravy tanana, ry Ziona."],[17,"Jehovah Andriamanitrao no ao aminao, Mahery Izy ka hamonjy; Hiravoravo anao amin’ ny fifaliana Izy; Ho sondriana amin’ ny fitiavany Izy; Hifaly anao amin’ ny fihobiana Izy."],[18,"Hangoniko izay manina ny fotoam-pivavahana; Avy aminao ihany ireny, Ary itambesaran’ ny latsa izy."],[19,"Indro, hasiako amin’ Izany andro izany izay rehetra nampahory anao; Hovonjeko ny mandringa, ary hovoriko ny noroahina, Eny, hataoko ho fiderana sy ho anarana ireny izay efa nitondra henatra tany amin’ ny tany rehetra."],[20,"Amin’ izany andro izany no hitondrako anareo miditra, Eny, amin’ izany andro izany no hanangonako anareo; Fa hataoko ho anarana sy ho fiderana any amin’ ny firenena rehetra amin’ ny tany ianareo, Raha hampodiko avy amin’ ny fahababoana ianareo, ka ho hitan’ ny masonareo izany, hoy Jehovah."]]},"3":{"t":"Marka 11, 1-11","u":"https://baiboly.org/?book=mark&chapter=11&tr=mg1865","v":[[1,"Ary raha nanakaiky any Jerosalema tao Betifaga sy Betania any an-tendrombohitra Oliva izy, dia naniraka roa lahy tamin’ ny mpianany Jesosy"],[2,"ka nanao taminy hoe: Mankanesa amin’ iroa vohitra tandrifinareo iroa; ary raha vao miditra eo ianareo, miaraka amin’ izay dia hahita zana-boriky mifatotra, izay tsy mbola nitaingenan’ olona; vahao izy, ka ento etỳ."],[3,"Ary raha misy olona manao aminareo hoe: Ahoana no anaovanareo izao? dia lazao hoe: Misy raharaha analan’ ny Tompo azy; dia havelany ho entina etỳ indray miaraka amin’ izay izy."],[4,"Dia nandeha izy ka nahita zana-boriky nifatotra teo ala-trano anilan’ ny varavarana teo an-dalana, dia novahany izy."],[5,"Ary ny olona sasany teo nanao taminy hoe: Ahoana no amahanareo ny zana-boriky?"],[6,"Ary izy nilaza taminy araka izay nolazain’ i Jesosy taminy, dia navelan’ ny olona handeha izy."],[7,"Ary nentiny teo amin’ i Jesosy ny zana-boriky, dia nataony teo amboniny ny lambany; ary Jesosy nitaingina azy."],[8,"Ary maro no namelatra ny lambany teny an-dalana; ary ny sasany kosa nampihahaka rantsan-kazo izay efa nalainy tany an-tsaha."],[9,"Ary izay nandeha teo alohany sy izay nanaraka teo aoriany dia samy niantso hoe: Hosana! Isaorana anie Izay avy amin’ ny anaran’ i Jehovah!"],[10,"Hotahina anie ny fanjakana izay avy, dia ny an’ i Davida raintsika! Hosana any amin’ ny avo indrindra."],[11,"Ary Jesosy niditra tany Jerosalema ka nankeo an-kianjan’ ny tempoly; ary rehefa nijerijery ny zavatra rehetra Izy, sady efa hariva ny andro tamin’ izay, dia niala Izy mbamin’ ny roa ambin’ ny folo lahy ka nankany Betania."]]},"4":{"t":"Apokalypsy 11, 15-19","u":"https://baiboly.org/?book=revelation&chapter=11&tr=mg1865","v":[[15,"Ary ny anjely fahafito nitsoka, dia nisy feo mafy tany an-danitra nanao hoe: Ny fanjakana amin’ izao tontolo izao dia efa lasan’ ny ny Tompontsika sy ny Kristiny; ary Izy no hanjaka mandrakizay mandrakizay."],[16,"Ary ny loholona fatra amby roa-polo, izay mipetraka eo ambonin’ ny seza fiandrianany eo anatrehan’ Andriamanitra, dia niankohoka ka nivavaka tamin’ Andriamanitra"],[17,"nanao hoe: Misaotra Anao izahay, Tompo Ô, Andriamanitra Tsitoha, Ilay ankehitriny sy taloha, Satria nasehonao ny herinao lehibe, ka efa manjaka Hianao."],[18,"Ary tezitra ny firenena maro, ary tonga ny fahatezeranao Sy ny fotoana hitsarana ny maty, sy hanomezana valim-pitia ny mpaminany mpanomponao sy ny olona masìna ary izay matahotra ny anaranao, na kely na lehibe, ary mba hanimbanao izay manimba ny tany."],[19,"Ary novohana ny tempolin’ Andriamanitra any an-danitra, ka hita ny fiaran’ ny fanekeny teo anatin’ ny tempoliny; ary nisy helatra sy feo sy kotrokorana sy horohorontany ary havandra vaventy."]]}}},{"d":"2027-03-28","g":["KEFASY"],"a":{"KEFASY":["Mr Yves","Mr Njaka","Mr Ando","Mr Joelson","Mme Sylvia","Mr Richard"]},"l":{"2":{"t":"Hosea 13, 14-15","u":"https://baiboly.org/?book=hosea&chapter=13&tr=mg1865","v":[[14,"Havotako tsy ho azon’ ny herin’ ny fiainan-tsi-hita izy; Hovonjeko ho afaka amin’ ny fahafatesana Izy; Ry fahafatesana ô, aiza ny aretina fandripahanao? Ry fiainan-tsi-hita ô, aiza ny fandringananao? Afenina tsy ho hitan’ ny masoko ny nenina."],[15,"Fa Efraima dia hahavokatra eo amin’ ny rahalahy; Nefa ho avy ny rivotra avy any atsinanana, dia ny rivotr’ i Jehovah miakatra avy any an-efitra, ka dia ho ritra ny loharanony, ary ho tankina ny fantsakany; Hobaboina ny rakitra, dia ny fanaka tsara rehetra."]]},"3":{"t":"Marka 16, 1-8","u":"https://baiboly.org/?book=mark&chapter=16&tr=mg1865","v":[[1,"Ary rehefa afaka ny andro Sabata, dia lasa nividy zava-manitra Maria Magdalena sy Salome ary Maria, renin’ i Jakoba, mba handeha hanosotra ny fatin’ i Jesosy."],[2,"Ary nony maraina koa tamin’ ny voalohan’ andro amin’ ny herinandro, rehefa niposaka ny masoandro, dia nankany amin’ ny fasana izy ireo."],[3,"Ary niresaka hoe izy: Iza re no hanakodia ny vato ho afaka amin’ ny varavaram-pasana hisolo antsika?"],[4,"Fa nony nitraka izy, dia, indro, hitany fa efa voakodia niala ny vato; fa lehibe dia lehibe ny vato."],[5,"Ary raha niditra tao anatin’ ny fasana izy, dia nahita zatovo anankiray nipetraka teo amin’ ny ankavanana niakanjo akanjo fotsy, dia talanjona izy."],[6,"Fa hoy ilay zatovo taminy: Aza talanjona; mitady an’ i Jesosy avy any Nazareta, Izay nohomboana tamin’ ny hazo fijaliana, ianareo; efa nitsangana Izy; tsy ato Izy; jereo fa teo no nametrahany Azy."],[7,"Fa mandehana, lazao amin’ ny mpianany sy Petera fa mialoha anareo ho any Galilia Izy; any no hahitanareo Azy, araka izay nolazainy taminareo."],[8,"Dia nivoaka izy ka lasa nandositra niala tamin’ ny fasana, fa tora-kovitra sady talanjona izy; ary tsy mba nilaza na inona na inona tamin’ olona izy, satria natahotra."]]},"4":{"t":"Apokalypsy 1, 17-20","u":"https://baiboly.org/?book=revelation&chapter=1&tr=mg1865","v":[[17,"Ary raha nahita Azy aho, dia lavo niankohoka tahaka ny maty teo anoloan’ ny tongony. Fa Izy nanendry ahy tamin’ ny tànany ankavanana ka nanao hoe: Aza matahotra; Izaho no Voalohany sy Farany,"],[18,"dia Ilay velona; efa maty Aho, nefa, indro, velona mandrakizay mandrakizay sady manana ny fanalahidin’ ny fahafatesana sy ny fiainan-tsi-hita."],[19,"Koa soraty izay zavatra efa hitanao, na izay zavatra ankehitriny, na izay zavatra mbola ho avy rahatrizay,"],[20,"dia ny zava-miafina ny amin’ ny kintana fito izay efa hitanao teny an-tanako ankavanana sy ny fanaovan-jiro volamena fito. Ny kintana fito dia ny anjelin’ ny fiangonana fito: ary ny fanaovan-jiro fito dia fiangonana fito."]]}}},{"d":"2027-04-04","g":["ISAIA","ESTERA"],"a":{"ISAIA":["Mme Germaine","Mme Hanta","Mr Tafita","Mme Rahely","Mme Onja","Mr Haja"],"ESTERA":["Mme Tsiry","Mme Lanto","Mr Patrick","Mme Georgina","Mme Tatamo","Mr Rochel"]},"l":{"2":{"t":"Eksodosy 12, 29-36","u":"https://baiboly.org/?book=exodus&chapter=12&tr=mg1865","v":[[29,"Ary nony namatonalina Jehovah namono ny lahimatoa rehetra tany amin’ ny tany Egypta, hatramin’ ny lahimatoan’ i Farao izay nipetraka teo ambonin’ ny seza fiandrianany ka hatramin’ ny lahimatoan’ ny babo izay tao amin’ ny trano-maizina, mbamin’ izay voalohan-teraky ny biby fiompy rehetra."],[30,"Ary nifoha raha mbola alina Farao, dia izy sy ny mpanompony rehetra ary ny Egyptiana rehetra, fa nisy fidradradradrana mafy tany Egypta, satria tsy nisy trano izay tsy nahafatesana."],[31,"Dia nampaka an’ i Mosesy sy Arona izy, raha mbola alina, ka nanao hoe: Mitsangàna, mialà eto amin’ ny vahoakako ianareo sy ny Zanak’ Isiraely, ary mandehana ka manompoa an’ i Jehovah araka ny nolazainareo."],[32,"Ary ny ondry aman’ osinareo sy ny ombinareo dia ento koa araka izay efa nolazainareo, ka mandehana; fa mba tsofy rano aho."],[33,"Dia nandodona ny olona ny Egyptiana ka nampandeha azy faingana hiala tamin’ ny tany, satria hoy izy: Maty avokoa izahay rehetra."],[34,"Dia nentin’ ny olona ny kobany voalena, raha tsy mbola voaisy masirasira, sy ny viliany fanaova-mofo voafehy ao amin’ ny lambany teny an-tsorony."],[35,"Ary ny Zanak’ Isiraely nanao araka ny tenin’ i Mosesy ka nangataka firavaka volafotsy sy firavaka volamena ary fitafiana tamin’ ny Egyptiana."],[36,"Ary nataon’ i Jehovah nahita fitia teo imason’ ny Egyptiana ny olona, ka nomen’ ireo azy izay nangatahiny, ka dia nofoanany ny Egyptiana."]]},"3":{"t":"Lioka 9, 21-27","u":"https://baiboly.org/?book=luke&chapter=9&tr=mg1865","v":[[21,"Ary Izy niteny mafy azy sady nandrara azy mba tsy hilazalaza izany amin’ olona"],[22,"ka nanao hoe: Ny Zanak’ olona tsy maintsy hijaly mafy ka holavin’ ny loholona sy ny lohan’ ny mpisorona mbamin’ ny mpanora-dalàna sady hovonoiny; ary amin’ ny andro fahatelo dia hatsangana."],[23,"Ary hoy koa Jesosy tamin’ izy rehetra: Raha misy ta-hanaraka Ahy, aoka izy handà ny tenany, dia hitondra ny hazo fijaliany isan’ andro ka hanaraka Ahy."],[24,"Fa na iza na iza no ta-hamonjy ny ainy dia hahavery izany; ary na iza na iza no hahavery ny ainy noho ny amiko, dia izy no hamonjy izany."],[25,"Fa inona no soa azon’ ny olona, raha mahazo izao tontolo izao aza, kanefa very ny ainy, na matiantoka, izany izy?"],[26,"Fa na iza na iza no ho menatra Ahy sy ny teniko, dia ho menatra azy kosa ny Zanak’ olona, raha avy amin’ ny voninahiny sy ny an’ ny Rainy ary ny an’ ny anjely masìna."],[27,"Fa lazaiko aminareo tokoa: Misy ny sasany eto izay tsy mba hanandrana fahafatesana mandra-pahitany ny fanjakan’ Andriamanitra."]]},"4":{"t":"2 Korintiana 6, 11-18","u":"https://baiboly.org/?book=2-corinthians&chapter=6&tr=mg1865","v":[[11,"Ry Korintiana, ny vavanay misokatra aminareo, ny fonay malalaka."],[12,"Tsy terỳ aminay ianareo, fa terỳ ao am-ponareo ihany."],[13,"Ary mba ho valiny toraka izany (izaho miteny toy ny amin’ ny zanako), dia mba mihalalaha kosa ianareo."],[14,"Aza mety hasiana zioga tsy antonona anareo hikambanana amin’ ny tsy mino. Fa inona no iraisan’ ny fahamarinana sy ny fahotana? Ary inona no iombonana’ ny mazava sy ny maizina?"],[15,"Ary inona no ifanarahan’ i Kristy sy Beliala? Ary inona no iraisan’ ny anjaran’ ny mino sy ny tsy mino?"],[16,"Ary inona no ikambanan’ ny tempolin’ Andriamanitra amin’ ny sampy? Fa isika no tempolin’ Andriamanitra velona, araka ny nataon’ Andriamanitra hoe: Honina eo aminy sy handeha eo aminy Aho, ary izy ho oloko."],[17,"Koa mivoaha eo aminy ianareo, ka misaraha aminy, hoy Jehovah, Ary aza manendry izay zavatra tsy madio; Ary Izaho handray anareo."],[18,"Ary ho Rainareo Aho, ary ianareo ho zanako-lahy sy ho zanako-vavy, hoy Jehovah Tsitoha."]]}}},{"d":"2027-04-11","g":["JAONA","ROTA"],"a":{"JAONA":["Mme Voahirana","Mme Vero","Mr Adolph","Mr Tovo","Dr Hasina","Mr Lalaina"],"ROTA":["Mr Sen","Mr Rivo","Mr Jean Claude","Mr Herimanitra","Mme Patricia","Mme Tsiory"]},"l":{"2":{"t":"Mpitsara 5, 24-27","u":"https://baiboly.org/?book=judges&chapter=5&tr=mg1865","v":[[24,"Hotahina mihoatra noho ny vehivavy anie Jaela, vadin’ i Hebera Kenita; Eny, hotahina mihoatra noho ny vehivavy mitoetra an-day anie izy."],[25,"Rano no nangatahin-dralehilahy, fa ronono aza no nomeny azy; Teo an-dovian’ andriana no nitondrany rononomandry."],[26,"Ny tànany nandray ny tsima-day, Ary ny tànany ankavanana nandray ny tantanan’ ny mpiasa, dia namely an’ i Sisera tamin’ ny tantanana izy ka nahavoa ny lohany; Namely mafy izy, dia nahaboroaka ny fihirifany."],[27,"Teo amin’ ny tongo-dravehivavy no niondrehany nahalavoany niamparany, eny, teo amin’ ny tongony no niondrehany nahalavoany teo amin’ izay niondrehany no niamparan’ ny fatiny."]]},"3":{"t":"Lioka 7, 36-50","u":"https://baiboly.org/?book=luke&chapter=7&tr=mg1865","v":[[36,"Ary ny Fariseo anankiray nanasa an’ i Jesosy hiara-mihinana aminy; ary dia niditra tao an-tranon’ ilay Fariseo Izy ka nipetraka nihinana."],[37,"Ary, indro, nisy vehivavy mpanota tao an-tanàna, ka rehefa fantany fa Jesosy nipetraka nihinana tao an-tranon’ ilay Fariseo, dia nitondra tavoara alabastara feno menaka manitra izy;"],[38,"ary nijanona teo ivohony tanilan’ ny tongony izy ka nitomany, dia nahakotsa ny tongony tamin’ ny ranomasony sy namaoka azy tamin’ ny volon-dohany, dia nanoroka fatratra ny tongony ka nanosotra azy tamin’ ny menaka manitra,"],[39,"Ary nony nahita izany ilay Fariseo nanasa Azy, dia nanao anakampo hoe: Raha mpaminany Ity, dia ho nahalala io vehivavy manendry Azy io sy ny toeny; fa mpanota io."],[40,"Ary Jesosy namaly ka nanao taminy hoe: Ry Simona, manan-kolazaina aminao Aho. Dia hoy izy: Lazao ary, Mpampianatra ô."],[41,"Nisy roa lahy nananan’ ny mpampanàna vola anankiray trosa: ny iray nananany denaria diman-jato, ary ny iray kosa dimam-polo."],[42,"Ary raha tsy nanan-kaloa izy roa lahy, dia samy navelany. Koa iza moa amin’ ireo no ho tia azy indrindra?"],[43,"Simona namaly ka nanao hoe: Ataoko fa ilay namoizany be. Dia hoy Izy taminy: Marina ny hevitrao."],[44,"Ary Jesosy nitodika nijery an-dravehivavy ka nanao tamin’ i Simona hoe: Hitanao va io vehivavy io? Niditra teto an-tranonao Aho; nefa tsy mba nanome Ahy rano hanasana ny tongotro ianao; fa izy kosa nahakotsa ny tongotro tamin’ ny ranomasony, dia namaoka azy tamin’ ny volon-dohany."],[45,"Tsy mba nanoroka Ahy akory ianao; fa izy, hatr’ izay nidirako, dia tsy mbola nitsahatra nanoroka fatratra ny tongotro."],[46,"Ny lohako tsy mba nohosoranao diloilo akory; fa izy kosa nanoso-menaka manitra ny tongotro."],[47,"Ary amin’ izany dia lazaiko aminao: Voavela ny helony be, fa be fitiavana izy; fa izay voavela tamin’ ny kely dia kely fitiavana."],[48,"Dia hoy Izy tamin-dravehivavy: Voavela ny helokao."],[49,"Ary izay niara-nipetraka nihinana teo aminy dia niresaka hoe: Iza moa Ity no mba mamela heloka?"],[50,"Ary hoy Izy tamin-dravehivavy: Ny finoanao efa namonjy anao; mandehana soa aman-tsara."]]},"4":{"t":"1 Petera 3, 1-7","u":"https://baiboly.org/?book=1-peter&chapter=3&tr=mg1865","v":[[1,"Ary toy izany koa, ianareo vehivavy, maneke ny vadinareo, mba ho voataonan’ ny fitondran-tenan’ ny vavy izy, na dia tsy amin’ ny teny aza (raha tàhiny misy tsy manaiky ny teny),"],[2,"rehefa hitany ny fahadiovan’ ny fitondran-tenanareo amin’ ny fahatahorana."],[3,"Ary aoka ny firavahanareo tsy ho zavatra eny ivelany, toy ny firandranam-bolo sy ny firava-bolamena na ny fiakanjoana;"],[4,"fa aoka ho toetra miafina ao am-po, izay tsy mety ho lò, dia ny fanahy malemy sady miadana, izay soa indrindra eo imason’ Andriamanitra."],[5,"Fa tahaka izany no niravahan’ ny vehivavy masìna fahiny, izay nanantena an’ Andriamanitra sady nanaiky ny vadiny;"],[6,"dia tahaka an’ i Saraha, izay nanaiky an’ i Abrahama ka nanao azy hoe “tompoko”; dia zanany ianareo, raha mba manao soa ka tsy matahotra izay fampitahorana na inona na inona."],[7,"Ary toy izany koa, ianareo lehilahy, miaraha mitoetra aminy araka ny marina, manaja ny vavy, tahaka ny mety hatao amin’ ny fanaka malemilemy kokoa sady mpiara-mandova ny fahasoavan’ ny fiainana,― mba tsy ho voasakana ny fivavahanareo."]]}}},{"d":"2027-04-18","g":["KEFASY","ISAIA"],"a":{"KEFASY":["Mme Vony","Mme Sitraka","Mme Felana","Mme Odette","Mme Alphonsine","Mme Lea"],"ISAIA":["Mme Albertine","Mme Tiana","Mme Hanta","Mme Holy","Mme Rahely","Mme Germaine"]},"l":{"2":{"t":"Deoteronomia 3, 1-7","u":"https://baiboly.org/?book=deuteronomy&chapter=3&tr=mg1865","v":[[1,"Dia niverina isika ka niakatra tamin’ ny lalana mankany Basana; ary nivoaka hiady amintsika tao Edrehy Oga, mpanjakan’ i Basana, mbamin’ ny vahoakany rehetra."],[2,"Ary hoy Jehovah tamiko: Aza matahotra azy ianao; fa efa natolotro eo an-tananao izy mbamin’ ny vahoakany rehetra sy ny taniny, ary ianao hanao aminy araka izay nataonao tamin’ i Sihona, mpanjakan’ ny Amorita, izay nonina tao Hesbona."],[3,"Dia natolotr’ i Jehovah Andriamanitsika teo an-tanantsika koa Oga, mpanjakan’ i Basana, sy ny vahoakany rehetra; dia nandresy azy isika mandra-paha-tsi-hisy niangana na dia iray akory aza."],[4,"Dia afatsika ny tanànany rehetra tamin’ izany andro izany, tsy nisy tanàna izay tsy nalaintsika taminy, dia tanàna enim-polo, dia ny tany Argoba rehetra, izay fanjakan’ i Oga tany Basana."],[5,"Ireo tanàna rehetra ireo dia samy nasiana manda avo sy vavahady ary hidy hahamafy azy, afa-tsy ny vohitra madinika maro dia maro."],[6,"Dia naringantsika ireny tahaka izay efa nataontsika tamin’ i Sihona, mpanjakan’ i Hesbona; naringana ny mponina rehetra tamin’ ny isan-tanàna mbamin’ ny zaza amim-behivavy."],[7,"Fa ny biby fiompy rehetra sy ny fananana tamin’ ireo tanàna ireo dia nataontsika babo ho antsika."]]},"3":{"t":"Lioka 18, 35-43","u":"https://baiboly.org/?book=luke&chapter=18&tr=mg1865","v":[[35,"Ary raha Jesosy nanakaiky an’ i Jeriko, dia indro jamba anankiray nipetraka nangataka teo amoron-dalana."],[36,"Ary raha nandre ny vahoaka mandalo izy, dia nanontany hoe: Inona izany?"],[37,"Ary hoy ny olona taminy: Jesosy avy any Nazareta no mandalo."],[38,"Dia niantso mafy ralehilahy ka nanao hoe: Ry Jesosy, Zanak’ i Davida ô, mamindrà fo amiko."],[39,"Ary izay nandeha teny aloha dia niteny mafy azy mba hangina, fa vao mainka niantsoantso izy ka nanao hoe: Ry Zanak’ i Davida ô, mamindrà fo amiko."],[40,"Ary Jesosy nijanona, dia nasainy ho entina eo aminy ralehilahy; ary rehefa mby akaiky izy, dia nanontany azy Jesosy"],[41,"ka nanao hoe: Inona moa no tianao hataoko aminao? Ary hoy izy: Tompoko, ny mba hampahiratina ny masoko."],[42,"Dia hoy Jesosy taminy: Mahirata ny masonao; ny finoanao no efa nahavonjy anao."],[43,"Ary niaraka tamin’ izay dia nahiratra ny masony, ka nanaraka an’ i Jesosy izy sady nankalaza an’ Andriamanitra; ary ny vahoaka rehetra, raha nahita, dia nidera an’ Andriamanitra."]]},"4":{"t":"Apokalypsy 12, 7-12","u":"https://baiboly.org/?book=revelation&chapter=12&tr=mg1865","v":[[7,"Ary nisy ady tany an-danitra: Mikaela sy ny anjeliny niady tamin’ ilay dragona; ary ilay dragona mbamin’ ny anjeliny kosa dia niady,"],[8,"nefa tsy naharesy, sady tsy nisy fitoerana ho azy intsony tany an-danitra."],[9,"Ary nazera ilay dragona, dia ilay menarana ela, izay atao hoe devoly sy Satana, izay mamitaka izao tontolo izao; dia nazera tamin’ ny tany izy, ary ny anjeliny koa niaraka nazera taminy."],[10,"Dia nahare feo mahery tany an-danitra aho nanao hoe: Ankehitriny dia tonga ny famonjena sy ny hery sy ny fanjakan’ Andriamanitsika, Ary ny fahefan’ ny Kristiny, Satria nazera ilay mpiampanga ny rahalahintsika, dia ilay miampanga azy eo anatrehan’ Andriamanitsika andro aman’ alina."],[11,"Ary izy ireo naharesy azy noho ny amin’ ny ran’ ny Zanak’ ondry Sy ny teny filazana Azy, Ary tsy nankamamy ny ainy intsony iry, na dia ho faty aza."],[12,"Ary noho izany mifalia, ry lanitra sy ianareo izay monina ao aminy. Loza ho an’ ny tany sy ny ranomasina! Fa nidina ho aminareo ny devoly sady manana fahatezerana lehibe, Satria fantany fa kely sisa ny androny."]]}}},{"d":"2027-04-25","g":["ESTERA"],"a":{"ESTERA":["Mme Voahirana","Mr Hery","Mme Tsiry","Mme Lanto","Mr Patrick","Mme Georgina"]},"l":{"2":{"t":"Salamo 146, 1-10","u":"https://baiboly.org/?book=psalms&chapter=146&tr=mg1865","v":[[1,"Haleloia. Miderà an’ i Jehovah, ry fanahiko."],[2,"Hidera an’ i Jehovah aho, raha mbola miaina koa; Eny, hankalaza an’ Andriamanitra aho, raha mbola velona koa."],[3,"Aza matoky ny lehibe, Na ny zanak’ olombelona izay tsy mahavonjy."],[4,"Miala ny fofonainy, ka miverina ho amin’ ny taniny izy; Ary amin’ izay indrindra no hahafoanan’ ny fikasany."],[5,"Sambatra izay manana an’ Andriamanitr’ i Jakoba ho Mpanampy azy Sady manantena an’ i Jehovah Andriamaniny,"],[6,"Izay nanao ny lanitra sy ny tany, Ny ranomasina sy izay rehetra ao anatiny, Izay mitandrina fahamarinana mandrakizay,"],[7,"Izay manome rariny ho an’ ny ampahoriana, Izay manome hanina ho an’ ny noana. Jehovah mamaha ny mpifatotra;"],[8,"Jehovah mampahiratra ny jamba Jehovah mampitraka ny mitanondrika; Jehovah tia ny marina;"],[9,"Jehovah miaro ny vahiny Ary manandratra ny kamboty sy ny mpitondratena, Fa mamadika ny lalan’ ny ratsy fanahy kosa."],[10,"Manjaka mandrakizay Jehovah, Hatramin’ ny taranaka fara mandimby Andriamanitrao, ry Ziona. Haleloia."]]},"3":{"t":"Jaona 7, 37-44","u":"https://baiboly.org/?book=john&chapter=7&tr=mg1865","v":[[37,"Ary tamin’ ny andro farany, izay andro lehibe tamin’ ny andro firavoravoana, dia nitsangana Jesosy ka niantso nanao hoe: Raha misy olona mangetaheta, aoka izy hanatona Ahy ka hisotro."],[38,"Izay mino Ahy, dia hisy onin’ ny rano velona miboiboika avy ao an-kibony, araka ny voalazan’ ny Soratra Masìna."],[39,"Ary ny Fanahy, Izay efa horaisin’ ny mino Azy, no nolazainy tamin’ izany; fa ny Fanahy tsy mbola nomena, satria Jesosy tsy mbola niditra tamin’ ny voninahiny."],[40,"Ary ny sasany tamin’ ny vahoaka, raha nandre izany teny izany, dia nanao hoe: Ity tokoa no Ilay Mpaminany."],[41,"Hoy ny sasany: Ity no Kristy. Fa hoy kosa ny sasany: Avy any Galilia va no ihavian’ i Kristy?"],[42,"Tsy voalazan’ ny Soratra Masìna va fa Kristy dia avy amin’ ny taranak’ i Davida, sady avy ao Betlehema, vohitra nonenan’ i Davida?"],[43,"Dia nisara-tsaina ny amin’ i Jesosy ny vahoaka."],[44,"Ary ny sasany nitady hisambotra Azy; kanefa tsy nisy naninji-tanana taminy."]]},"4":{"t":"Hebreo 1, 1-4","u":"https://baiboly.org/?book=hebrews&chapter=1&tr=mg1865","v":[[1,"Rehefa nampitenenin’ Andriamanitra tamin’ ny razana fahiny ny mpaminany tamin’ ny andro samy hafa sy ny fanao samy hafa;"],[2,"dia amin’ izao andro farany izao kosa no nampitenenany tamintsika ny Zanany, Izay voatendriny ho Mpandova ny zavatra rehetra; Izy no nahariany izao tontolo izao,"],[3,"Izy koa no famirapiratan’ ny voninahiny sy endriky ny tenany indrindra ary mihazona ny zavatra rehetra amin’ ny herin’ ny teniny; ary rehefa nanao fanadiovana hahafaka ny fahotana Izy, dia nipetraka teo amin’ ny tanana ankavanan’ ny Lehibe any amin’ ny avo"],[4,"ka natao tsara noho ny anjely, araka ny nandovany anarana tsara noho ireny."]]}}},{"d":"2027-05-02","g":["JAONA","ROTA"],"a":{"JAONA":["Mme Yoily","Mme Mama Li","Mr Naina","Mme Tiana","Mme Saholy","Mme Sidonie"],"ROTA":["Mme Onja","Mme Lucie","Mme Lalao","Mme Mavo","Mme Vola","Mme Julie"]},"l":{"2":{"t":"Ezekiela 37, 10-14","u":"https://baiboly.org/?book=ezekiel&chapter=37&tr=mg1865","v":[[10,"Dia naminany araka izay efa nandidiany ahy aho, ka dia nidiran’ ny fofonaina ireo ka velona, dia nijoro tamin’ ny tongony izy maro be dia maro be tokoa."],[11,"Dia hoy Izy tamiko: Ry zanak’ olona, ireto taolana ireto dia ny taranak’ Isiraely rehetra; indreo izy manao hoe: Maina ny taolanay, levona ny fanantenanay, fongotra izahay."],[12,"Koa maminania, ka ataovy aminy hoe: Izao no lazain’ i Jehovah Tompo: Indro, ry oloko, Izaho no hanokatra ny fasanareo, ary hampiakariko avy amin’ ny fasanareo ianareo, ka ho entiko ho any amin’ ny tanin’ ny Isiraely;"],[13,"ka dia ho fantatrareo fa Izaho no Jehovah, raha manokatra ny fasanareo Aho, ry oloko, ka mampiakatra anareo hiala amin’ ny fasanareo."],[14,"Ary hataoko ao anatinareo ny Fanahiko, dia ho velona ianareo, ary hamponeniko any amin’ ny taninareo ianareo; ka dia ho fantatrareo fa Izaho Jehovah no efa niteny sady nahatanteraka izany, hoy Jehovah."]]},"3":{"t":"Jaona 16, 16-24","u":"https://baiboly.org/?book=john&chapter=16&tr=mg1865","v":[[16,"Vetivety foana dia tsy hahita Ahy intsony ianareo; ary vetivety foana indray dia hahita Ahy ianareo."],[17,"Ary ny mpianany sasany niresaka hoe: Inona izany nolazainy tamintsika hoe: Vetivety foana dia tsy hahita Ahy ianareo; ary vetivety foana indray dia hahita Ahy ianareo, ary, satria mankany amin’ ny Ray Aho?"],[18,"Ary hoy koa ireo: Inona izany lazainy hoe vetivety foana izany? Tsy fantatsika izay lazainy."],[19,"Ary Jesosy nahalala fa ta-hanontany Azy ireo, dia hoy Izy taminy: Mifanontany va ianareo, satria hoy Izaho: Vetivety foana dia tsy hahita Ahy ianareo, ary vetivety foana indray dia hahita Ahy ianareo?"],[20,"Lazaiko aminareo marina dia marina tokoa: Hitomany sy hisaona ianareo, fa izao tontolo izao kosa hifaly; ary ianareo halahelo, nefa ny alahelonareo hody fifaliana."],[21,"Manam-pahoriana ny vehivavy raha miteraka, satria tonga ny fotoany; fa rehefa velon-jaza izy, dia tsy tsaroany intsony ilay fahoriany, noho ny fifaliany fa misy zaza nateraka ho ambonin’ ny tany."],[22,"Ary ianareo dia manana alahelo ankehitriny; fa hahita anareo indray Aho, dia ho faly ny fonareo, ary tsy misy olona manaisotra ny fifalianareo aminareo."],[23,"Ary amin’ izany andro izany dia tsy hanontany Ahy na inona na inona ianareo; lazaiko aminareo marina dia marina tokoa fa na inona na inona hangatahinareo amin’ ny Ray dia homeny anareo amin’ ny anarako izany."],[24,"Mandraka ankehitriny dia tsy mbola nangataka na inona na inona tamin’ ny anarako ianareo; mangataha, dia hahazo ianareo, mba ho tanteraka ny fifalianareo."]]},"4":{"t":"Asan'ny Apostoly 1, 1-5","u":"https://baiboly.org/?book=acts&chapter=1&tr=mg1865","v":[[1,"Ry Teofilo, ilay boky voalohany dia nosoratako ny amin’ izay nataon’ i Jesosy sy nampianariny,"],[2,"hatramin’ ny andro nampiakarana Azy, rehefa nodidiany tamin’ ny Fanahy Masìna ny Apostoly izay nofidiny,"],[3,"sady niseho koa tamin’ ny famantarana maro taorian’ ny nijaliany fa velona Izy, ka niseho taminy efa-polo andro Izy ary nilaza ny amin’ ny fanjakan’ Andriamanitra."],[4,"Ary raha niara-niangona teo aminy Jesosy, dia namepetra azy tsy hiala an’ i Jerosalema, fa hiandry ny teny fikasan’ ny Ray, izay efa renareo tamiko, hoy Izy;"],[5,"fa Jaona nanao batisa tamin’ ny rano; fa ianareo kosa hatao batisa amin’ ny Fanahy Masìna, rehefa afaka andro vitsivitsy."]]}}},{"d":"2027-05-09","g":["KEFASY","ISAIA"],"a":{"KEFASY":["Mr Richard","Mme Sylvia","Mr Njaka","Mr Yves","Mr Joelson","Mr Ando"],"ISAIA":["Mme Onja","Mme Holy","Mr Haja","Mme Albertine","Mr Tafita","Mme Tiana"]},"l":{"2":{"t":"1 Samoela 26, 13-25","u":"https://baiboly.org/?book=1-samuel&chapter=26&tr=mg1865","v":[[13,"Dia nita nankeny an-dafin-tsaha Davida ka nijanona teo an-tampon’ ny tendrombohitra lavidavitra (lavidavitra ihany ny elanelan’ izy roa tonta);"],[14,"ary Davida niantso ny olona sy Abnera, zanak’ i Nera, hoe: Tsy mamaly va ianao, ry Abnera? Ary Abnera dia namaly hoe: Iza moa ianao, no miantso ho re eto anatrehan’ ny mpanjaka?"],[15,"Ary hoy Davida tamin’ i Abnera: Tsy lehilahy mahery va ianao, ary iza no tahaka anao amin’ ny Isiraely? Koa nahoana ianao no tsy miambina ny mpanjaka tomponao? fa nisy anankiray tamin’ ny olona tonga teo hamono ny mpanjaka tomponao."],[16,"Tsy mety izany nataonao izany. Raha velona koa Jehovah, dia tokony ho faty ianareo, satria tsy miambina ny tomponareo, ilay voahosotr’ i Jehovah Ary izahao ange, fa aiza moa ny lefon’ ny mpanjaka sy ny tavoara fitondran-drano teo anilan’ ny lohany?"],[17,"Ary fantatr’ i Saoly ny feon’ i Davida ka hoy izy: Feonao moa izany, ry Davida zanako? Ary hoy Davida: Feoko tokoa, ry mpanjaka tompoko."],[18,"Ary hoy koa izy: Nahoana ny tompoko no manenjika ny mpanompony? Inona no nataoko, ary inona no ratsy amin’ ny tanako?"],[19,"Ary ankehitriny masìna ianao, ry mpanjaka tompoko, mihainoa ny tenin’ ny mpanomponao. Raha Jehovah no nanesika anao hamely ahy, dia aoka handray fanatitra mani-pofona Izy; fa raha zanak’ olona kosa, dia aoka ho voaozona eo anatrehan’ i Jehovah izy, satria efa nandroaka ahy androany tsy hanana anjara amin’ ny lova nomen’ i Jehovah izy ka nanao hoe: Mandehana, manompoa andriamani-kafa."],[20,"Koa aza avela ho latsaka amin’ ny tany lavitra an’ i Jehovah ny rako; fa ny mpanjakan’ ny Isiraely nivoaka nitady parasy iray, tahaka ny manenjika tsipoy eny an-tendrombohitra."],[21,"Ary hoy Saoly: Efa nanota aho: miverena, ry Davida zanako, fa tsy hanisy ratsy anao intsony aho, fa soa teo imasonao ny aiko androany; indro, efa nanao adala aho ka diso indrindra."],[22,"Ary Davida namaly hoe: Indro ny lefon’ ny mpanjaka! koa asaovy misy zatovo anankiray mankety haka azy."],[23,"Ny lehilahy izay nanoloran’ i Jehovah anao teo an-tànany androany dia hovaliany araka ny fahitsiany sy ny fahamarinany, fa tsy nety naninjitra ny tanako hamely ny voahosotr’ i Jehovah aho."],[24,"Ary, indro, fa tahaka ny nanaovako ny aina ho lehibe androany no mba hanaovan’ i Jehovah ny aiko ho lehibe kosa ka hanafahany ahy amin’ ny fahoriana rehetra."],[25,"Ary hoy Saoly tamin’ i Davida: Hotahina anie ianao, ry Davida zanako; hanao dia hanao ianao sady hahatontosa. Dia lasa Davida, fa Saoly kosa nitodi-doha hiverina."]]},"3":{"t":"Matio 10, 5-10","u":"https://baiboly.org/?book=matthew&chapter=10&tr=mg1865","v":[[5,"Ireo roa ambin’ ny folo lahy ireo dia nirahin’ i Jesosy ka nodidiany hoe: Aza mandeha any amin’ ny lalan’ ny jentilisa, ary aza miakatra amin’ izay tanànan’ ny Samaritana,"],[6,"fa aleo mankany amin’ ny ondry very amin’ ny taranak’ isiraely."],[7,"Ary raha mandeha ianareo, dia mitoria hoe: Efa mby akaiky ny fanjakan’ ny lanitra."],[8,"Sitrano ny marary, atsangano ny maty, diovy ny boka, avoahy ny demonia; efa nahazo maimaimpoana ianareo, koa manomeza maimaimpoana."],[9,"Aza mitady volamena, na volafotsy, na varahina, ho ao anatin’ ny fehin-kibonareo,"],[10,"na kitapom-batsy ho amin’ izay haleha, na akanjo roa, na kapa na tehina; fa ny mpiasa dia miendrika hahazo ny haniny."]]},"4":{"t":"Romana 8, 5-11","u":"https://baiboly.org/?book=romans&chapter=8&tr=mg1865","v":[[5,"Fa izay araka ny nofo dia mihevitra izay zavatry ny nofo; fa izay araka ny Fanahy kosa mihevitra izay zavatry ny Fanahy."],[6,"Fa ny fihevitry ny nofo dia fahafatesana; fa ny fihevitry ny Fanahy kosa fiainana, sy fiadanana"],[7,"satria fandrafiana an’ Andriamanitra ny fihevitry ny nofo; fa tsy manaiky ny lalàn’ Andriamanitra, sady tsy hainy akory izany."],[8,"Ary izay ao amin’ ny nofo dia tsy mahay manao ny sitrapon’ Andriamanitra."],[9,"Fa ianareo tsy ao amin’ ny nofo, fa ao amin’ ny Fanahy, raha ny Fanahin’ Andriamanitra no mitoetra ao anatinareo. Fa raha misy kosa tsy manana ny Fanahin’ i Kristy, dia tsy Azy izy."],[10,"Fa raha Kristy no mitoetra ao anatinareo, na dia maty ihany aza ny tena noho ny ota, dia fiainana kosa ny fanahy noho ny fanamarinana."],[11,"Ary raha ny Fanahin’ izay nanangana an’ i Jesosy tamin’ ny maty no mitoetra ao anatinareo, dia Izay nanangana an’ i Kristy Jesosy tamin’ ny maty no hamelona ny tenanareo mety maty amin’ ny Fanahiny, Izay mitoetra ao anatinareo."]]}}},{"d":"2027-05-16","g":["ESTERA","JAONA"],"a":{"ESTERA":["Mr Hery","Mme Voahirana","Mme Tatamo","Mr Rochel","Mme Tsiry","Mme Lanto"],"JAONA":["Mr Adolph","Mr Tovo","Mme Vero","Mme Voahirana","Mr Lalaina","Dr Hasina"]},"l":{"2":{"t":"Joela 3, 1-5","u":"https://baiboly.org/?book=joel&chapter=3&tr=mg1865","v":[[1,"Ary rehefa afaka izany, dia handatsaka ny Fanahiko amin’ ny nofo rehetra Aho; Dia haminany ny zanakalahinareo sy ny zanakavavinareo, ny lahiantitrareo hanonofy, ary ny zatovonareo hahita fahitana;"],[2,"Ary na dia ny mpanompolahy sy ny mpanompovavy aza dia handatsahako ny Fanahiko amin’ izany andro izany."],[3,"Ary hanisy fahagagana eny amin’ ny lanitra sy etỳ amin’ ny tany Aho, dia rà sy afo ary setroka mitankosina."],[4,"Ny masoandro hampodina ho aizina, ary ny volana ho rà, alohan’ ny hahatongavan’ ny andron’ i Jehovah, izay sady lehibe no mahatsiravina."],[5,"Ary na zovy na zovy no hiantso ny anaran’ i Jehovah dia ho afa-mandositra; Fa ao an-tendrombohitra Ziona sy any Jerosalema dia hisy sisa afaka, araka izay efa voalazan’ i Jehovah, ary izay antsoin’ i Jehovah dia ho isan’ izay afa-mandositra."]]},"3":{"t":"Jaona 14, 15-17","u":"https://baiboly.org/?book=john&chapter=14&tr=mg1865","v":[[15,"Raha tia Ahy ianareo, dia hitandrina ny didiko."],[16,"Ary Izaho hangataka amin’ ny Ray, ary Izy hanome anareo Mpananatra hafa mba ho eo aminareo mandrakizay,"],[17,"dia ny Fanahin’ ny fahamarinana, Izay tsy azon’ izao tontolo izao horaisina, satria tsy hitany na fantany; fa ianareo no mahafantatra Azy, satria mitoetra eo aminareo Izy, ary ho ao anatinareo."]]},"4":{"t":"Asan'ny Apostoly 10, 44-48","u":"https://baiboly.org/?book=acts&chapter=10&tr=mg1865","v":[[44,"Raha mbola nilaza izany teny izany Petera, dia nilatsaka tamin’ izay rehetra nandre ny teny ny Fanahy Masìna."],[45,"Ary talanjona ny mino isan’ ny voafora izay niaraka tamin’ i Petera, satria nilatsaka tamin’ ny jentilisa koa ny fanomezana, dia ny Fanahy Masìna."],[46,"Fa nandre azy niteny tamin’ ny fiteny tsy fantatra sy nankalaza an’ Andriamanitra izy. Dia namaly Petera ka nanao hoe:"],[47,"Moa misy olona mahazo mandrara ny rano tsy hanaovana batisa ireo, izay efa nandray ny Fanahy Masìna tahaka antsika koa?"],[48,"Dia nasainy natao batisa amin’ ny anaran’ i Jesosy Kristy izy. Ary nangatahin’ ireo mba hitoetra ao aminy andro vitsivitsy izy."]]}}},{"d":"2027-05-23","g":["ROTA","KEFASY"],"a":{"ROTA":["Mr Parany","Mr Sen","Mr Rivo","Mr Jean Claude","Mme Tsiory","Mr Herimanitra"],"KEFASY":["Mme Sitraka","Mme Vony","Mme Lea","Mme Alphonsine","Mme Odette","Mme Felana"]},"l":{"2":{"t":"Joela 1, 10-20","u":"https://baiboly.org/?book=joel&chapter=1&tr=mg1865","v":[[10,"Mariry ny saha, misaona ny tany fambolena; Fa simba ny vary, ritra ny ranom-boaloboka, mihena ny diloilo."],[11,"Aoka ho menatra ianareo mpiasa tany; midradradradrà, ianareo mpamboatra tanim-boaloboka, noho ny vary tritika sy ny vary hordea; Fa majifa ny vokatry ny saha;"],[12,"Maina ny voaloboka, malazo ny aviavy, ary malazo koa ny ampongabendanitra sy ny rofia ary ny poma aza, dia ny hazo rehetra any an-tsaha; Eny, malazo ny fifalian’ ny zanak’ olombelona."],[13,"Misikìna sy mitomania, ianareo mpisorona; midradradradrà, ianareo mpanao fanompoam-pivavahana eo amin’ ny alitara; Andeha mandry amin’ ny lamba fisaonana mandritra ny alina, ianareo mpanao fanompoam-pivavahana ho an’ Andriamanitro, fa tapaka tsy ho ao amin’ ny tranon’ Andriamanitra ny fanatitra hohanina sy ny fanatitra aidina."],[14,"Manamasìna andro fifadian-kanina, miantsoa fivoriana masìna, angòny ny loholona sy ny mponina rehetra amin’ ny tany ho ao an-tran
