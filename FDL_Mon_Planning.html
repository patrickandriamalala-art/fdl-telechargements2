:"https://baiboly.org/?book=isaiah&chapter=35&tr=mg1865","v":[[1,"Ravoravo ny efitra sy ny tany karankaina, ary ny tani-hay mifaly sy mamony tahaka ny lilia."],[2,"Mamony be dia be izy, eny, mifaly mihoby izy, ny voninahitr’ i Libanona dia homena azy mbamin’ ny hatsaran-tarehin’ i Karmela sy Sarôna, dia hahita ny voninahitr’ i Jehovah izy sy ny famirapiratan’ Andriamanitsika."],[3,"Ampaherezonareo ny tanana miraviravy, ary hatanjaho ny lohalika malemy."],[4,"Lazao amin’ izay reraka am-po: Mahereza, aza matahotra, indro, Andriamanitrareo ho avy mitondra famaliana, dia ny famalian’ Andriamanitra, eny, Izy tokoa no ho avy ka hamonjy anareo."]]},"3":{"t":"Matio 24, 42-44","u":"https://baiboly.org/?book=matthew&chapter=24&tr=mg1865","v":[[42,"Koa amin’ izany miambena ianareo; fa tsy fantatrareo izay andro hihavian’ ny Tomponareo."],[43,"Nefa aoka ho fantatrareo izao: Raha fantatry ny tompon-trano ny fiambenana amin’ ny alina izay hihavian’ ny mpangalatra, dia ho niambina izy ka tsy namela ny tranony hotamina."],[44,"Koa miomana kosa ianareo; fa amin’ izay ora tsy ampoizinareo no hihavian’ ny Zanak’ olona."]]},"4":{"t":"Romana 5, 1-5","u":"https://baiboly.org/?book=romans&chapter=5&tr=mg1865","v":[[1,"Koa amin’ izany, satria efa nohamarinina tamin’ ny finoana isika, dia aoka isika hanana fihavanana amin’ Andriamanitra amin’ ny alalan’ i Jesosy Kristy Tompontsika."],[2,"Tamin’ ny alalany koa no efa nahazoantsika fanatonana amin’ ny finoana ho amin’ izao fahasoavana itoerantsika izao, ka dia aoka isika hifaly amin’ ny fanantenana ny voninahitr’ Andriamanitra."],[3,"Ary tsy izany ihany, fa aoka isika hifaly amin’ ny fahoriana aza, satria fantatsika fa ny fahoriana mahatonga faharetana;"],[4,"ary ny faharetana mahatonga fahatsaram-panahy voazaha toetra; ary ny fahatsaram-panahy voazaha toetra mahatonga fanantenana;"],[5,"ary ny fanantenana dia tsy mampahamenatra, satria ny Fanahy Masìna, Izay nomena antsika, no nentiny nampidina ny fitiavan’ Andriamanitra ho ao am-pontsika."]]}}},{"d":"2027-11-14","g":["JAONA","ROTA"],"a":{"JAONA":["Mme Tiana","Mr Naina","Mme Sidonie","Mme Saholy","Mme Mama Li","Mme Yoily"],"ROTA":["Mr Jean Claude","Mr Rivo","Mr Herimanitra","Mme Patricia","Mme Tsiory","Mme Onja"]},"l":{"2":{"t":"Ezekiela 34, 1-10","u":"https://baiboly.org/?book=ezekiel&chapter=34&tr=mg1865","v":[[1,"Ary tonga tamiko ny tenin’ i Jehovah nanao hoe:"],[2,"Ry zanak’ olona, maminania ny hamelezana ny mpiandry ny Isiraely, eny, maminania, ka ataovy aminy hoe: Izao no lazain’ i Jehovah Tompo: Lozan’ ny mpiandry ondrin’ ny Isiraely izay mamahan-tena! Moa tsy ny ondry va no tokony handrasan’ ny mpiandry?"],[3,"Ny taviny dia haninareo, ary ny volony tafinareo, ny nafahy vonoinareo; nefa ny ondry tsy mba andrasanareo."],[4,"Tsy manatanjaka ny malemy ianareo, na manasitrana ny marary, na manamatra ny folaka, na mampody ny noroahina, na mikatsaka ny very; fa loza loatra ny fampanomponareo azy."],[5,"Dia miely izy, satria tsy misy mpiandry; ary rehefa miely izy, dia tonga rembin’ ny bibidia rehetra."],[6,"Mirenireny eny an-tendrombohitra sy eny amin’ ny havoana andrandraina rehetra ny ondriko; eny, any amin’ ny tany rehetra no ielezan’ ny ondriko, ary tsy misy mitady na miahy azy."],[7,"Koa mihainoa ny tenin’ i Jehovah ianareo, ry mpiandry ondry:"],[8,"Raha velona koa Aho, hoy Jehovah Tompo, noho ny nahababoan’ ny ondriko sy ny nahatongavan’ ny ondriko ho rembin’ ny bibi-dia rehetra, satria tsy nisy mpiandry azy, fa tsy nitady ny ondriko ny mpiandry, fa ny mamahan-tena kosa no ataony, ka tsy namahana ny ondriko,"],[9,"dia mihainoa ny tenin’ i Jehovah ianareo, ry mpiandry ondry."],[10,"Izao no lazain’ i Jehovah Tompo: Indro, avy hamely ny mpiandry ondry Aho, dia hampamoahiko ny amin’ ny ondriko izy ka hesoriko tsy hiandry ny ondry intsony; dia tsy hamahan-tena intsony ny mpiandry ondry, fa hovonjeko eo amin’ ny vavany ny ondriko mba tsy ho azony hohanina intsony."]]},"3":{"t":"Lioka 19, 1-10","u":"https://baiboly.org/?book=luke&chapter=19&tr=mg1865","v":[[1,"Ary Jesosy niditra ka nandeha namaky an’ i Jeriko."],[2,"Ary, indro, nisy lehilahy atao hoe Zakaiosy, izay lehiben’ ny mpamory hetra sady nanan-karena."],[3,"Ary nitady hahita izay Jesosy izy, kanefa ny afaka noho ny habetsahan’ ny olona nifanety, satria fohy izy."],[4,"Dia nihazakazaka nialoha izy ka nananika aviavy hizaha an’ i Jesosy; fa efa handalo tamin’ izany lalana izany Izy."],[5,"Ary rehefa tonga teo Jesosy, dia niandrandra ka nanao taminy hoe: Ry Zakaiosy, midìna faingana; fa tsy maintsy mitoetra ao an-tranonao Aho anio."],[6,"Dia nidina faingana izy ka nampiantrano Azy sady faly."],[7,"Ary raha nahita izany izy rehetra, dia nimonomonona ka nanao hoe: Lasa nandeha hiantrano amin’ izay lehilahy mpanota Izy."],[8,"Fa Zakaiosy kosa nitsangana ka nanao tamin’ ny Tompo hoe: Indro, Tompoko, ny antsasaky ny fananako omeko ho an’ ny malahelo; ary raha misy zavatr’ olona nalaiko tamin’ ny fanambakana, dia honerako avy efatra heny izany."],[9,"Ary hoy Jesosy taminy: Anio no tonga eto amin’ ity trano ity ny famonjena, fa izy dia zanak’ i Abrahama koa."],[10,"Fa efa tonga ny Zanak’ olona hitady sy hamonjy ny very."]]},"4":{"t":"Filipiana 3, 17-21","u":"https://baiboly.org/?book=philippians&chapter=3&tr=mg1865","v":[[17,"Ry rahalahy, aoka samy hanahaka ahy ianareo, ka diniho izay mandeha tahaka ny anananareo anay ho marika."],[18,"Fa maro no mandeha, izay efa nolazaiko taminareo matetika, sady mbola lazaiko aminareo amin’ ny fitomaniana koa ankehitriny, fa fahavalon’ ny hazo fijalian’ i Kristy ireny;"],[19,"fahaverezana no hiafarany, ny kibony no andriamaniny, ny fahamenarany no voninahiny, fa misaina ny amin’ ny tany izy."],[20,"Fa ny fanjakantsika dia any an-danitra, ary avy any koa no iandrasantsika Mpamonjy, dia Jesosy Kristy Tompo,"],[21,"Izay hanova ny tenan’ ny fietren-tenantsika ka hitovy endrika amin’ ny tenan’ ny voninahiny, araka ny fiàsan’ ny heriny, izay ahaizany hampanaiky ny zavatra rehetra ho Azy."]]}}},{"d":"2027-11-21","g":["KEFASY","ISAIA"],"a":{"KEFASY":["Mr Yves","Mr Njaka","Mr Ando","Mr Joelson","Mme Sylvia","Mr Richard"],"ISAIA":["Mme Rahely","Mme Onja","Mme Germaine","Mr Haja","Mme Hanta","Mr Tafita"]},"l":{"2":{"t":"Isaia 52, 1-8","u":"https://baiboly.org/?book=isaiah&chapter=52&tr=mg1865","v":[[1,"Mifohaza, mifohaza, tafio ny herinao, ry Ziona ô; tafio ny fitafianao tsara tarehy, ry Jerosalema ô, tanàna masìna; fa tsy hiditra any aminao intsony ny tsy voafora sy ny maloto."],[2,"Ahintsano ny vovoka hiala amin’ ny tenanao, ka mitsangàna, ary mipetraha, ry Jerosalema ô; vahao ny fatorana amin’ ny tendanao, ry Ziona, zanakavavy babo."],[3,"Fa izao no lazain’ i Jehovah: Tsy vola tsy harena no nivarotana anareo, ka dia tsy vola tsy harena koa no hanavotana anareo."],[4,"Fa izao no lazain’ i Jehovah Tompo: Tany Egypta no nidinan’ ny oloko tamin’ ny voalohany mba hivahiny tany; Ary ny Asyriana koa nampahory azy tsy ahoan-tsy ahoana."],[5,"Ary ankehitriny inona no hataoko eto? hoy Jehovah, fa nobaboina tsy ahoan-tsy ahoana ny oloko; ny mpanapaka azy dia manakora, hoy Jehovah; ary mandrakariva dia hamavoina mandritra ny andro ny anarako."],[6,"Koa ny oloko dia hahalala ny anarako; Eny, amin’ izany andro izany dia ho fantany fa Izaho no miteny hoe: Inty Aho."],[7,"Akory ny hatsaran’ ny tongotr’ iry mitondra teny soa mahafaly erỳ an-tendrombohitra sady mitory fiadanana! Dia izay mitondra teny soa mahafaly sady mitory famonjena, eny, izay manao amin’ i Ziona hoe: Mpanjaka Andriamanitrao!"],[8,"Injany ny feon’ ny mpitilinao! Manandratra ny feony izy ka miara-mihoby; fa ho faly izy mahita mifanatri-maso ny hodian’ i Jehovah ho any Ziona."]]},"3":{"t":"Jaona 10, 1-10","u":"https://baiboly.org/?book=john&chapter=10&tr=mg1865","v":[[1,"Lazaiko aminareo marina dia marina tokoa fa izay tsy miditra amin’ ny vavahady ho amin’ ny valan’ ondry, fa mananika ny fefy, dia mpangalatra sy jiolahy."],[2,"Fa izay miditra amin’ ny vavahady no mpiandry ny ondry."],[3,"Ary izy no vohan’ ny mpiandry vavahady; ary ny ondry mihaino ny feony; ary izay ondriny tokoa dia antsoiny amin’ ny anarany avy ka entiny mivoaka."],[4,"Ary rehefa mamoaka ireo rehetra ireo izy, dia mialoha azy; ary ny ondriny manaraka azy, satria mahalala ny feony ireo."],[5,"Ary ny vahiny tsy harahiny, fa handosirany, satria tsy fantany ny feon’ ny vahiny."],[6,"Izany fanoharana izany no nolazain’ i Jesosy taminy, nefa tsy azony izay zavatra nolazainy taminy."],[7,"Dia hoy indray Jesosy taminy: Lazaiko aminareo marina dia marina tokoa: Izaho no vavahadin’ ondry."],[8,"Mpangalatra sy jiolahy izay rehetra tonga talohako; fa tsy nihaino azy ny ondry."],[9,"Izaho no vavahady; raha Izaho no hidiran’ ny olona, dia hovonjena izy ka hiditra sy hivoaka sady hahazo hanina."],[10,"Ny mpangalatra tsy avy raha tsy hangalatra sy hamono ary handringana; Izaho avy mba hananany fiainana, sady hananany be dia be."]]},"4":{"t":"1 Korintiana 9, 15-18","u":"https://baiboly.org/?book=1-corinthians&chapter=9&tr=mg1865","v":[[15,"Nefa tsy nahavatra izany zavatra izany na dia kely akory aza aho; ary tsy manoratra izany aho mba hanaovana izany amiko; fa aleoko maty toy izay hisy hahafoana ny reharehako."],[16,"Fa raha mitory ny filazantsara aho, dia tsy misy ho reharehako, satria tsy maintsy manao izany; fa lozako, raha tsy mitory ny filazantsara aho!"],[17,"Fa raha ny sitrapoko no anaovako izany, dia mahazo valim-pitia aho; fa raha tsy ny sitrapoko, dia natolotra aho ho andraikitro izany."],[18,"Inona ary no valim-pitia azoko? Dia izao: raha mitory ny filazantsara aho, dia tsy asiako fandoavam-bola ny filazantsara, mba tsy hanampatra ny fahefako amin’ ny filazantsara."]]}}},{"d":"2027-11-28","g":["ESTERA"],"a":{"ESTERA":["Mme Lanto","Mme Tsiry","Mme Georgina","Mr Patrick","Mr Rochel","Mme Tatamo"]},"l":{"2":{"t":"Isaia 50, 4-9","u":"https://baiboly.org/?book=isaiah&chapter=50&tr=mg1865","v":[[4,"Jehovah Tompo nanome Ahy ny lelan’ ny efa mahay, mba hahaizako manao teny hampahatanjaka izay reraka; ampandrenesiny isa-maraina isa-maraina, eny, ampandrenesiny ny sofiko hihaino tahaka ny efa mahay"],[5,"Jehovah Tompo nanokatra ny sofiko, ary Izaho tsy naditra na nihemotra."],[6,"Ny lamosiko natolotro ho amin’ ny mpikapoka, ary ny takolako ho amin’ izay manongobaoka; ny tavako tsy nafeniko tamin’ ny henatra sy ny rora."],[7,"Fa Jehovah Tompo no hamonjy Ahy, ka dia tsy resin-kenatra Aho; Ary efa nohamafisiko ho tahaka ny afovato ny tavako, ka fantatro fa tsy ho menatra Aho."],[8,"Efa akaiky Izay manamarina Ahy: Iza no hiady amiko? Andeha hiara-mitsangana isika; iza no manana ady amiko? Aoka izy ho avy amiko."],[9,"Indro, Jehovah Tompo no hamonjy ahy; koa iza no hanameloka ahy? Indro, izy rehetra ho tonga tahaka ny lamba mangarahara, ho lanin’ ny kalalao izy."]]},"3":{"t":"Marka 7, 24-30","u":"https://baiboly.org/?book=mark&chapter=7&tr=mg1865","v":[[24,"Ary niala teo Jesosy ka lasa nankany amin’ ny sisin-tanin’ i Tyro sy Sidona; dia niditra tao an-trano Izy, ary tiany tsy ho fantatry ny olona izany; kanefa tsy nahazo niery Izy."],[25,"Fa niaraka tamin’ izay dia nisy vehivavy anankiray nandre ny aminy (ny zananivavy tanora dia azom-panahy maloto), dia nankao ka niankohoka tamin’ ny tongony."],[26,"Ary jentilisa ravehivavy, avy amin’ ny firenena Syro-foinika; dia nangataka taminy izy mba hamoaka ny demonia amin’ ny zananivavy."],[27,"Fa hoy Jesosy taminy: Aoka ho voky aloha ny zaza; fa tsy mety raha maka ny mofon-jaza ka manipy azy ho an’ ny amboakely."],[28,"Fa ravehivavy namaly ka nanao taminy hoe: Eny, Tompoko; kanefa na dia ny amboakely ao ambanin’ ny latabatra aza dia mba mihinana ny sombintsombin’ ny mofon-jaza ihany."],[29,"Dia hoy Jesosy taminy: Noho izany teny izany mandehana ianao; efa nivoaka tamin’ ny zanakao-vavy ny demonia."],[30,"Ary raha tonga tao an-tranony ravehivavy, dia hitany nandry teo ambonin’ ny farafara ny zananivavy, ary ny demonia efa nivoaka taminy."]]},"4":{"t":"Hebreo 12, 14-17","u":"https://baiboly.org/?book=hebrews&chapter=12&tr=mg1865","v":[[14,"Miezaha mitady fihavanana amin’ ny olona rehetra ary fahamasinana; fa izay tsy manam-pahamasinana dia tsy hahita ny Tompo."],[15,"Ary mitandrema tsara, fandrao hisy hiala amin’ ny fahasoavan’ Andriamanitra; fandrao hisy faka mangidy mitsimoka hampikorontana, ka ho voaloto ny maro;"],[16,"fandrao hisy mpijangajanga na olona tsy manaja ny masìna, dia tahaka an’ i Esao, izay nivarotra ny fizokiany hahazoany hanina indraim-bava."],[17,"Fa fantatrareo fa rehefa afaka izany, raha ta-handova ny fitahiana izy, dia nolavina; fa tsy nahita izay hibebahana izy; na dia nitady fatratra tamin’ ny ranomaso aza."]]}}},{"d":"2027-12-05","g":["JAONA","ROTA"],"a":{"JAONA":["Mme Voahirana","Mme Vero","Mr Adolph","Mr Tovo","Dr Hasina","Mr Lalaina"],"ROTA":["Mme Mavo","Mme Vola","Mr Parany","Mme Lucie","Mme Lalao","Mme Julie"]},"l":{"2":{"t":"1 Tantara 16, 23-27","u":"https://baiboly.org/?book=1-chronicles&chapter=16&tr=mg1865","v":[[23,"Mihira ho an’ i Jehovah, ry tany rehetra; Lazao isan’ andro isan’ andro ny famonjeny mahafaly."],[24,"Ambarao any amin’ ny jentilisa ny voninahiny, ary any amin’ ny firenena rehetra ny fahagagana ataony."],[25,"Fa lehibe Jehovah ka mendrika hoderaina indrindra, sady mahatahotra, fa ambonin’ ny andriamanitra rehetra."],[26,"Fa ny andriamanitry ny firenena rehetra dia tsinontsinona, fa Jehovah no nanao ny lanitra."],[27,"Famirapiratana sy voninahitra no eo anatrehany, Hery sy hafaliana no ao amin’ ny fitoerany."]]},"3":{"t":"Lioka 19, 37-38","u":"https://baiboly.org/?book=luke&chapter=19&tr=mg1865","v":[[37,"Ary rehefa nanakaiky Izy ka tonga teo am-pidinana amin’ ny tendrombohitra Oliva, dia nifaly avokoa ny mpianatra maro be ka nidera an’ Andriamanitra tamin’ ny feo mahery noho ny asa lehibe rehetra izay efa hitany"],[38,"ka nanao hoe: Isaorana anie ny Mpanjaka, Izay avy amin’ ny anaran’ i Jehovah. Fiadanana any an-danitra, ary voninahitra any amin’ ny avo indrindra."]]},"4":{"t":"Apokalypsy 5, 13-14","u":"https://baiboly.org/?book=revelation&chapter=5&tr=mg1865","v":[[13,"Ary izao zavatra ary rehetra izao, na izay any an-danitra, na izay etỳ ambonin’ ny tany sy any ambanin’ ny tany, na izay any an-dranomasina mbamin’ izay rehetra ao anatiny, dia reko samy nanao hoe: Ho an’ ilay mipetraka eo ambonin’ ny seza fiandrianana sy ho an’ ny Zanak’ ondry anie ny saotra sy ny haja sy ny voninahitra ary ny fanjakana mandrakizay mandrakizay."],[14,"Ary ny zava-manan’ aina efatra nanao hoe: Amena. Ary ny loholona dia niankohoka ka nivavaka."]]}}},{"d":"2027-12-12","g":["KEFASY","ISAIA"],"a":{"KEFASY":["Mme Vony","Mme Sitraka","Mme Felana","Mme Odette","Mme Alphonsine","Mme Lea"],"ISAIA":["Mme Holy","Mme Rahely","Mme Albertine","Mme Germaine","Mme Tiana","Mme Hanta"]},"l":{"2":{"t":"Salamo 119, 105-112","u":"https://baiboly.org/?book=psalms&chapter=119&tr=mg1865","v":[[105,"Fanilon’ ny tongotro Sy fanazavana ny lalako ny teninao."],[106,"Efa nianiana aho fa hitandrina ny fitsipikao marina, Ka nefaiko izany."],[107,"Ampahorina indrindra aho; Jehovah ô, velomy aho araka ny teninao."],[108,"Jehovah ô, aoka anie mba hankasitrahanao ny fanati-tsitrapo aloaky ny vavako, Ary ampianaro ahy ny fitsipikao."],[109,"An-tenda ihany ny aiko mandrakariva; Kanefa tsy manadino ny lalànao aho."],[110,"Ny ratsy fanahy mamela-pandrika haningotra ahy; Kanefa tsy mania miala amin’ ny didinao aho."],[111,"Efa noraisiko ho lovako mandrakizay ny teni-vavolombelonao, Satria fifalian’ ny foko izany."],[112,"Apetrako ny foko hankatò ny didinao Mandrakizay hatramin’ ny farany."]]},"3":{"t":"Matio 21, 15-17","u":"https://baiboly.org/?book=matthew&chapter=21&tr=mg1865","v":[[15,"Fa nony hitan’ ny lohan’ ny mpisorona sy ny mpanora-dalàna ny zavatra mahagaga izay nataony sy ny ankizy madinika miantso eo an-kianjan’ ny tempoly ka manao hoe: Hosana ho an’ ny Zanak’ i Davida! ― dia tezitra izy"],[16,"ka nanao taminy hoe: Renao va izay lazain’ ireo? Dia hoy Jesosy taminy: Eny; tsy mbola novakinareo va ny teny manao hoe: Avy amin’ ny vavan’ ny ankizy madinika sy ny zaza minono no nanamboaranao fiderana?"],[17,"Dia nandao azy Izy ka niala tao an-tanàna hankany Betania; ary dia nitoetra tao mandritra ny alina Izy."]]},"4":{"t":"Jaona 3, 1-6","u":"https://baiboly.org/?book=john&chapter=3&tr=mg1865","v":[[1,"Ary nisy Fariseo anankiray atao hoe Nikodemosy, mpanapaka tamin’ ny Jiosy."],[2,"Izy nankao amin’ i Jesosy nony alina ka nanao taminy hoe: Raby ô, fantatray fa mpampianatra avy amin’ Andriamanitra Hianao; fa tsy misy olona mahay manao izao famantarana ataonao izao, raha tsy Andriamanitra no momba azy."],[3,"Jesosy namaly ka nanao taminy hoe: Lazaiko aminao marina dia marina tokoa: Raha tsy ateraka indray ny olona, dia tsy mahazo mahita ny fanjakan’ Andriamanitra."],[4,"Hoy Nikodemosy taminy: Hataon’ ny olona ahoana no hateraka rehefa lehibe; moa mahazo miditra any an-kibon-dreniny indray va izy ka hateraka?"],[5,"Jesosy namaly hoe: Lazaiko aminao marina dia marina tokoa: Raha misy olona tsy ateraky ny rano sy ny Fanahy, dia tsy mahazo miditra amin’ ny fanjakan’ Andriamanitra izy."],[6,"Izay ateraky ny nofo dia nofo; ary izay ateraky ny Fanahy dia fanahy."]]}}},{"d":"2027-12-19","g":["ESTERA","JAONA"],"a":{"ESTERA":["Mr Hery","Mme Voahirana","Mme Lanto","Mme Tsiry","Mme Georgina","Mr Patrick"],"JAONA":["Mme Yoily","Mme Mama Li","Mr Naina","Mme Tiana","Mme Saholy","Mme Sidonie"]},"l":{"2":{"t":"Salamo 66, 1-4","u":"https://baiboly.org/?book=psalms&chapter=66&tr=mg1865","v":[[1,"Ho an’ ny mpiventy hira. Tonon-kira. Salamo. Mihobia ho an’ Andriamanitra, ry tany rehetra;"],[2,"Mankalazà ny voninahitry ny anarany; omeo voninahitra Izy ho fiderana Azy."],[3,"Lazao amin’ Andriamanitra hoe: endrey, mahatahotra ny asanao! ny fahalehibiazan’ ny herinao no hikoizan’ ny fahavalonao Anao."],[4,"Ny tany rehetra hiankohoka eo anatrehanao ka hankalaza Anao; eny, hankalaza ny anaranao izy. [Sela.]"]]},"3":{"t":"Jaona 9, 24-38","u":"https://baiboly.org/?book=john&chapter=9&tr=mg1865","v":[[24,"Dia niantso ilay jamba teo aloha indray izy ka nanao taminy hoe: Omeo voninahitra Andriamanitra; izahay mahalala fa mpanota izany Lehilahy izany."],[25,"Fa izy namaly hoe. Tsy fantatro na mpanota Izy, na tsia; zavatra iray loha ihany no fantatro: jamba aho teo aloha, fa mahiratra aho izao."],[26,"Dia hoy izy taminy: Inona no nataony taminao? Nanao ahoana ange no nampahiratany ny masonao?"],[27,"Dia namaly azy hoe izy: Efa voalazako taminareo rahateo, fa tsy nihaino ianareo; nahoana no te-hihaino indray ianareo? Moa te-ho mpianany koa va ianareo?"],[28,"Dia nanevateva azy izy ka nanao hoe: Ialahy no mpianany; fa izahay mpianatr’ i Mosesy."],[29,"Izahay mahalala fa Mosesy no nitenenan’ Andriamanitra; fa ny amin’ izany Lehilahy izany, dia tsy fantatray izay nihaviany."],[30,"Ralehilahy namaly azy hoe: Mba mahagaga tokoa lahy izany! fa tsy fantatrareo ny nihaviany, nefa nampahiratra ny masoko Izy."],[31,"Fantatsika fa Andriamanitra tsy mihaino ny mpanota; fa izay mivavaka aminy sy manao ny sitrapony no henoiny."],[32,"Hatrizay hatrizay dia tsy mbola re fa nisy nampahiratra ny mason’ izay teraka jamba."],[33,"Raha tsy avy amin’ Andriamanitra izany Lehilahy izany, dia tsy mahefa na inona na inona Izy."],[34,"Ary namaly ireo ka nanao taminy hoe: Tena teraka tamin’ ny ota ialahy, ka ialahy indray va mampianatra anay? Dia noroahiny izy."],[35,"Jesosy nandre fa efa noroahiny ralehilahy; ary rehefa nahita azy Izy, dia nanao hoe: Mino ny Zanak-Andriamanitra va ianao?"],[36,"Ralehilahy namaly ka nanao hoe: Iza moa no Izy, Tompoko, mba hinoako Azy?"],[37,"Hoy Jesosy taminy: Efa nahita Azy ianao, sady Izay miresaka aminao izao no Izy."],[38,"Ary hoy izy: Tompoko, mino aho. Dia niankohoka teo anatrehany izy."]]},"4":{"t":"Joda 24-25","u":"https://baiboly.org/?book=jude&chapter=1&tr=mg1865","v":[[24,"Ary ho an’ izay maharo anareo mba tsy ho tafintohina, ary hametraka anareo tsy hanan-tsiny eo anoloan’ ny voninahiny amin’ ny firavoravoana,"],[25,"ho an’ Andriamanitra tokana, Mpamonjy antsika, amin’ ny alalan i Jesosy Kristy Tompontsika anie, ny voninahitra sy ny fahalehibiazana, ny fanjakana sy ny fahefana hatramin’ ny taloha indrindra sy ankehitriny ary mandrakizay. Amena."]]}}},{"d":"2027-12-26","g":["ROTA"],"a":{"ROTA":["Mr Sen","Mr Jean Claude","Mr Rivo","Mr Herimanitra","Mme Patricia","Mme Tsiory"]},"l":{"2":{"t":"Isaia 40, 1-11","u":"https://baiboly.org/?book=isaiah&chapter=40&tr=mg1865","v":[[1,"Ampionony, ampionony ny oloko, Hoy Andriamanitrareo;"],[2,"Mitoria teny soa mahafaly amin’ i Jerosalema, ka lazao aminy fa vita ny adiny, sady voavela ny helony, ary efa nandray indroa heny tamin’ ny tànan’ i Jehovah izy ho valin’ ny fahotana rehetra nataony."],[3,"Injany! misy feon’ ny miantso hoe: Manamboara lalana any an-efitra ho an’ i Jehovah, manaova lalambe any an-tany foana ho an’ Andriamanitsika."],[4,"Aoka hasandratra ny lohasaha rehetra, Aoka haetry ny tendrombohitra sy ny havoana rehetra; Aoka ny be havoana ho tonga lembalemba, ary ny tany saro-dalana ho tonga lemaka;"],[5,"Dia hiseho ny voninahitr’ i Jehovah, ary ny nofo rehetra hiara-mahita izany; Fa ny vavan’ i Jehovah no efa niteny."],[6,"Injany! misy miteny hoe: Miantsoa. Ary hoy izy: Ahoana anefa no antso hataoko? Ahitra ny nofo rehetra, ary ny hatsaran-tarehiny rehetra dia tahaka ny vonin-javatra any an-tsaha;"],[7,"Maina ny ahitra, malazo ny voniny, satria tsofin’ ny fofonain’ i Jehovah ireny; Eny, ahitra tokoa ny olona."],[8,"Maina ny ahitra, malazo ny voniny; Fa ny tenin’ Andriamanitsika dia haharitra mandrakizay."],[9,"Ry Ziona, izay mitondra teny soa mahafaly ô, miakara any an-tendrombohitra avo; Ry Jerosalema izay mitondra teny soa mahafaly ô, Asandrato mafy ny feonao, asandrato, fa aza matahotra; Lazao amin’ ny tanànan’ ny Joda hoe. Indro Andriamanitrareo!"],[10,"Indro, Jehovah Tompo ho avy amin’ ny heriny, ka ny sandriny ihany no hanapaka; indro, ny valim-pitia hatolony dia eny aminy, ary ny valin’ asa homeny dia eo anoloany."],[11,"Hiandry ny ondriny tahaka ny mpiandry ondry Izy; Ny sandriny no hanangonany ny zanak’ ondry, ka hotrotroiny eo an-tratrany ireny, ary horoahiny miadana ny ampianahany."]]},"3":{"t":"Matio 2, 19-23","u":"https://baiboly.org/?book=matthew&chapter=2&tr=mg1865","v":[[19,"Ary rehefa maty Heroda, indro, nisy anjelin’ ny Tompo niseho tamin’ i Josefa tany Egypta tamin’ ny nofy ka nanao hoe:"],[20,"Mifohaza ianao, ka ento ny Zazakely sy ny reniny, dia mankanesa any amin’ ny tanin’ ny Isiraely; fa efa maty izay nitady ny ain’ ny Zazakely."],[21,"Dia nifoha izy ka nitondra ny Zazakely sy ny reniny, dia tonga tany amin’ ny tanin’ ny Isiraely."],[22,"Fa rehefa reny fa Arkelaosy no nanjaka tany Jodia nandimby an’ i Heroda rainy, dia natahotra hankany izy; ary rehefa notoroan’ Andriamanitra hevitra tamin’ ny nofy izy, dia lasa nankany amin’ ny tany Galilia."],[23,"Ary nony tonga tany izy, dia nonina tao amin’ ny tanàna atao hoe Nazareta, mba hahatanteraka izay nampilazaina ny mpaminany hoe: Hatao hoe Nazarena Izy."]]},"4":{"t":"2 Timoty 1, 6-12","u":"https://baiboly.org/?book=2-timothy&chapter=1&tr=mg1865","v":[[6,"Ary noho izany dia mampahatsiaro anao aho mba hamelomanao ny fanomezam-pahasoavana avy amin’ Andriamanitra, izay ao anatinao tamin’ ny fametrahako ny tanako."],[7,"Fa tsy nomen’ Andriamanitra fanahy osa isika, fa fanahy mahery sy fitiavana ary fahononan-tena."],[8,"Koa aza menatra ny ho vavolombelon’ ny Tompontsika, na ahy mpifatony ianao; fa aoka ianao ho mpiombona ny fahoriana noho ny filazantsara araka ny herin’ Andriamanitra,"],[9,"Izay namonjy antsika sy niantso antsika tamin’ ny fiantsoana masìna, tsy araka ny asantsika, fa araka ny fikasany sy ny fahasoavany izay nomena antsika tao amin’ i Kristy Jesosy hatry ny fony fahagola;"],[10,"fa naharihary ankehitriny tamin’ ny nisehoan’ i Kristy Jesosy, Mpamonjy antsika, Izay nahafoana ny herin’ ny fahafatesana, ka ny filazantsara no nampisehoany mazava ny fiainana sy ny tsi-fahalòvana mandrakizay;"],[11,"ny amin’ io filazantsara io no nanendrena ahy ho mpitory sy Apostoly ary mpampianatra."],[12,"Ary noho izany koa no iaretako izao zavatra izao, ka tsy menatra aho, satria fantatro Izay inoako, ary matoky aho fa Izy dia mahatahiry ilay zavatra natolotro Azy mandra-pihavin’ izay andro izay."]]}}}]}</script>

/* ---------- dates ---------- */
function parseDate(iso){ var p = iso.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function aujourdhui(){
  var m = /[?&]date=(\d{4}-\d{2}-\d{2})/.exec(window.location.search || "");   // ?date=2026-10-10 : simulation (démonstration)
  var d = m ? parseDate(m[1]) : new Date();
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}
function jours(date){ return Math.round((date - aujourdhui()) / 86400000); }
function fmtLong(d){ return liste("jours")[d.getDay()] + " " + d.getDate() + (d.getDate()===1 ? T("jour1") : "") + " " + liste("mois")[d.getMonth()] + " " + d.getFullYear(); }
function fmtCourt(d){ return liste("jours_courts")[d.getDay()] + " " + d.getDate() + " " + liste("mois_courts")[d.getMonth()]; }
function T(cle){
  var t = DATA && DATA.textes, v = t && t[cle];
  if(langue() === langueProjet() && typeof v === "string" && v.replace(/\s/g,"")) return v;   /* écrits dans la langue des responsables */
  var p = LANGUES.textes[langue()];

  var f = LANGUES.textes.fr[cle]; return typeof f === "string" ? f : cle;
}
function dans(n){ return n===0 ? T("aujourdhui") : n===1 ? T("demain") : n>1 ? T("dans_jours").replace("{n}", n) : T("il_y_a").replace("{n}", -n); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function nomRole(i){ return ROLES[i][0] + " · " + ROLES[i][1]; }

/* ---------- données ---------- */
function groupes(){ return DATA.ordre.filter(function(g){ return DATA.membres[g]; }); }
function mesParticipations(g, nom){
  var out = [];
  DATA.dimanches.forEach(function(it){
    if(it.g.indexOf(g) < 0) return;
    var equipe = it.a[g] || [];

function moiValide(){ return etat.moi && DATA.membres[etat.moi.g] && DATA.membres[etat.moi.g].indexOf(etat.moi.n) >= 0; }
function partsMoi(){ return moiValide() ? mesParticipations(etat.moi.g, etat.moi.n) : []; }
function fidirana(p){ return p.tokana ? "Fidirana tokana" : "Fidirana " + (p.pos+1) + "°"; }

/* ---------- calendrier .ics (rappels) ---------- */
function p2(n){ return (n<10?"0":"")+n; }
function fmtLocal(d){ return d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate())+"T"+p2(d.getHours())+p2(d.getMinutes())+"00"; }
function avecHeure(date, hhmm){ var h = (hhmm||"00:00").split(":"); return new Date(date.getFullYear(), date.getMonth(), date.getDate(), +h[0]||0, +h[1]||0, 0); }
function dureeICS(min){
  if(min <= 0) return "PT0S";
  var j = Math.floor(min/1440), h = Math.floor((min%1440)/60), m = min%60;
  return "-P" + (j? j+"D":"") + "T" + (h? h+"H":"") + (m? m+"M":"");
}
function escICS(s){ return String(s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n"); }
function plier(ligne){
  var out = [], reste = ligne;
  while(reste.length > 72){ out.push(reste.slice(0,72)); reste = " " + reste.slice(72); }
  out.push(reste); return out;
}
function lectDe(lect, role){ return lect ? (lect[String(role+1)] || null) : null; }   /* rôles VKT 1/2/3 = codes 2/3/4 */
var LECTS = [];                                           /* passages affichés (le bouton garde son numéro) */
function htmlLecture(l){
  if(!l) return "";
  var txt = '📖 ' + esc(l.t);
  if(l.v && l.v.length){ LECTS.push(l); return '<button type="button" class="lect lecbtn" data-lect="'+(LECTS.length-1)+'">'+txt+'</button>'; }
  if(l.u && /^https?:\/\//.test(l.u)) return '<a class="lect" href="'+esc(l.u)+'"'+(EN_APP ? '' : ' target="_blank" rel="noopener"')+'>'+txt+'</a>';
  return '<span class="lect">'+txt+'</span>';
}
function texteRappel(p){
  var l = lectDe(p.lect, p.role);
  return nomRole(p.role) + (l ? " (" + l.t + ")" : "") + " — " + fidirana(p) + " (" + p.g + ")";
}
function construireICS(parts, prefs, nom){
  var L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//FJKM//FDL planning//FR","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:"+escICS("FDL — "+nom)];
  var stamp = new Date().toISOString().replace(/[-:]/g,"").split(".")[0] + "Z";
  parts.forEach(function(p){
    var debut = avecHeure(p.date, prefs.debut), fin = new Date(debut.getTime() + (prefs.duree||120)*60000);
    var autres = p.equipe.map(function(n,i){ return n ? ROLES[i][0]+" : "+n : null; }).filter(Boolean).join("\n");
    var desc = texteRappel(p) + "\n\n" + T("equipe_titre") + "\n" + autres;
    L.push("BEGIN:VEVENT");
    L.push("UID:fdl-"+p.iso+"-"+p.g+"-"+nom.replace(/[^A-Za-z0-9]/g,"")+"@fjkm");
    L.push("DTSTAMP:"+stamp);
    L.push("DTSTART:"+fmtLocal(debut));
    L.push("DTEND:"+fmtLocal(fin));
    L.push("SUMMARY:"+escICS("FDL — "+ROLES[p.role][0]+" ("+p.g+")"));
    L.push("DESCRIPTION:"+escICS(desc));
    L.push("TRANSP:TRANSPARENT");
    if(prefs.veille){
      var av = avecHeure(new Date(p.date.getFullYear(), p.date.getMonth(), p.date.getDate()-1), prefs.hVeille);
      var mv = Math.round((debut - av)/60000);
      if(mv > 0){ L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+escICS(T("demain")+" : "+texteRappel(p)),"TRIGGER:"+dureeICS(mv),"END:VALARM"); }
    }
    if(prefs.jour){
      var aj = avecHeure(p.date, prefs.hJour);
      var mj = Math.round((debut - aj)/60000);
      if(mj > 0){ L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+escICS(T("aujourdhui")+" : "+texteRappel(p)),"TRIGGER:"+dureeICS(mj),"END:VALARM"); }
    }
    L.push("END:VEVENT");
  });
  L.push("END:VCALENDAR");
  var plie = []; L.forEach(function(l){ plier(l).forEach(function(x){ plie.push(x); }); });
  return plie.join("\r\n") + "\r\n";
}
/* ---------- mise à jour automatique par internet ---------- */
var jetons = {}, jetonN = 0;
window.__retourReseau = function(j, corps){ var f = jetons[j]; if(f){ delete jetons[j]; f(corps); } };
function telecharger(url){
  return new Promise(function(resolve, reject){
    var delai = setTimeout(function(){ reject(new Error("délai dépassé")); }, 15000);
    if(EN_APP && window.AndroidFDL.telecharger){
      var j = ++jetonN;
      jetons[j] = function(corps){ clearTimeout(delai); if(corps){ resolve(corps); } else { reject(new Error("réseau")); } };
      window.AndroidFDL.telecharger(url, j);
    } else if(typeof fetch === "function"){
      fetch(url, {cache:"no-store"}).then(function(r){ if(!r.ok) throw new Error("http "+r.status); return r.text(); })
        .then(function(t){ clearTimeout(delai); resolve(t); }).catch(function(e){ clearTimeout(delai); reject(e); });
    } else { clearTimeout(delai); reject(new Error("pas de réseau")); }
  });
}
function appliquerMaj(d, txt){
  if(!d.source && DATA.source){ d.source = DATA.source; txt = JSON.stringify(d); }   /* on garde l'adresse si la nouvelle version ne la contient pas */
  DATA = d;
  try{
    if(EN_APP){ if(window.AndroidFDL.enregistrerProgramme) window.AndroidFDL.enregistrerProgramme(txt); }
    else { ecrire("fdl_data", d); }
  }catch(e){}
  effacer("fdl_pin");
  etat.dimanche = null;
  render();
}
function epingleActif(){
  /* fichier chargé à la main dans l'application : conservé tant qu'aucune NOUVELLE publication n'arrive */
  try{
    if(EN_APP && window.AndroidFDL.importManuel){
      var st = window.AndroidFDL.importManuel();
      if(!st){ effacer("fdl_pin"); }
      else if(st !== lire("fdl_pin_vu", "")){ ecrire("fdl_pin_vu", st); ecrire("fdl_pin", {base:null}); }
    }
  }catch(e){}
  return lire("fdl_pin", null);
}
function verifierMaj(manuel, forcer){
  var url = DATA.source || "";
  if(!/^https:\/\//.test(url)) return Promise.resolve("sans-source");
  if(!manuel && Date.now() - lire("fdl_verif", 0) < 10*60*1000) return Promise.resolve("recent");
  ecrire("fdl_verif", Date.now());
  return telecharger(url + (url.indexOf("?")<0 ? "?" : "&") + "t=" + Date.now()).then(function(txt){
    var d = JSON.parse(txt);
    if(!valide(d)) throw new Error("fichier non valide");
    etat.enLigne = {maj: d.maj || "", periode: d.periode || "", periodes: d.periodes};
    var m1 = d.maj || "", m0 = DATA.maj || "";
    if(m1 === m0 && (d.periode || "") === (DATA.periode || "")) return "a-jour";
    if(!forcer){
      var pin = epingleActif();
      if(pin){
        /* 1re vérification après un chargement manuel : une version en ligne PLUS RÉCENTE que le fichier chargé
           est une publication faite après lui -> elle fait foi ; sinon elle est considérée comme l'ancienne version en ligne */
        if(pin.base === null && m1 <= m0){ pin.base = m1; ecrire("fdl_pin", pin); return "epingle"; }
        if(pin.base !== null && m1 === pin.base) return "epingle";
      }
    }
    appliquerMaj(d, txt);          /* publié en ligne et différent de ce que j'ai : il fait foi, même s'il est plus ancien */
    return "nouveau";
  }).catch(function(){ return "hors-ligne"; });
}
function fmtMaj(iso){

}
var CLES_STATUT = {"epingle":"st_epingle","a-jour":"st_ajour","nouveau":"st_nouveau","hors-ligne":"st_horsligne","encours":"st_encours"};
function statut(k){ return CLES_STATUT[k] ? T(CLES_STATUT[k]) : ""; }

function rappelsNatifs(parts, prefs, now){
  var out = [], maintenant = now || Date.now();
  parts.forEach(function(p){
    var jour = Math.floor(Date.UTC(p.date.getFullYear(), p.date.getMonth(), p.date.getDate()) / 86400000);
    var avec = p.equipe.map(function(n,i){ return (n && i!==p.role) ? ROLES[i][0]+" : "+n : null; }).filter(Boolean).join(" · ");
    var lec = lectDe(p.lect, p.role);
    var corps = fmtLong(p.date) + "\n" + ROLES[p.role][0] + " · " + ROLES[p.role][1] + " — " + fidirana(p) + " (" + p.g + ")" + (lec ? "\n📖 " + lec.t : "") + (avec ? "\n" + T("avec_mot") + " " + avec : "");
    if(prefs.veille){
      var a = avecHeure(new Date(p.date.getFullYear(), p.date.getMonth(), p.date.getDate()-1), prefs.hVeille).getTime();
      if(a > maintenant) out.push({id: jour*10+1, at: a, titre: T("demain") + " : " + ROLES[p.role][0] + " (" + p.g + ")", texte: corps});
    }
    if(prefs.jour){
      var b = avecHeure(p.date, prefs.hJour).getTime();
      if(b > maintenant) out.push({id: jour*10+2, at: b, titre: T("aujourdhui") + " : " + ROLES[p.role][0] + " (" + p.g + ")", texte: corps});
    }
  });
  return out;
}
function programmerNatifs(){

  try{ window.AndroidFDL.programmerRappels(JSON.stringify(liste)); }catch(e){}
  return liste.length;
}

}

function ongletGroupe(){
  var g = etat.moi.g, h = '<div class="carte"><h2>'+esc(T("groupe_titre").replace("{g}", g))+'</h2><div class="note">'+esc(T("note_surligne"))+'</div></div><div class="defil"><table><tr><th>'+esc(T("col_dimanche"))+'</th>';
  for(var i=0;i<(DATA.roles||4);i++) h += '<th>'+esc(ROLES[i][0])+'</th>';
  h += '</tr>';
  DATA.dimanches.forEach(function(it){
    if(it.g.indexOf(g) < 0) return;
    var d = parseDate(it.d), eq = it.a[g] || [];
    h += '<tr'+(jours(d)<0?' class="passe"':'')+'><td>'+esc(fmtCourt(d))+'</td>';
    for(var i=0;i<(DATA.roles||4);i++) h += '<td'+(eq[i]===etat.moi.n?' class="moi"':'')+'>'+esc(eq[i]||"—")+'</td>';
    h += '</tr>';
  });
  return h + '</table></div>';
}

function ongletDimanche(){
  var dates = DATA.dimanches.map(function(it){ return it.d; });
  if(!etat.dimanche || dates.indexOf(etat.dimanche) < 0){
    etat.dimanche = dates.filter(function(d){ return jours(parseDate(d)) >= 0; })[0] || dates[dates.length-1];
  }
  var h = '<div class="carte"><h2>'+esc(T("dimanche_titre"))+'</h2><select id="selDim">';
  dates.forEach(function(d){ h += '<option value="'+d+'"'+(d===etat.dimanche?' selected':'')+'>'+esc(fmtLong(parseDate(d)))+'</option>'; });
  h += '</select></div>';
  var it = DATA.dimanches.filter(function(x){ return x.d === etat.dimanche; })[0];
  if(it){
    it.g.forEach(function(g, k){
      var eq = it.a[g] || [];
      h += '<div class="carte"><h2>'+(it.g.length===1?'Fidirana tokana':'Fidirana '+(k+1)+'°')+' — '+esc(g)+'</h2>';
      eq.forEach(function(n,i){ var lj = lectDe(it.l, i); h += '<div class="ligne"><span class="d">'+esc(ROLES[i][0])+' · '+esc(ROLES[i][1])+(lj ? '<br>'+htmlLecture(lj) : '')+'</span><span class="g"'+(n===etat.moi.n && g===etat.moi.g?' style="background:#FFF3C4;padding:0 6px;border-radius:6px"':'')+'>'+esc(n||"—")+'</span></div>'; });
      h += '</div>';
    });
  }
  return h;
}

function evenementsCalendrier(parts, prefs){
  return parts.map(function(p){
    var debut = avecHeure(p.date, prefs.debut), fin = new Date(debut.getTime() + (prefs.duree||120)*60000);
    var autres = p.equipe.map(function(n,i){ return n ? ROLES[i][0]+" : "+n : null; }).filter(Boolean).join("\n");
    var alarmes = [];
    if(prefs.veille){ var mv = Math.round((debut - avecHeure(new Date(p.date.getFullYear(), p.date.getMonth(), p.date.getDate()-1), prefs.hVeille))/60000); if(mv > 0) alarmes.push(mv); }
    if(prefs.jour){ var mj = Math.round((debut - avecHeure(p.date, prefs.hJour))/60000); if(mj > 0) alarmes.push(mj); }
    return {cle:"fdl-"+p.iso+"-"+p.g, titre:"FDL — "+ROLES[p.role][0]+" ("+p.g+")", description:texteRappel(p)+"\n\n"+T("equipe_titre")+"\n"+autres,
            debut:debut.getTime(), fin:fin.getTime(), alarmes:alarmes};
  });
}
window.__retourCalendrier = function(code, n){
  var k = {ok:"cal_ok", refuse:"cal_refuse", aucun:"cal_aucun", erreur:"cal_erreur"}[code] || "cal_erreur";
  etat.statutCal = T(k).replace("{n}", n || 0);
  var el = document.getElementById("infoCal"); if(el) el.textContent = etat.statutCal;
};
function ajouterCalendrierApp(){
  var futures = partsMoi().filter(function(p){ return jours(p.date) >= 0; });
  var el = document.getElementById("infoCal");
  if(!futures.length){ etat.statutCal = T("aucune_part"); if(el) el.textContent = etat.statutCal; return; }
  etat.statutCal = T("cal_encours"); if(el) el.textContent = etat.statutCal;
  try{ window.AndroidFDL.ajouterAuCalendrier(JSON.stringify(evenementsCalendrier(futures, etat.prefs))); }
  catch(e){ window.__retourCalendrier("erreur", 0); }
}
function carteCalApp(){
  if(!(window.AndroidFDL && typeof window.AndroidFDL.ajouterAuCalendrier === "function")) return "";   /* ancienne version de l'application */
  var n = partsMoi().filter(function(p){ return jours(p.date) >= 0; }).length;
  return '<div class="carte"><h2>'+esc(T("cal_titre"))+'</h2><p class="note">'+esc(T("cal_aide_app"))+'</p>' +
         '<label class="opt"><span>'+esc(T("heure_debut"))+'</span> <input type="time" id="hDebut" value="'+esc(etat.prefs.debut)+'"></label>' +
         '<p class="note" id="infoCal">'+esc(etat.statutCal || "")+'</p>' +
         '<button class="bouton" id="btnCalApp">'+esc(T("btn_cal_app").replace("{n}", n))+'</button></div>';
}
function ongletRappelsApp(){
  var pr = etat.prefs, n = programmerNatifs();
  var h = '<div class="carte"><h2>'+esc(T("rapp_app_titre"))+'</h2>';
  h += '<p class="note">'+esc(T("rapp_app_texte"))+'</p>';
  h += '<label class="opt"><input type="checkbox" id="cVeille"'+(pr.veille?' checked':'')+'> <span>'+esc(T("la_veille"))+'</span> <input type="time" id="hVeille" value="'+esc(pr.hVeille)+'"></label>';
  h += '<label class="opt"><input type="checkbox" id="cJour"'+(pr.jour?' checked':'')+'> <span>'+esc(T("le_dimanche"))+'</span> <input type="time" id="hJour" value="'+esc(pr.hJour)+'"></label>';
  h += '<p>'+esc(T("n_rappels").replace("{n}", n))+'</p>';
  h += '<p class="note">'+esc(T("rapp_app_aide"))+'</p></div>';
  h += carteCalApp();
  h += carteMaj();
  h += '<div class="carte"><h2>'+esc(T("nouveau_prog_titre"))+'</h2><p class="note">'+esc(T("nouveau_prog_texte"))+'</p><button class="bouton" id="btnImport">'+esc(T("btn_charger_recu"))+'</button></div>';
  return h;
}

function ongletRappels(){
  if(EN_APP) return ongletRappelsApp();
  var pr = etat.prefs, n = partsMoi().filter(function(p){ return jours(p.date) >= 0; }).length;
  var h = '<div class="carte"><h2>'+esc(T("rapp_tel_titre"))+'</h2>';
  h += '<p class="note">'+esc(T("rapp_tel_texte"))+'</p>';
  h += '<label class="opt"><input type="checkbox" id="cVeille"'+(pr.veille?' checked':'')+'> <span>'+esc(T("la_veille"))+'</span> <input type="time" id="hVeille" value="'+esc(pr.hVeille)+'"></label>';
  h += '<label class="opt"><input type="checkbox" id="cJour"'+(pr.jour?' checked':'')+'> <span>'+esc(T("le_dimanche"))+'</span> <input type="time" id="hJour" value="'+esc(pr.hJour)+'"></label>';
  h += '<label class="opt"><span>'+esc(T("heure_debut"))+'</span> <input type="time" id="hDebut" value="'+esc(pr.debut)+'"></label>';
  h += '<button class="bouton" id="btnICS">'+esc(T("btn_ics").replace("{n}", n))+'</button>';
  h += '<p class="note">'+esc(T("ics_aide"))+'</p></div>';
  h += carteMaj();
  h += '<div class="carte"><h2>'+esc(T("popup_info_titre"))+'</h2><p class="note">'+esc(T("popup_info_texte"))+'</p></div>';
  return h;
}

function memoriserLangue(){
  if(DATA && DATA.langue && LANGUES.textes[DATA.langue]) ecrire("fdl_langue", DATA.langue);
  try{ if(EN_APP && window.AndroidFDL.definirLangue) window.AndroidFDL.definirLangue(langue()); }catch(e){}   /* messages natifs de l'application */
}
function appliquerTextesFixes(){
  memoriserLangue();
  var bl = document.getElementById("btnLangue");
  if(bl){ bl.hidden = !(DATA && DATA.langue_libre); bl.textContent = langue() === "mg" ? "Français" : "Malagasy"; bl.onclick = basculerLangue; }
  ROLES[4][0] = T("role5_court");
  ROLES[5][0] = T("role6_court");
  var h1 = document.querySelector("header h1"); if(h1) h1.textContent = T("titre");
  document.title = T("titre") + " — FJKM";
  var bc = document.getElementById("btnChanger"); if(bc) bc.textContent = T("btn_changer");
}
function render(){
  LECTS.length = 0;
  appliquerTextesFixes();
  var sous = document.getElementById("sous");
  sous.textContent = periodeTxt(DATA) || T("sous_defaut");
  if(!DATA.dimanches || !DATA.dimanches.length){ vueVide(); return; }
  if(!moiValide()){ etat.moi = null; vueChoix(); return; }
  if(EN_APP && etat.onglet !== "rappels") programmerNatifs();
  document.getElementById("btnChanger").hidden = false; nav.hidden = false;
  var h = '<div class="note" style="margin:0 2px 8px">'+esc(T("moi_ligne").replace("{n}", etat.moi.n).replace("{g}", etat.moi.g))+'</div>';
  if(etat.onglet === "moi") h += ongletMoi();
  else if(etat.onglet === "groupe") h += ongletGroupe();
  else if(etat.onglet === "dimanche") h += ongletDimanche();
  else h += ongletRappels();
  h += '<footer>'+esc(T("footer"))+' '+esc(DATA.genere ? fmtLong(parseDate(DATA.genere)) : "—")+'</footer>';
  app.innerHTML = h;
  var tabs = [["moi","🙋",T("nav_moi")],["groupe","👥",T("nav_groupe")],["dimanche","📅",T("nav_dimanche")],["rappels","🔔",T("nav_rappels")]];
  nav.innerHTML = tabs.map(function(t){ return '<button data-o="'+t[0]+'" class="'+(etat.onglet===t[0]?'actif':'')+'"><b>'+t[1]+'</b>'+esc(t[2])+'</button>'; }).join("");
  Array.prototype.forEach.call(nav.querySelectorAll("button"), function(b){ b.onclick = function(){ etat.onglet = b.getAttribute("data-o"); render(); window.scrollTo(0,0); }; });
  var s = document.getElementById("selDim"); if(s) s.onchange = function(){ etat.dimanche = s.value; render(); };
  if(etat.onglet === "rappels") branchRappels();
}

function branchRappels(){
  function maj(){
    etat.prefs.veille = document.getElementById("cVeille").checked;
    etat.prefs.jour = document.getElementById("cJour").checked;
    etat.prefs.hVeille = document.getElementById("hVeille").value || "18:00";
    etat.prefs.hJour = document.getElementById("hJour").value || "06:00";
    var hd = document.getElementById("hDebut"); if(hd) etat.prefs.debut = hd.value || "08:00";
    ecrire("fdl_prefs", etat.prefs);
  }
  ["cVeille","cJour","hVeille","hJour","hDebut"].forEach(function(id){
    var el = document.getElementById(id);
    if(el) el.onchange = function(){ maj(); if(EN_APP) render(); };
  });
  var bi = document.getElementById("btnICS"); if(bi) bi.onclick = function(){ maj(); telechargerICS(); };
  var bc = document.getElementById("btnCalApp"); if(bc) bc.onclick = function(){ maj(); ajouterCalendrierApp(); };
  var bm = document.getElementById("btnImport"); if(bm) bm.onclick = function(){ window.AndroidFDL.importerProgramme(); };
  var bu = document.getElementById("btnMaj"); if(bu) bu.onclick = function(){ lancerMaj(true); };
  var bf = document.getElementById("btnForcer"); if(bf) bf.onclick = function(){ lancerMaj(true, true); };
}

function popupRappel(){
  if(!moiValide()) return;
  var p = partsMoi().filter(function(x){ return jours(x.date) >= 0; })[0];
  if(!p) return;
  var n = jours(p.date), cle = "popup_" + p.iso + "_" + n;
  if(n > 1 || lireSession(cle)) return;
  ecrireSession(cle);
  var pop = document.getElementById("popup");
  var h = '<div class="boite"><h3>🔔 '+esc(n===0 ? T("popup_aujourdhui") : T("popup_demain"))+'</h3>';
  h += '<div>'+esc(fmtLong(p.date))+'</div><div class="role">'+esc(ROLES[p.role][0])+' · '+esc(ROLES[p.role][1])+'</div>';
  var lp = lectDe(p.lect, p.role); if(lp) h += '<div class="lecture">'+htmlLecture(lp)+'</div>';
  h += '<div class="note">'+esc(T("groupe_mot"))+' '+esc(p.g)+' · '+esc(fidirana(p))+'</div><ul>';
  p.equipe.forEach(function(nom,i){ if(nom && i!==p.role) h += '<li>'+esc(ROLES[i][0])+' : '+esc(nom)+'</li>'; });
  h += '</ul><button class="bouton" id="popOk">'+esc(T("popup_ok"))+'</button></div>';
  pop.innerHTML = h; pop.hidden = false;
  document.getElementById("popOk").onclick = function(){ pop.hidden = true; };
}

document.getElementById("btnChanger").onclick = function(){ effacer("fdl_moi"); etat.moi = null; etat.choixGroupe = null; render(); };

function fermerLecteur(){ document.getElementById("lecteur").hidden = true; }
function ouvrirLecteur(l){
  if(!l || !l.v || !l.v.length) return;
  var h = '<div class="boite"><h3>📖 ' + esc(l.t) + '</h3><div class="versets">';
  l.v.forEach(function(x){ h += '<p><sup>' + esc(x[0]) + '</sup>' + esc(x[1]) + '</p>'; });
  h += '</div><div class="src">' + esc(T("lecteur_source")) + ' — ' + esc(T("lecteur_note")) + '</div><div class="actions">';
  if(l.u && /^https?:\/\//.test(l.u)) h += '<a class="bouton sec" href="' + esc(l.u) + '"' + (EN_APP ? '' : ' target="_blank" rel="noopener"') + '>' + esc(T("lecteur_ouvrir")) + '</a>';
  h += '<button type="button" class="bouton" id="lecFermer">' + esc(T("lecteur_fermer")) + '</button></div></div>';
  var z = document.getElementById("lecteur"); z.innerHTML = h; z.hidden = false;
  document.getElementById("lecFermer").onclick = fermerLecteur;
  z.onclick = function(e){ if(e.target === z) fermerLecteur(); };
}
document.addEventListener("click", function(e){
  var b = e.target && e.target.closest ? e.target.closest("[data-lect]") : null;
  if(b){ e.preventDefault(); ouvrirLecteur(LECTS[+b.getAttribute("data-lect")]); }
});
document.addEventListener("keydown", function(e){ if(e.key === "Escape") fermerLecteur(); });
window.FDL = {ouvrirLecteur:ouvrirLecteur, evenementsCalendrier:evenementsCalendrier, DATA:DATA, etat:etat, mesParticipations:mesParticipations, construireICS:construireICS, dureeICS:dureeICS, render:render, popupRappel:popupRappel, jours:jours, rappelsNatifs:rappelsNatifs, programmerNatifs:programmerNatifs, EN_APP:EN_APP, verifierMaj:verifierMaj, lancerMaj:lancerMaj, getData:function(){ return DATA; }};
render();
popupRappel();
lancerMaj(false);
document.addEventListener("visibilitychange", function(){ if(document.visibilityState === "visible") lancerMaj(false); });
})();
</script>
</body>
</html>
