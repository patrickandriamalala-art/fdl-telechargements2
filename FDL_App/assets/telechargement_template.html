<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17067A">
<title>FJKM — Téléchargements FDL</title>
<link rel="icon" href="__ICONE__">
<link rel="apple-touch-icon" href="__ICONE__">
<style>
:root{--navy:#17067A;--navy2:#3A2F9E;--fond:#EEF1F9;--carte:#fff;--texte:#1B1B3A;--doux:#5A5F80;--bord:#D5DAEE}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--fond);color:var(--texte);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.45}
header{background:#fff;border-bottom:4px solid var(--navy);padding:calc(8px + env(safe-area-inset-top)) 14px 8px;display:flex;align-items:center;gap:12px}
header img{height:56px;width:auto}
header .titre{flex:1;min-width:0}
header h1{font-size:19px;margin:0;color:var(--navy)}
header .sous{font-size:13px;color:var(--doux)}
header button{background:none;border:1px solid var(--bord);color:var(--navy);border-radius:8px;padding:7px 11px;font-size:14px}
main{padding:14px 12px calc(30px + env(safe-area-inset-bottom));max-width:680px;margin:0 auto}
.carte{background:var(--carte);border:1px solid var(--bord);border-radius:14px;padding:14px;margin-bottom:12px}
.fichier{display:flex;gap:12px;align-items:center}
.fichier .ico{font-size:34px;line-height:1}
.fichier .txt{flex:1;min-width:0}
.fichier .nom{font-weight:700;color:var(--navy)}
.fichier .info{font-size:13px;color:var(--doux)}
.bouton{display:block;text-decoration:none;text-align:center;background:var(--navy);color:#fff;border-radius:12px;padding:12px 16px;font-size:17px;font-weight:700;white-space:nowrap}
.bouton:active{background:var(--navy2)}
.bouton.sec{background:#fff;color:var(--navy);border:2px solid var(--navy);padding:10px 14px}
.actions{display:flex;flex-direction:column;gap:8px}
.aide-import{font-size:14px;color:var(--doux);margin:-4px 4px 12px}
details.aide{background:#fff;border:1px solid var(--bord);border-radius:14px;padding:12px 14px;margin-bottom:12px}
details.aide summary{font-weight:700;color:var(--navy);cursor:pointer}
details.aide ol{padding-left:20px;margin:10px 0 6px}
details.aide li{margin-bottom:6px}
.note{font-size:14px;color:var(--doux)}
.alerte{background:#FFF8E1;border:1px solid #F0DDA0;border-radius:10px;padding:8px 10px;font-size:14px;margin-top:8px}
footer{text-align:center;font-size:12px;color:var(--doux);padding:4px 12px 16px}
</style>
</head>
<body>
<header>
  <img src="__LOGO__" alt="FJKM">
  <div class="titre"><h1 id="h1"></h1><div class="sous" id="sous"></div></div>
  <button id="btnLangue" type="button"></button>
</header>
<main id="app"></main>
<footer id="pied"></footer>

<script id="donnees" type="application/json">__DONNEES__</script>
<script>
(function(){
"use strict";
var D = JSON.parse(document.getElementById("donnees").textContent);
var TXT = {
  fr: {titre:"Téléchargements FDL", sous:"Choisissez ce que vous voulez télécharger.", dl:"Télécharger", ouvrir:"Ouvrir", taille:"Taille",
       aide_titre:"Comment installer l'application Android",
       etapes:["Touchez « Télécharger » et attendez la fin du téléchargement.",
               "Ouvrez le fichier téléchargé (dans les notifications ou l'application Fichiers).",
               "Si Android le demande, autorisez l'installation depuis cette source (Chrome ou Fichiers), puis revenez en arrière.",
               "Touchez « Installer ». Si un avertissement Play Protect apparaît, choisissez « Installer quand même ».",
               "Ouvrez l'application, acceptez les notifications, puis chargez le programme ou choisissez votre groupe et votre nom."],
       ancienne:"Si vous avez déjà une ancienne version de l'application, désinstallez-la d'abord.",
       iphone:"iPhone : l'application Android ne s'installe pas. Utilisez la « Page du programme » : elle s'ouvre dans le navigateur.",
       import_aide:"Pour l'application Android : touchez « Télécharger », puis dans l'application touchez « Charger le programme » et choisissez le fichier {nom} (dossier Téléchargements).",
       pied:"Mis à jour le {d}", autre:"Fichier"},
  mg: {titre:"Fisintonana FDL", sous:"Safidio izay tianao hosintonina.", dl:"Sintony", ouvrir:"Sokafy", taille:"Habe",
       aide_titre:"Ahoana ny fametrahana ny rindranasa Android",
       etapes:["Tsindrio ny « Sintony » ary andraso hatramin'ny farany ny fisintonana.",
               "Sokafy ny rakitra voasintona (ao amin'ny fampandrenesana na ny rindranasa Rakitra).",
               "Raha angatahin'ny Android, avelao ny fametrahana avy amin'ity loharano ity (Chrome na Rakitra), avy eo miverena.",
               "Tsindrio ny « Hametraka ». Raha misy fampitandremana Play Protect, fidio ny « Hametraka na izany aza ».",
               "Sokafy ny rindranasa, avelao ny fampandrenesana, avy eo ampidiro ny fandaharana na fidio ny vondronao sy ny anaranao."],
       ancienne:"Raha efa manana dikan-teny taloha ianao, esory aloha izany.",
       iphone:"iPhone : tsy azo apetraka ny rindranasa Android. Ampiasao ny « Pejy fandaharana » : misokatra ao amin'ny navigateur izany.",
       import_aide:"Ho an'ny rindranasa Android : tsindrio ny « Sintony », dia ao amin'ny rindranasa tsindrio ny « Ampidiro ny fandaharana » ary fidio ny rakitra {nom} (ao amin'ny lahatahiry Fisintonana).",
       pied:"Nohavaozina tamin'ny {d}", autre:"Rakitra"}
};
var ICONES = {apk:"📱", page:"🌐", autre:"📄"};

function lire(k){ try{ return JSON.parse(window.localStorage.getItem(k)); }catch(e){ return null; } }
function ecrire(k,v){ try{ window.localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function langue(){ var c = D.langue_libre ? lire("dl_langue") : null; if(c && TXT[c]) return c; return TXT[D.langue_defaut] ? D.langue_defaut : "fr"; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function taille(o, l){
  if(o < 1024*1024) return Math.max(1, Math.round(o/1024)) + " Ko";
  var m = (o/1048576).toFixed(1); return (l === "fr" ? m.replace(".", ",") : m) + " Mo";
}

function render(){
  var l = langue(), T = TXT[l];
  document.documentElement.lang = l === "mg" ? "mg" : "fr";
  document.title = "FJKM — " + (D.titre && D.titre[l] ? D.titre[l] : T.titre);
  document.getElementById("h1").textContent = (D.titre && D.titre[l]) || T.titre;
  document.getElementById("sous").textContent = T.sous;
  var bl = document.getElementById("btnLangue"); bl.hidden = !D.langue_libre; bl.textContent = l === "mg" ? "Français" : "Malagasy"; bl.onclick = function(){ ecrire("dl_langue", l === "mg" ? "fr" : "mg"); render(); };
  var h = "", aApk = false, aPage = false;
  D.fichiers.forEach(function(f){
    if(f.type === "apk") aApk = true; if(f.type === "page") aPage = true;
    var lib = f["libelle_" + l] || f.libelle_fr || f.nom;
    var ouvre = f.type === "page";
    var boutons = ouvre
      ? '<a class="bouton" href="' + esc(f.href) + '">' + esc(T.ouvrir) + '</a><a class="bouton sec" href="' + esc(f.href) + '" download>' + esc(T.dl) + '</a>'
      : '<a class="bouton" href="' + esc(f.href) + '" download>' + esc(T.dl) + '</a>';
    h += '<div class="carte fichier"><div class="ico">' + (ICONES[f.type] || ICONES.autre) + '</div>' +
         '<div class="txt"><div class="nom">' + esc(lib) + '</div><div class="info">' + esc(T.taille) + ' : ' + esc(taille(f.octets, l)) + '</div></div>' +
         '<div class="actions">' + boutons + '</div></div>';
    if(ouvre) h += '<div class="aide-import">' + esc(T.import_aide.replace("{nom}", f.nom)) + '</div>';
  });
  if(aApk){
    h += '<details class="aide"><summary>' + esc(T.aide_titre) + '</summary><ol>' + T.etapes.map(function(e){ return '<li>' + esc(e) + '</li>'; }).join("") + '</ol>' +
         '<div class="alerte">' + esc(T.ancienne) + '</div>' + (aPage ? '<div class="alerte">' + esc(T.iphone) + '</div>' : '') + '</details>';
  }
  document.getElementById("app").innerHTML = h;
  document.getElementById("pied").textContent = T.pied.replace("{d}", (D.maj && D.maj[l]) || "");
}
window.DL = {render: render, D: D};
render();
})();
</script>
</body>
</html>
